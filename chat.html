<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Private Chat - Chat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2a32">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Private Chat">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @view-transition { navigation: auto; }
  :root{
    --bbm-blue-dark:#0b141a;
    --bbm-blue:#1b2a32;
    --bbm-blue-light:#233138;
    --bg:#121b22;
    --card-bg:#1b2a32;
    --ink:#e9edf0;
    --ink-soft:#aab8c2;
    --muted:#8696a0;
    --border:#2a3942;
  }
  *{box-sizing:border-box;}
  html{ overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  body{
    overscroll-behavior:none; touch-action:pan-y; user-select:none; -webkit-touch-callout:none;
    margin:0; font-family:'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    position:fixed; inset:0; width:100%; height:100%; overflow:hidden;
    display:flex; align-items:flex-start; justify-content:center; -webkit-font-smoothing:antialiased;
  }
  input, textarea{ user-select:text; }
  .phone{
    width:100%; max-width:420px; height:100%; background:var(--bg);
    box-shadow:0 0 40px rgba(0,0,0,0.5); display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  #authGate{ position:absolute; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center; justify-content:center; }
  #authGate .spinner{ width:32px; height:32px; border-radius:50%; border:3px solid var(--border); border-top-color:#53bdeb; animation:authSpin .75s linear infinite; }
  @keyframes authSpin{ to{ transform:rotate(360deg); } }
  .appbar{
    background:linear-gradient(120deg,var(--bbm-blue-dark),var(--bbm-blue) 55%,var(--bbm-blue-light));
    color:#fff; padding:calc(12px + env(safe-area-inset-top)) 14px 12px; display:flex; align-items:center; gap:10px;
    flex-shrink:0; box-shadow:0 3px 10px rgba(0,0,0,0.3); position:relative; z-index:10;
  }
  .appbar .back{ cursor:pointer; width:34px;height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s ease; }
  .appbar .back:active{ background:rgba(255,255,255,0.16); }
  .appbar .avatar{ width:38px;height:38px;border-radius:50%; display:flex;align-items:center;justify-content:center; color:#fff;font-weight:700;font-size:14px;flex-shrink:0; box-shadow:0 0 0 2px rgba(255,255,255,0.35); }
  .appbar .who{flex:1;min-width:0;}
  .appbar .uname{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .appbar .sub{font-size:11.5px;opacity:0.82;margin-top:1px;}
  .appbar .sub.online{opacity:1;color:#2ecc71;font-weight:600;}
  .status-dot{ display:inline-block; width:8px;height:8px; border-radius:50%; margin-left:6px; background:#8696a0; vertical-align:middle; box-shadow:0 0 0 2px rgba(255,255,255,0.25); }
  .status-dot.online{ background:#2ecc71; }
  .e2e-lock{ width:26px;height:26px; border-radius:50%; background:rgba(83,189,235,0.16); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .appbar .menu-btn{ cursor:pointer; width:34px;height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s ease; position:relative; }
  .appbar .menu-btn:active{ background:rgba(255,255,255,0.16); }
  .chat-menu{ position:absolute; top:calc(100% + 6px); right:10px; background:var(--card-bg); border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,0.5); min-width:180px; overflow:hidden; z-index:50; display:none; }
  .chat-menu.open{display:block;}
  .chat-menu .item{ padding:13px 16px; font-size:14.5px; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); }
  .chat-menu .item:last-child{border-bottom:none;}
  .chat-menu .item:active{background:var(--border);}
  .chat-menu .item.danger{color:#f15c6d;}
  .chat-menu .item.ping{color:#e08a00;font-weight:600;}
  .ptr-indicator{ display:flex; align-items:center; justify-content:center; height:0; overflow:hidden; flex-shrink:0; background:var(--bg); }
  .ptr-spinner{ width:22px; height:22px; border-radius:50%; border:2.5px solid var(--border); border-top-color:var(--border); }
  .ptr-indicator.loading .ptr-spinner{ border-top-color:#53bdeb; animation:authSpin .7s linear infinite; }
  .msg-area{
    flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 12px 6px; display:flex; flex-direction:column; gap:2px;
    background-color:var(--bg); background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0); background-size:20px 20px; scroll-behavior:smooth;
  }
  .msg-area::-webkit-scrollbar{ width:6px; }
  .msg-area::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.1); border-radius:3px; }
  .e2e-banner{
    align-self:center; max-width:88%; text-align:center; background:rgba(83,189,235,0.1); border:1px solid rgba(83,189,235,0.22);
    color:#bcdff2; font-size:11.5px; line-height:16px; padding:9px 14px; border-radius:10px; margin:6px 0 12px; flex-shrink:0;
    display:flex; align-items:center; gap:7px; cursor:pointer;
  }
  .e2e-banner .e2e-learn{ font-weight:700; color:#53bdeb; text-decoration:underline; }

  /* ---- Popup "Pelajari selengkapnya" enkripsi E2E ---- */
  .e2e-info-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:flex-end; justify-content:center; z-index:320; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .e2e-info-overlay.open{ opacity:1; pointer-events:auto; }
  .e2e-info-sheet{ width:100%; max-width:420px; background:var(--card-bg); border:1px solid var(--border); border-top-left-radius:22px; border-top-right-radius:22px; padding:10px 24px calc(28px + env(safe-area-inset-bottom)); box-shadow:0 -10px 40px rgba(0,0,0,0.5); transform:translateY(16px); transition:transform .2s ease; text-align:center; }
  .e2e-info-overlay.open .e2e-info-sheet{ transform:translateY(0); }
  .e2e-info-grip{ width:36px; height:4px; border-radius:3px; background:var(--border); margin:0 auto 18px; }
  .e2e-info-icon{ width:64px; height:64px; border-radius:18px; background:rgba(83,189,235,0.14); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
  .e2e-info-icon svg{ width:30px; height:30px; stroke:#53bdeb; }
  .e2e-info-sheet h3{ font-size:18px; font-weight:700; color:var(--ink); margin:0 0 12px; line-height:1.35; }
  .e2e-info-sheet p{ font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin:0 0 22px; }
  .e2e-info-close-btn{ width:100%; padding:13px 0; background:rgba(83,189,235,0.14); color:#53bdeb; border:1px solid rgba(83,189,235,0.3); border-radius:12px; font-size:14.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .e2e-info-close-btn:active{ background:rgba(83,189,235,0.22); }
  .e2e-banner svg{width:14px;height:14px;flex-shrink:0;stroke:#53bdeb;}
  .day-sep{
    align-self:center; position:sticky; top:6px; background:rgba(27,42,50,0.88); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    color:var(--ink-soft); font-size:11px; font-weight:600; padding:5px 13px; border-radius:20px; margin:12px 0 10px; flex-shrink:0; box-shadow:0 1px 5px rgba(0,0,0,0.2); z-index:3;
  }
  .bubble-row{ display:flex; align-items:flex-end; width:100%; flex-shrink:0; margin:3px 0; animation:bubbleIn .2s ease both; }
  @keyframes bubbleIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .bubble-row.mine{justify-content:flex-end;}
  .bubble-row.theirs{justify-content:flex-start;}
  .bubble-row.sending .bubble{ opacity:0.6; transition:opacity .15s ease; }
  .bubble-row.send-failed .bubble{ opacity:1; background:#3f1d24 !important; border:1px solid #f15c6d; }
  .bubble-row.send-failed .bubble::after{ content:"⚠ Gagal terkirim"; display:block; font-size:10.5px; color:#f15c6d; margin-top:3px; }
  .bubble{
    display:flex; flex-direction:column; align-items:flex-end; max-width:78%; width:fit-content; padding:8px 11px 6px; border-radius:16px;
    font-size:14.5px; line-height:20px; word-wrap:break-word; overflow-wrap:break-word; box-shadow:0 1px 2px rgba(0,0,0,0.2);
  }
  .bubble-row.mine .bubble{ background:#005c4b; border:1px solid #005c4b; border-top-right-radius:4px; color:#e9edf0; }
  .bubble-row.theirs .bubble{ background:var(--card-bg); border:1px solid var(--border); border-top-left-radius:4px; }
  .bubble .txt{ align-self:stretch; min-width:36px; text-align:left; white-space:pre-wrap; word-wrap:break-word; }
  .bubble .meta{ display:flex; align-items:center; gap:4px; margin-top:3px; font-size:10.5px; color:var(--ink-soft); white-space:nowrap; }
  .empty-state{ margin:auto; text-align:center; color:var(--muted); font-size:13.5px; padding:32px 30px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .empty-state .es-icon{ width:54px;height:54px; border-radius:50%; background:var(--card-bg); display:flex;align-items:center;justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  .empty-state .es-title{ font-size:14px; font-weight:600; color:var(--ink); }
  .loading-spinner{ width:30px;height:30px; border:3px solid var(--border); border-top-color:#005c4b; border-radius:50%; animation:spin .75s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .input-bar{ display:flex; align-items:flex-end; gap:8px; padding:10px 10px calc(10px + env(safe-area-inset-bottom)); background:var(--card-bg); border-top:1px solid var(--border); flex-shrink:0; }
  .input-bar textarea{ flex:1; resize:none; border:1.5px solid var(--border); border-radius:22px; padding:11px 17px; font-size:14.5px; font-family:inherit; outline:none; max-height:100px; background:var(--bg); color:var(--ink); transition:border-color .15s ease; }
  .input-bar textarea::placeholder{ color:var(--muted); }
  .input-bar textarea:disabled{background:var(--border);color:var(--muted);}
  .input-bar textarea:focus{ border-color:#005c4b; box-shadow:none; }
  .send-btn{ width:43px;height:43px; border-radius:50%; background:linear-gradient(135deg,#005c4b,#004236); border:none; display:flex;align-items:center;justify-content:center; cursor:pointer; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,0.3); }
  .send-btn:not(:disabled):active{ transform:scale(0.94); }
  .send-btn:disabled{background:var(--border);box-shadow:none;}
  .confirm-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity .18s ease; padding:24px; }
  .confirm-overlay.open{ opacity:1; pointer-events:auto; }
  .confirm-box{ background:var(--card-bg); border:1px solid var(--border); border-radius:16px; width:100%; max-width:320px; padding:22px 20px 16px; box-shadow:0 10px 40px rgba(0,0,0,0.5); transform:translateY(10px) scale(0.97); transition:transform .18s ease; }
  .confirm-overlay.open .confirm-box{ transform:translateY(0) scale(1); }
  .confirm-title{ font-size:16px; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .confirm-msg{ font-size:13.5px; line-height:19px; color:var(--ink-soft); margin-bottom:20px; }
  .confirm-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .confirm-actions button{ border:none; border-radius:10px; padding:10px 16px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .confirm-cancel{ background:var(--border); color:var(--ink); }
  .confirm-cancel:active{ background:var(--bbm-blue-light); }
  .confirm-ok{ background:#f15c6d; color:#1b0a0c; }
  .confirm-ok:active{ background:#e14758; }

  /* ---- Modal PIN Enkripsi (restore key / tawarkan setel key) ---- */
  .kmodal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; z-index:300; opacity:0; pointer-events:none; transition:opacity .2s ease; padding:24px; }
  .kmodal-overlay.open{ opacity:1; pointer-events:auto; }
  .kmodal{ background:var(--card-bg); border:1px solid var(--border); border-radius:16px; width:100%; max-width:340px; padding:24px 20px 20px; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
  .kmodal .km-icon{width:46px;height:46px;border-radius:50%;background:rgba(83,189,235,0.14);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .kmodal .km-icon svg{width:22px;height:22px;stroke:#53bdeb;}
  .kmodal h3{font-size:16px;margin:0 0 6px;color:var(--ink);}
  .kmodal p{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 16px;}
  .kmodal .field{margin-bottom:12px;}
  .kmodal .input-wrap{display:flex;align-items:center;gap:2px;border:1.5px solid var(--border);border-radius:11px;background:var(--bg);padding:0 12px;}
  .kmodal .input-wrap:focus-within{border-color:#53bdeb;}
  .kmodal .input-wrap svg{width:16px;height:16px;color:var(--muted);flex-shrink:0;stroke:var(--muted);}
  .kmodal .input-wrap input{border:none;outline:none;background:transparent;padding:12px 8px;font-size:14.5px;width:100%;color:var(--ink);font-family:inherit;}
  .kmodal .toggle-pw{font-size:10.5px;color:#53bdeb;font-weight:700;cursor:pointer;letter-spacing:0.5px;flex-shrink:0;}
  .kmodal .hint{font-size:11.5px;min-height:14px;margin-top:2px;color:var(--muted);}
  .kmodal .hint.err{color:#f15c6d;}
  .kmodal .btn{width:100%;padding:13px 0;background:linear-gradient(135deg,#53bdeb,#1f8fc7);color:#062733;border:none;border-radius:11px;font-size:14.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;}
  .kmodal .btn .spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(6,39,51,0.3);border-top-color:#062733;animation:spin .7s linear infinite;display:none;}
  .kmodal .btn.loading .spinner{display:inline-block;}
  .kmodal .btn:disabled{cursor:default;opacity:0.85;}
  .kmodal .skip-link{display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:14px;cursor:pointer;text-decoration:underline;}

  /* ---- Halaman "Pulihkan pesan dengan PIN" (restore key, login device baru) ---- */
  .kpage-overlay{ position:fixed; inset:0; background:var(--bg); z-index:300; display:flex; flex-direction:column; opacity:0; pointer-events:none; transition:opacity .18s ease; }
  .kpage-overlay.open{ opacity:1; pointer-events:auto; }
  .kpage-top{ display:flex; align-items:center; justify-content:space-between; padding:calc(14px + env(safe-area-inset-top)) 16px 4px; flex-shrink:0; }
  .kpage-back{ background:none; border:none; color:var(--ink); padding:8px; margin:-8px; cursor:pointer; display:flex; align-items:center; border-radius:50%; }
  .kpage-back:active{ background:rgba(255,255,255,0.08); }
  .kpage-skip{ background:none; border:none; color:#53bdeb; font-size:15px; font-weight:600; cursor:pointer; padding:8px; margin:-8px; font-family:inherit; }
  .kpage-body{ padding:26px 22px 0; flex:1; overflow-y:auto; }
  .kpage-title-row h2{ font-size:23px; font-weight:700; line-height:1.3; margin:0 0 26px; color:var(--ink); max-width:300px; }
  .kpage-title-row h2.has-sub{ margin-bottom:10px; }
  .kpage-sub{ font-size:13px; color:var(--muted); line-height:1.55; margin:0 0 24px; max-width:300px; }
  .pin-boxes{ display:flex; gap:9px; margin-bottom:16px; }
  .pin-box{ width:100%; aspect-ratio:4/5; min-width:0; text-align:center; font-size:22px; font-weight:700; color:var(--ink); background:var(--card-bg); border:1.5px solid var(--border); border-radius:12px; outline:none; font-family:inherit; caret-color:#53bdeb; }
  .pin-box::placeholder{ color:var(--muted); font-weight:400; }
  .pin-box:focus{ border-color:#53bdeb; }
  .kpage-forgot{ display:inline-block; color:#53bdeb; font-size:14px; font-weight:500; cursor:pointer; }
  .kpage-body .hint{ font-size:12.5px; min-height:16px; margin-top:10px; color:var(--muted); }
  .kpage-body .hint.err{ color:#f15c6d; font-weight:600; }

  /* ---- Halaman konfirmasi danger (Lupa PIN): ditumpuk di atas halaman lain ---- */
  .kpage-overlay-danger{ z-index:310; }
  .kpage-body-center{ display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:36px; }
  .kpage-warn-icon{ width:60px;height:60px;border-radius:50%; background:rgba(241,92,109,0.14); display:flex;align-items:center;justify-content:center; margin-bottom:20px; flex-shrink:0; }
  .kpage-warn-title{ font-size:20px; font-weight:700; color:var(--ink); margin:0 0 12px; max-width:280px; }
  .kpage-actions{ display:flex; flex-direction:column; gap:10px; padding:16px 22px calc(20px + env(safe-area-inset-bottom)); flex-shrink:0; }
  .kpage-btn-cancel{ width:100%; padding:14px 0; background:var(--card-bg); color:var(--ink); border:1.5px solid var(--border); border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  .kpage-btn-cancel:active{ background:var(--border); }
  .kpage-btn-danger{ width:100%; padding:14px 0; background:linear-gradient(135deg,#f15c6d,#c8394a); color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px; }
  .kpage-btn-danger .spinner{ width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;animation:spin .7s linear infinite;display:none; }
  .kpage-btn-danger.loading .spinner{ display:inline-block; }
  .kpage-btn-danger:disabled{ opacity:0.85; cursor:default; }

  /* ---- Banner: ajakan buat PIN Enkripsi (di atas area pesan) ---- */
  .pin-banner{ display:none; flex-shrink:0; background:var(--card-bg); border-bottom:1px solid var(--border); padding:14px; gap:12px; align-items:flex-start; }
  .pin-banner.show{ display:flex; }
  .pin-banner .pb-icon{ width:36px;height:36px;border-radius:10px; background:rgba(83,189,235,0.14); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pin-banner .pb-icon svg{ width:18px;height:18px; stroke:#53bdeb; }
  .pin-banner .pb-body{ flex:1; min-width:0; }
  .pin-banner .pb-title{ font-size:14px; font-weight:700; color:var(--ink); margin-bottom:3px; }
  .pin-banner .pb-sub{ font-size:12px; color:var(--muted); line-height:1.45; margin-bottom:10px; }
  .pin-banner .pb-actions{ display:flex; gap:10px; align-items:center; }
  .pin-banner .pb-btn{ background:#53bdeb; color:#062733; border:none; border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .pin-banner .pb-btn:active{ transform:scale(0.97); }
  .pin-banner .pb-dismiss{ background:none; border:none; color:var(--muted); font-size:12px; font-weight:600; cursor:pointer; padding:8px 4px; }
</style>
<script src="device-gate.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js?v=3"></script>
<script src="e2e.js?v=4"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js');});}</script>
</head>
<body>
<div class="phone">
  <div id="authGate"><div class="spinner"></div></div>
  <div class="appbar">
    <div class="back" onclick="window.location.href='dashboard.html'"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="avatar" id="peerAvatar" style="cursor:pointer;">?</div>
    <div class="who" id="peerWho" style="cursor:pointer;"><div class="uname"><span id="peerUname">@—</span><span class="status-dot" id="statusDot"></span></div><div class="sub" id="peerSub">-</div></div>
    <div class="e2e-lock" id="e2eLock" title="Pesan di chat ini dienkripsi end-to-end"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#53bdeb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></div>
    <div class="menu-btn" id="menuBtn"><svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      <div class="chat-menu" id="chatMenu">
        <div class="item danger" id="menuHapusPermanen">Hapus Semua Orang</div><div class="item danger" id="menuHapusKontak">Hapus Kontak</div><div class="item ping" id="menuPing">🔔 PING!!!</div>
      </div>
    </div>
  </div>
  <div class="ptr-indicator" id="chatPtr"><div class="ptr-spinner"></div></div>
  <div class="msg-area" id="msgArea"><div class="empty-state"><div class="loading-spinner"></div><span>Memuat percakapan…</span></div></div>

  <!-- Popup "Pelajari selengkapnya" tentang enkripsi end-to-end, dipicu dari banner di atas area pesan -->
  <div class="e2e-info-overlay" id="e2eInfoOverlay">
    <div class="e2e-info-sheet">
      <div class="e2e-info-grip"></div>
      <div class="e2e-info-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></div>
      <h3>Obrolan Anda bersifat privat</h3>
      <p>Enkripsi end-to-end menjaga pesan pribadi hanya diketahui oleh Anda dan orang yang Anda pilih. Tidak seorang pun di luar obrolan ini, termasuk kami, bisa membaca atau membagikannya.</p>
      <button type="button" class="e2e-info-close-btn" id="e2eInfoCloseBtn">Mengerti</button>
    </div>
  </div>
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <div class="confirm-title" id="confirmTitle">Konfirmasi</div>
      <div class="confirm-msg" id="confirmMsg"></div>
      <div class="confirm-actions">
        <button class="confirm-cancel" id="confirmCancelBtn">Batal</button>
        <button class="confirm-ok" id="confirmOkBtn">Hapus</button>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="msgInput" rows="1" placeholder="Ketik pesan..." disabled></textarea>
    <button class="send-btn" id="sendBtn" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const rawUid = params.get('uid');
  const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  const peerId = (rawUid && UUID_RE.test(rawUid)) ? rawUid : null;
  let currentUserId = null; let peerUsername = params.get('uname') || '';
  let myPrivateKey = null, sharedKey = null, peerPublicKeyB64 = null;
  const msgArea = document.getElementById('msgArea'), msgInput = document.getElementById('msgInput'), sendBtn = document.getElementById('sendBtn'), peerAvatar = document.getElementById('peerAvatar'), peerUnameEl = document.getElementById('peerUname');
  const colorPalette = ['#c77b8c','#3a3f47','#2f6b3a','#5b6b74','#2c2c2c','#7c3f9e','#8a7a4a','#1a7fc2'];
  function colorFor(id){let hash=0;for(let i=0;i<id.length;i++)hash=id.charCodeAt(i)+((hash<<5)-hash);return colorPalette[Math.abs(hash)%colorPalette.length];}
  function initials(u){return (u||'?').slice(0,2).toUpperCase();}
  function normalizeText(str){if(!str)return'';str=str.replace(/[\r\v\f\u2028\u2029]/g,'\n');const lines=str.split('\n').map(l=>l.replace(/[ \t]+$/,''));const out=[];let blankRun=0;for(const line of lines){if(line.trim()===''){blankRun++;if(blankRun<=1)out.push('');}else{blankRun=0;out.push(line);}}return out.join('\n').trim();}
  function timeLabel(iso){return new Date(iso).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});}
  if(peerId){
    const goProfil=()=>window.location.href=`profil.html?uid=${peerId}`;
    document.getElementById('peerAvatar').addEventListener('click',goProfil);
    document.getElementById('peerWho').addEventListener('click',goProfil);
  }
  function dayLabel(iso){const d=new Date(iso),t=new Date(),y=new Date();y.setDate(t.getDate()-1);const s=(a,b)=>a.toDateString()===b.toDateString();if(s(d,t))return'Hari ini';if(s(d,y))return'Kemarin';return d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});}
  function tickSvg(del,read){
    if(read) return `<svg viewBox="0 0 20 15" width="16" height="12" fill="none" stroke="#53bdeb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L11.2 3"/><path d="M6.2 7.6l3.3 3.3L18.5 3"/></svg>`;
    if(del) return `<svg viewBox="0 0 20 15" width="16" height="12" fill="none" stroke="#8696a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L11.2 3"/><path d="M6.2 7.6l3.3 3.3L18.5 3"/></svg>`;
    return `<svg viewBox="0 0 16 15" width="13" height="12" fill="none" stroke="#8696a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L14 3"/></svg>`;
  }
  async function init(){
    try{
      if(!peerId){window.location.href='dashboard.html';return;}
      const {data:{session},error:sessErr} = await supabaseClient.auth.getSession();
      if(sessErr) throw sessErr;
      if(!session){window.location.replace('index.html');return;}
      currentUserId=session.user.id;
      // Device baru otomatis dapat keypair baru (tidak ada restore/backup PIN,
      // mirip default WhatsApp: chat lama tidak terbaca lagi di device baru).
      let kp=await E2E.ensureKeypair(currentUserId);
      myPrivateKey=kp.privateKey;
      document.getElementById('authGate').style.display='none';
      const {data:rel,error:relErr}=await supabaseClient.from('contacts').select('id, status').or(`and(requester_id.eq.${currentUserId},addressee_id.eq.${peerId}),and(requester_id.eq.${peerId},addressee_id.eq.${currentUserId})`).eq('status','accepted').maybeSingle();
      if(relErr) throw relErr;
      if(!rel){msgArea.innerHTML=`<div class="empty-state"><div class="es-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#8696a0" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c0-3.6 3-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/><path d="M18 8v5M15.5 10.5h5"/></svg></div><div class="es-title">Belum berteman</div><span>Tambahkan lewat tab Kontak dulu ya.</span></div>`;return;}
      const {data:prof,error:profErr}=await supabaseClient.from('profiles').select('username, public_key').eq('id',peerId).maybeSingle();
      if(profErr) throw profErr;
      if(!peerUsername) peerUsername=prof?prof.username:'Pengguna';
      peerPublicKeyB64=prof&&prof.public_key?prof.public_key:null;
      if(myPrivateKey&&peerPublicKeyB64) sharedKey=await E2E.getSharedKey(myPrivateKey,peerId,peerPublicKeyB64);
      peerAvatar.textContent=initials(peerUsername);peerAvatar.style.background=colorFor(peerId);peerUnameEl.textContent=peerUsername;
      updateInputAvailability();
      await loadMessages();await markIncomingAsRead();subscribeRealtime();subscribePresence();subscribePeerKeyChange();
    }catch(err){
      console.error('init error:',err);
      document.getElementById('authGate').style.display='none';
      msgArea.innerHTML=`<div class="empty-state"><div class="es-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#f15c6d" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></div><div class="es-title">Gagal memuat percakapan</div><span>Cek koneksi internet lalu tarik-turun atau buka ulang chat ini.</span></div>`;
    }
  }

  // ---- Input dikunci selama belum ada sharedKey (lawan bicara belum pernah
  // buka aplikasi buat publish public key-nya). ----
  function updateInputAvailability(){
    msgInput.disabled=!sharedKey;
    if(sharedKey) return;
    msgInput.placeholder = 'Menunggu '+(peerUsername||'lawan bicara')+' membuka aplikasi buat aktifkan enkripsi...';
  }

  const peerSubEl=document.getElementById('peerSub'),statusDotEl=document.getElementById('statusDot');let presenceChannel=null;
  function subscribePresence(){
    presenceChannel=supabaseClient.channel('online-users',{config:{presence:{key:currentUserId}}});
    presenceChannel.on('presence',{event:'sync'},updatePeerOnlineStatus).on('presence',{event:'join'},updatePeerOnlineStatus).on('presence',{event:'leave'},updatePeerOnlineStatus).subscribe(async(s)=>{if(s==='SUBSCRIBED')await presenceChannel.track({online_at:new Date().toISOString()});});
  }
  function updatePeerOnlineStatus(){
    if(!presenceChannel)return;const isOnline=!!presenceChannel.presenceState()[peerId];
    if(isOnline){peerSubEl.textContent='Online';peerSubEl.classList.add('online');statusDotEl.classList.add('online');}else{peerSubEl.textContent='Offline';peerSubEl.classList.remove('online');statusDotEl.classList.remove('online');}
  }
  let clearedBefore=null;
  async function loadMessages(){
    const {data:clearRow}=await supabaseClient.from('chat_clears').select('cleared_before').eq('user_id',currentUserId).eq('peer_id',peerId).maybeSingle();
    clearedBefore=clearRow?clearRow.cleared_before:null;
    let query=supabaseClient.from('messages').select('id, sender_id, content, created_at, delivered_at, read_at').or(`and(sender_id.eq.${currentUserId},receiver_id.eq.${peerId}),and(sender_id.eq.${peerId},receiver_id.eq.${currentUserId})`).order('created_at',{ascending:true});
    if(clearedBefore)query=query.gt('created_at',clearedBefore);
    const {data:rows,error}=await query;
    const banner=`<div class="e2e-banner" id="e2eBanner"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg><span>Pesan terenkripsi secara end-to-end. Hanya orang di obrolan ini yang bisa membaca atau membagikannya. <span class="e2e-learn">Pelajari selengkapnya</span>.</span></div>`;
    if(error||!rows||rows.length===0){msgArea.innerHTML=banner+`<div class="empty-state"><div class="es-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#8696a0" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H8l-4 4V6a2 2 0 012-2h13a2 2 0 012 2z"/></svg></div><div class="es-title">Belum ada pesan</div></div>`;return;}
    for(const m of rows){m.content=await decryptWithRetry(m.content);}
    msgArea.innerHTML=banner;let lastDay=null;rows.forEach(m=>{const d=dayLabel(m.created_at);if(d!==lastDay){const sep=document.createElement('div');sep.className='day-sep';sep.textContent=d;msgArea.appendChild(sep);lastDay=d;}appendBubble(m);});scrollToBottom();
  }
  function appendBubble(m,sending){
    const mine=m.sender_id===currentUserId;const row=document.createElement('div');row.className='bubble-row '+(mine?'mine':'theirs')+(sending?' sending':'');row.dataset.id=m.id;
    row.innerHTML=`<div class="bubble"><div class="txt"></div><div class="meta"><span>${timeLabel(m.created_at)}</span>${mine?`<span class="tick">${tickSvg(m.delivered_at,m.read_at)}</span>`:''}</div></div>`;
    row.querySelector('.txt').textContent=normalizeText(m.content);msgArea.appendChild(row);
  }
  function scrollToBottom(){msgArea.scrollTop=msgArea.scrollHeight;}

  // ---- Dekripsi dengan retry otomatis ----
  // Kalau gagal dibuka (kunci lokal ketinggalan versi), coba ambil public key
  // peer yang PALING BARU dari server dan coba sekali lagi sebelum menyerah.
  // Ini jaring pengaman kalau event realtime perubahan kunci (subscribePeerKeyChange)
  // sempat kelewat/telat sampai. Tidak bisa membuka pesan yang memang dienkripsi
  // pakai kunci yang sudah hilang permanen (itu batas matematis enkripsi E2E,
  // bukan bug) -- tapi mencegah kejadian "mismatch nyangkut" untuk pesan baru.
  const FAILED_DECRYPT_MARKERS=['🔒 Pesan tidak bisa dibuka di perangkat ini','🔒 Pesan terenkripsi (kunci tidak tersedia di perangkat ini)'];
  let lastRetryAt=0;
  async function decryptWithRetry(content){
    let text=await E2E.decryptMessage(sharedKey,content);
    if(!FAILED_DECRYPT_MARKERS.includes(text)) return text;
    const now=Date.now();
    if(now-lastRetryAt<4000) return text; // jangan spam query server tiap pesan kalau memang lagi mismatch total
    lastRetryAt=now;
    try{
      const {data:freshProf}=await supabaseClient.from('profiles').select('public_key').eq('id',peerId).maybeSingle();
      const freshKey=freshProf&&freshProf.public_key;
      if(freshKey&&freshKey!==peerPublicKeyB64){
        peerPublicKeyB64=freshKey;
        E2E.invalidatePeer(peerId);
        sharedKey=myPrivateKey?await E2E.getSharedKey(myPrivateKey,peerId,peerPublicKeyB64):null;
        updateInputAvailability();
        text=await E2E.decryptMessage(sharedKey,content);
      }
    }catch(e){ console.error('Gagal refresh kunci saat retry dekripsi:',e); }
    return text;
  }

  // ---- Popup "Pelajari selengkapnya" (info enkripsi E2E) ----
  // Pakai event delegation karena banner di dalam msgArea di-render ulang tiap loadMessages().
  document.addEventListener('click', (e) => {
    if(e.target.closest('#e2eBanner')) document.getElementById('e2eInfoOverlay').classList.add('open');
  });
  document.getElementById('e2eInfoCloseBtn').addEventListener('click', () => {
    document.getElementById('e2eInfoOverlay').classList.remove('open');
  });
  document.getElementById('e2eInfoOverlay').addEventListener('click', (e) => {
    if(e.target.id==='e2eInfoOverlay') document.getElementById('e2eInfoOverlay').classList.remove('open');
  });
  async function markIncomingAsRead(){const n=new Date().toISOString();await supabaseClient.from('messages').update({delivered_at:n,read_at:n}).eq('sender_id',peerId).eq('receiver_id',currentUserId).is('read_at',null);}
  function subscribeRealtime(){
    supabaseClient.channel('chat-'+[currentUserId,peerId].sort().join('-')).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`receiver_id=eq.${currentUserId}`},async(p)=>{
      const m=p.new;if(m.sender_id!==peerId)return;m.content=await decryptWithRetry(m.content);
      if(msgArea.querySelector('.empty-state'))msgArea.innerHTML='';appendBubble(m);scrollToBottom();
      if(m.content==='🔔 PING!!!'&&navigator.vibrate)navigator.vibrate([80,40,80,40,160]);
      const n=new Date().toISOString();if(document.visibilityState==='visible')await supabaseClient.from('messages').update({delivered_at:n,read_at:n}).eq('id',m.id);else await supabaseClient.from('messages').update({delivered_at:n}).eq('id',m.id).is('delivered_at',null);
    }).on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:`sender_id=eq.${currentUserId}`},(p)=>{
      const row=msgArea.querySelector(`.bubble-row[data-id="${p.new.id}"]`);if(row){const t=row.querySelector('.tick');if(t)t.innerHTML=tickSvg(p.new.delivered_at,p.new.read_at);}
    }).subscribe();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')markIncomingAsRead();});
  }

  // ---- Pantau perubahan public key lawan bicara selagi chat ini terbuka. ----
  // Kalau peer login pertama kali di device baru / reinstall / clear data selagi
  // kita sedang buka chat ini, public key dia di server berubah tapi sharedKey
  // kita masih pakai versi lama (dihitung sekali saat init()). Tanpa ini, semua
  // pesan yang dikirim/diterima sesudahnya akan gagal didekripsi di kedua sisi
  // walau baru saja dikirim.
  function subscribePeerKeyChange(){
    supabaseClient.channel('pubkey-'+peerId)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles',filter:`id=eq.${peerId}`},async(p)=>{
        const newKey=p.new.public_key;
        if(!newKey || newKey===peerPublicKeyB64) return;
        peerPublicKeyB64=newKey;
        E2E.invalidatePeer(peerId);
        sharedKey = myPrivateKey ? await E2E.getSharedKey(myPrivateKey,peerId,peerPublicKeyB64) : null;
        updateInputAvailability();
        if(msgArea.querySelector('.empty-state')===null){
          const sep=document.createElement('div');
          sep.className='day-sep';
          sep.textContent='🔒 Kode keamanan enkripsi dengan '+(peerUsername||'kontak ini')+' telah diperbarui';
          msgArea.appendChild(sep);
          scrollToBottom();
        }
      }).subscribe();
  }
  async function sendMessage(){
    const text=normalizeText(msgInput.value);if(!text||!sharedKey)return;msgInput.value='';autoResize();
    if(msgArea.querySelector('.empty-state'))msgArea.innerHTML='';const tempId='temp-'+Date.now();
    appendBubble({id:tempId,sender_id:currentUserId,content:text,created_at:new Date().toISOString()},true);scrollToBottom();
    const encrypted=await E2E.encryptMessage(sharedKey,text);
    const {data,error}=await supabaseClient.from('messages').insert({sender_id:currentUserId,receiver_id:peerId,content:encrypted}).select().single();
    msgInput.focus();const tempRow=msgArea.querySelector(`[data-id="${tempId}"]`);
    if(error){if(tempRow){tempRow.classList.add('send-failed');tempRow.classList.remove('sending');}msgInput.value=text;return;}
    if(tempRow)tempRow.remove();data.content=text;appendBubble(data);
  }
  function autoResize(){msgInput.style.height='auto';msgInput.style.height=Math.min(msgInput.scrollHeight,100)+'px';}
  function showConfirm(title,msg,okLabel){
    return new Promise((resolve)=>{
      const ov=document.getElementById('confirmOverlay'),ok=document.getElementById('confirmOkBtn'),cancel=document.getElementById('confirmCancelBtn');
      document.getElementById('confirmTitle').textContent=title;document.getElementById('confirmMsg').textContent=msg;ok.textContent=okLabel||'Hapus';
      ov.classList.add('open');
      function cleanup(result){ov.classList.remove('open');ok.removeEventListener('click',onOk);cancel.removeEventListener('click',onCancel);ov.removeEventListener('click',onOverlay);resolve(result);}
      function onOk(){cleanup(true);} function onCancel(){cleanup(false);} function onOverlay(e){if(e.target===ov)cleanup(false);}
      ok.addEventListener('click',onOk);cancel.addEventListener('click',onCancel);ov.addEventListener('click',onOverlay);
    });
  }
  msgInput.addEventListener('input',()=>{autoResize();sendBtn.disabled=msgInput.value.trim().length===0;});
  msgInput.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});sendBtn.addEventListener('click',sendMessage);
  const menuBtn=document.getElementById('menuBtn'),chatMenu=document.getElementById('chatMenu');
  menuBtn.addEventListener('click',(e)=>{e.stopPropagation();chatMenu.classList.toggle('open');});document.addEventListener('click',()=>{chatMenu.classList.remove('open');});
  document.getElementById('menuHapusPermanen').addEventListener('click',async(e)=>{
    e.stopPropagation();chatMenu.classList.remove('open');
    const ok=await showConfirm('Hapus Untuk Semua Orang','Semua percakapan ini akan di hapus untuk semua orang','Hapus Permanen');
    if(!ok)return;
    const {error}=await supabaseClient.from('messages').delete().or(`and(sender_id.eq.${currentUserId},receiver_id.eq.${peerId}),and(sender_id.eq.${peerId},receiver_id.eq.${currentUserId})`);
    if(error){alert('Gagal menghapus permanen. Coba lagi.');return;}
    clearedBefore=null;
    await supabaseClient.from('chat_clears').delete().eq('user_id',currentUserId).eq('peer_id',peerId);
    msgArea.innerHTML=`<div class="empty-state"><span>Belum ada pesan.</span></div>`;
  });
  document.getElementById('menuHapusKontak').addEventListener('click',async(e)=>{
    e.stopPropagation();chatMenu.classList.remove('open');
    const ok=await showConfirm('Hapus Kontak Ini?','Menghapus kontak akan menghapus juga kontak anda dari teman ini.','Hapus');
    if(!ok)return;
    const {error}=await supabaseClient.from('contacts').delete().or(`and(requester_id.eq.${currentUserId},addressee_id.eq.${peerId}),and(requester_id.eq.${peerId},addressee_id.eq.${currentUserId})`);
    if(!error)window.location.href='dashboard.html';
  });
  document.getElementById('menuPing').addEventListener('click',async(e)=>{
    e.stopPropagation();chatMenu.classList.remove('open');if(!sharedKey)return;if(navigator.vibrate)navigator.vibrate([80,40,80,40,160]);
    const encrypted=await E2E.encryptMessage(sharedKey,'🔔 PING!!!');
    const {data,error}=await supabaseClient.from('messages').insert({sender_id:currentUserId,receiver_id:peerId,content:encrypted}).select().single();
    if(!error){data.content='🔔 PING!!!';if(msgArea.querySelector('.empty-state'))msgArea.innerHTML='';appendBubble(data);scrollToBottom();}
  });
  history.pushState({page:'chat'},'',location.href);window.addEventListener('popstate',()=>{window.location.href='dashboard.html';});

  // ---- Tarik untuk refresh (pull-to-refresh) di area pesan ----
  // Dibutuhkan karena overscroll-behavior:none di body mematikan gesture native
  // Chrome, dan di TWA (chrome-less, tanpa address bar/tombol reload) ini jadi
  // satu-satunya cara user recover kalau init() gagal (mis. "Gagal memuat
  // percakapan" karena koneksi sempat putus).
  (function(){
    const ind=document.getElementById('chatPtr');
    const THRESHOLD=64,MAX=90;
    let startY=0,pulling=false,dragging=false,refreshing=false;
    msgArea.addEventListener('touchstart',e=>{
      if(refreshing||e.touches.length!==1){pulling=false;return;}
      if(msgArea.scrollTop>0){pulling=false;return;}
      startY=e.touches[0].clientY;pulling=true;dragging=false;
    },{passive:true});
    msgArea.addEventListener('touchmove',e=>{
      if(!pulling||refreshing)return;
      const dy=e.touches[0].clientY-startY;
      if(dy<=0||msgArea.scrollTop>0){pulling=false;dragging=false;ind.style.height='0px';return;}
      dragging=true;e.preventDefault();
      ind.style.height=Math.min(dy*0.5,MAX)+'px';
    },{passive:false});
    msgArea.addEventListener('touchend',()=>{
      if(!pulling)return;pulling=false;
      const dist=parseInt(ind.style.height||'0',10);
      if(dragging&&dist>=THRESHOLD){
        refreshing=true;ind.style.height='50px';ind.classList.add('loading');
        location.reload();
      }else{ind.style.height='0px';}
      dragging=false;
    },{passive:true});
  })();
  if(typeof supabaseClient==='undefined'){
    msgArea.innerHTML=`<div class="empty-state"><div class="es-title">Gagal terhubung</div><span>supabaseClient.js gagal dimuat (cek path file / koneksi internet / console browser).</span></div>`;
