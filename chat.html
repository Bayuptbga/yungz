<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BBM Private Chat - Chat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2a32">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Private Chat">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @view-transition { navigation: auto; }
  :root{
    --bbm-blue-dark:#0b141a;
    --bbm-blue:#1b2a32;
    --bbm-blue-light:#233138;
    --bg:#121b22;
    --card-bg:#1b2a32;
    --ink:#e9edf0;
    --ink-soft:#aab8c2;
    --muted:#8696a0;
    --border:#2a3942;
  }
  *{box-sizing:border-box;}
  html{ overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  body{
    overscroll-behavior:none; touch-action:pan-y; user-select:none; -webkit-touch-callout:none;
    margin:0; font-family:'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    position:fixed; inset:0; width:100%; height:100%; overflow:hidden;
    display:flex; align-items:flex-start; justify-content:center; -webkit-font-smoothing:antialiased;
  }
  input, textarea{ user-select:text; }
  .phone{
    width:100%; max-width:420px; height:100%; background:var(--bg);
    box-shadow:0 0 40px rgba(0,0,0,0.5); display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  #authGate{ position:absolute; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center; justify-content:center; }
  #authGate .spinner{ width:32px; height:32px; border-radius:50%; border:3px solid var(--border); border-top-color:#53bdeb; animation:authSpin .75s linear infinite; }
  @keyframes authSpin{ to{ transform:rotate(360deg); } }
  .appbar{
    background:linear-gradient(120deg,var(--bbm-blue-dark),var(--bbm-blue) 55%,var(--bbm-blue-light));
    color:#fff; padding:calc(12px + env(safe-area-inset-top)) 14px 12px; display:flex; align-items:center; gap:10px;
    flex-shrink:0; box-shadow:0 3px 10px rgba(0,0,0,0.3); position:relative; z-index:10;
  }
  .appbar .back{ cursor:pointer; width:34px;height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s ease; }
  .appbar .back:active{ background:rgba(255,255,255,0.16); }
  .appbar .avatar{ width:38px;height:38px;border-radius:50%; display:flex;align-items:center;justify-content:center; color:#fff;font-weight:700;font-size:14px;flex-shrink:0; box-shadow:0 0 0 2px rgba(255,255,255,0.35); }
  .appbar .who{flex:1;min-width:0;}
  .appbar .uname{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .appbar .sub{font-size:11.5px;opacity:0.82;margin-top:1px;}
  .appbar .sub.online{opacity:1;color:#2ecc71;font-weight:600;}
  .status-dot{ display:inline-block; width:8px;height:8px; border-radius:50%; margin-left:6px; background:#8696a0; vertical-align:middle; box-shadow:0 0 0 2px rgba(255,255,255,0.25); }
  .status-dot.online{ background:#2ecc71; }
  .appbar .menu-btn{ cursor:pointer; width:34px;height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s ease; position:relative; }
  .appbar .menu-btn:active{ background:rgba(255,255,255,0.16); }
  .chat-menu{ position:absolute; top:calc(100% + 6px); right:10px; background:var(--card-bg); border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,0.5); min-width:180px; overflow:hidden; z-index:50; display:none; }
  .chat-menu.open{display:block;}
  .chat-menu .item{ padding:13px 16px; font-size:14.5px; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); }
  .chat-menu .item:last-child{border-bottom:none;}
  .chat-menu .item:active{background:var(--border);}
  .chat-menu .item.danger{color:#f15c6d;}
  .chat-menu .item.ping{color:#e08a00;font-weight:600;}
  .msg-area{
    flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 12px 6px; display:flex; flex-direction:column; gap:2px;
    background-color:var(--bg); background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0); background-size:20px 20px; scroll-behavior:smooth;
  }
  .msg-area::-webkit-scrollbar{ width:6px; }
  .msg-area::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.1); border-radius:3px; }
  .day-sep{
    align-self:center; position:sticky; top:6px; background:rgba(27,42,50,0.88); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    color:var(--ink-soft); font-size:11px; font-weight:600; padding:5px 13px; border-radius:20px; margin:12px 0 10px; flex-shrink:0; box-shadow:0 1px 5px rgba(0,0,0,0.2); z-index:3;
  }
  .bubble-row{ display:flex; align-items:flex-end; width:100%; flex-shrink:0; margin:3px 0; animation:bubbleIn .2s ease both; }
  @keyframes bubbleIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .bubble-row.mine{justify-content:flex-end;}
  .bubble-row.theirs{justify-content:flex-start;}
  .bubble-row.sending .bubble{ opacity:0.6; transition:opacity .15s ease; }
  .bubble-row.send-failed .bubble{ opacity:1; background:#3f1d24 !important; border:1px solid #f15c6d; }
  .bubble-row.send-failed .bubble::after{ content:"⚠ Gagal terkirim"; display:block; font-size:10.5px; color:#f15c6d; margin-top:3px; }
  .bubble{
    display:flex; flex-direction:column; align-items:flex-end; max-width:78%; width:fit-content; padding:8px 11px 6px; border-radius:16px;
    font-size:14.5px; line-height:20px; word-wrap:break-word; overflow-wrap:break-word; box-shadow:0 1px 2px rgba(0,0,0,0.2);
  }
  .bubble-row.mine .bubble{ background:#005c4b; border:1px solid #005c4b; border-top-right-radius:4px; color:#e9edf0; }
  .bubble-row.theirs .bubble{ background:var(--card-bg); border:1px solid var(--border); border-top-left-radius:4px; }
  .bubble .txt{ align-self:stretch; min-width:36px; text-align:left; white-space:pre-wrap; word-wrap:break-word; }
  .bubble .meta{ display:flex; align-items:center; gap:4px; margin-top:3px; font-size:10.5px; color:var(--ink-soft); white-space:nowrap; }
  .empty-state{ margin:auto; text-align:center; color:var(--muted); font-size:13.5px; padding:32px 30px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .empty-state .es-icon{ width:54px;height:54px; border-radius:50%; background:var(--card-bg); display:flex;align-items:center;justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  .empty-state .es-title{ font-size:14px; font-weight:600; color:var(--ink); }
  .loading-spinner{ width:30px;height:30px; border:3px solid var(--border); border-top-color:#005c4b; border-radius:50%; animation:spin .75s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .input-bar{ display:flex; align-items:flex-end; gap:8px; padding:10px 10px calc(10px + env(safe-area-inset-bottom)); background:var(--card-bg); border-top:1px solid var(--border); flex-shrink:0; }
  .input-bar textarea{ flex:1; resize:none; border:1.5px solid var(--border); border-radius:22px; padding:11px 17px; font-size:14.5px; font-family:inherit; outline:none; max-height:100px; background:var(--bg); color:var(--ink); transition:border-color .15s ease; }
  .input-bar textarea::placeholder{ color:var(--muted); }
  .input-bar textarea:disabled{background:var(--border);color:var(--muted);}
  .input-bar textarea:focus{ border-color:#005c4b; box-shadow:none; }
  .send-btn{ width:43px;height:43px; border-radius:50%; background:linear-gradient(135deg,#005c4b,#004236); border:none; display:flex;align-items:center;justify-content:center; cursor:pointer; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,0.3); }
  .send-btn:not(:disabled):active{ transform:scale(0.94); }
  .send-btn:disabled{background:var(--border);box-shadow:none;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js?v=2"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js');});}</script>
</head>
<body>
<div class="phone">
  <div id="authGate"><div class="spinner"></div></div>
  <div class="appbar">
    <div class="back" onclick="window.location.href='index.html'"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="avatar" id="peerAvatar">?</div>
    <div class="who"><div class="uname"><span id="peerUname">@—</span><span class="status-dot" id="statusDot"></span></div><div class="sub" id="peerSub">-</div></div>
    <div class="menu-btn" id="menuBtn"><svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      <div class="chat-menu" id="chatMenu">
        <div class="item" id="menuHapusChat">🗑️ Hapus dari Perangkat Saya</div><div class="item danger" id="menuHapusPermanen">🔥 Hapus Permanen (Semua)</div><div class="item danger" id="menuHapusKontak">🚫 Hapus Kontak</div><div class="item ping" id="menuPing">🔔 PING!!!</div>
      </div>
    </div>
  </div>
  <div class="msg-area" id="msgArea"><div class="empty-state"><div class="loading-spinner"></div><span>Memuat percakapan…</span></div></div>
  <div class="input-bar">
    <textarea id="msgInput" rows="1" placeholder="Ketik pesan..." disabled></textarea>
    <button class="send-btn" id="sendBtn" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const rawUid = params.get('uid');
  const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  const peerId = (rawUid && UUID_RE.test(rawUid)) ? rawUid : null;
  let currentUserId = null; let peerUsername = params.get('uname') || '';
  const msgArea = document.getElementById('msgArea'), msgInput = document.getElementById('msgInput'), sendBtn = document.getElementById('sendBtn'), peerAvatar = document.getElementById('peerAvatar'), peerUnameEl = document.getElementById('peerUname');
  const colorPalette = ['#c77b8c','#3a3f47','#2f6b3a','#5b6b74','#2c2c2c','#7c3f9e','#8a7a4a','#1a7fc2'];
  function colorFor(id){let hash=0;for(let i=0;i<id.length;i++)hash=id.charCodeAt(i)+((hash<<5)-hash);return colorPalette[Math.abs(hash)%colorPalette.length];}
  function initials(u){return (u||'?').slice(0,2).toUpperCase();}
  function normalizeText(str){if(!str)return'';str=str.replace(/[\r\v\f\u2028\u2029]/g,'\n');const lines=str.split('\n').map(l=>l.replace(/[ \t]+$/,''));const out=[];let blankRun=0;for(const line of lines){if(line.trim()===''){blankRun++;if(blankRun<=1)out.push('');}else{blankRun=0;out.push(line);}}return out.join('\n').trim();}
  function timeLabel(iso){return new Date(iso).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});}
  function dayLabel(iso){const d=new Date(iso),t=new Date(),y=new Date();y.setDate(t.getDate()-1);const s=(a,b)=>a.toDateString()===b.toDateString();if(s(d,t))return'Hari ini';if(s(d,y))return'Kemarin';return d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});}
  function tickSvg(del,read){
    if(read) return `<svg viewBox="0 0 20 15" width="16" height="12" fill="none" stroke="#53bdeb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L11.2 3"/><path d="M6.2 7.6l3.3 3.3L18.5 3"/></svg>`;
    if(del) return `<svg viewBox="0 0 20 15" width="16" height="12" fill="none" stroke="#8696a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L11.2 3"/><path d="M6.2 7.6l3.3 3.3L18.5 3"/></svg>`;
    return `<svg viewBox="0 0 16 15" width="13" height="12" fill="none" stroke="#8696a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L14 3"/></svg>`;
  }
  async function init(){
    try{
      if(!peerId){window.location.href='index.html';return;}
      const {data:{session},error:sessErr} = await supabaseClient.auth.getSession();
      if(sessErr) throw sessErr;
      if(!session){window.location.replace('login.html');return;}
      currentUserId=session.user.id;
      document.getElementById('authGate').style.display='none';
      const {data:rel,error:relErr}=await supabaseClient.from('contacts').select('id, status').or(`and(requester_id.eq.${currentUserId},addressee_id.eq.${peerId}),and(requester_id.eq.${peerId},addressee_id.eq.${currentUserId})`).eq('status','accepted').maybeSingle();
      if(relErr) throw relErr;
      if(!rel){msgArea.innerHTML=`<div class="empty-state"><div class="es-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#8696a0" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c0-3.6 3-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/><path d="M18 8v5M15.5 10.5h5"/></svg></div><div class="es-title">Belum berteman</div><span>Tambahkan lewat tab Kontak dulu ya.</span></div>`;return;}
      if(!peerUsername){const {data:prof,error:profErr}=await supabaseClient.from('profiles').select('username').eq('id',peerId).maybeSingle();if(profErr) throw profErr;peerUsername=prof?prof.username:'Pengguna';}
      peerAvatar.textContent=initials(peerUsername);peerAvatar.style.background=colorFor(peerId);peerUnameEl.textContent='@'+peerUsername;
      await loadMessages();await markIncomingAsRead();subscribeRealtime();subscribePresence();msgInput.disabled=false;
    }catch(err){
      console.error('init error:',err);
      document.getElementById('authGate').style.display='none';
      msgArea.innerHTML=`<div class="empty-state"><div class="es-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#f15c6d" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></div><div class="es-title">Gagal memuat percakapan</div><span>Cek koneksi internet lalu tarik-turun atau buka ulang chat ini.</span></div>`;
    }
  }
  const peerSubEl=document.getElementById('peerSub'),statusDotEl=document.getElementById('statusDot');let presenceChannel=null;
  function subscribePresence(){
    presenceChannel=supabaseClient.channel('online-users',{config:{presence:{key:currentUserId}}});
    presenceChannel.on('presence',{event:'sync'},updatePeerOnlineStatus).on('presence',{event:'join'},updatePeerOnlineStatus).on('presence',{event:'leave'},updatePeerOnlineStatus).subscribe(async(s)=>{if(s==='SUBSCRIBED')await presenceChannel.track({online_at:new Date().toISOString()});});
  }
  function updatePeerOnlineStatus(){
    if(!presenceChannel)return;const isOnline=!!presenceChannel.presenceState()[peerId];
    if(isOnline){peerSubEl.textContent='Online';peerSubEl.classList.add('online');statusDotEl.classList.add('online');}else{peerSubEl.textContent='Offline';peerSubEl.classList.remove('online');statusDotEl.classList.remove('online');}
  }
  let clearedBefore=null;
  async function loadMessages(){
    const {data:clearRow}=await supabaseClient.from('chat_clears').select('cleared_before').eq('user_id',currentUserId).eq('peer_id',peerId).maybeSingle();
    clearedBefore=clearRow?clearRow.cleared_before:null;
    let query=supabaseClient.from('messages').select('id, sender_id, content, created_at, delivered_at, read_at').or(`and(sender_id.eq.${currentUserId},receiver_id.eq.${peerId}),and(sender_id.eq.${peerId},receiver_id.eq.${currentUserId})`).order('created_at',{ascending:true});
    if(clearedBefore)query=query.gt('created_at',clearedBefore);
    const {data:rows,error}=await query;
    if(error||!rows||rows.length===0){msgArea.innerHTML=`<div class="empty-state"><div class="es-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#8696a0" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H8l-4 4V6a2 2 0 012-2h13a2 2 0 012 2z"/></svg></div><div class="es-title">Belum ada pesan</div></div>`;return;}
    msgArea.innerHTML='';let lastDay=null;rows.forEach(m=>{const d=dayLabel(m.created_at);if(d!==lastDay){const sep=document.createElement('div');sep.className='day-sep';sep.textContent=d;msgArea.appendChild(sep);lastDay=d;}appendBubble(m);});scrollToBottom();
  }
  function appendBubble(m,sending){
    const mine=m.sender_id===currentUserId;const row=document.createElement('div');row.className='bubble-row '+(mine?'mine':'theirs')+(sending?' sending':'');row.dataset.id=m.id;
    row.innerHTML=`<div class="bubble"><div class="txt"></div><div class="meta"><span>${timeLabel(m.created_at)}</span>${mine?`<span class="tick">${tickSvg(m.delivered_at,m.read_at)}</span>`:''}</div></div>`;
    row.querySelector('.txt').textContent=normalizeText(m.content);msgArea.appendChild(row);
  }
  function scrollToBottom(){msgArea.scrollTop=msgArea.scrollHeight;}
  async function markIncomingAsRead(){const n=new Date().toISOString();await supabaseClient.from('messages').update({delivered_at:n,read_at:n}).eq('sender_id',peerId).eq('receiver_id',currentUserId).is('read_at',null);}
  function subscribeRealtime(){
    supabaseClient.channel('chat-'+[currentUserId,peerId].sort().join('-')).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`receiver_id=eq.${currentUserId}`},async(p)=>{
      const m=p.new;if(m.sender_id!==peerId)return;if(msgArea.querySelector('.empty-state'))msgArea.innerHTML='';appendBubble(m);scrollToBottom();
      if(m.content==='🔔 PING!!!'&&navigator.vibrate)navigator.vibrate([80,40,80,40,160]);
      const n=new Date().toISOString();if(document.visibilityState==='visible')await supabaseClient.from('messages').update({delivered_at:n,read_at:n}).eq('id',m.id);else await supabaseClient.from('messages').update({delivered_at:n}).eq('id',m.id).is('delivered_at',null);
    }).on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:`sender_id=eq.${currentUserId}`},(p)=>{
      const row=msgArea.querySelector(`.bubble-row[data-id="${p.new.id}"]`);if(row){const t=row.querySelector('.tick');if(t)t.innerHTML=tickSvg(p.new.delivered_at,p.new.read_at);}
    }).subscribe();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')markIncomingAsRead();});
  }
  async function sendMessage(){
    const text=normalizeText(msgInput.value);if(!text)return;msgInput.value='';autoResize();
    if(msgArea.querySelector('.empty-state'))msgArea.innerHTML='';const tempId='temp-'+Date.now();
    appendBubble({id:tempId,sender_id:currentUserId,content:text,created_at:new Date().toISOString()},true);scrollToBottom();
    const {data,error}=await supabaseClient.from('messages').insert({sender_id:currentUserId,receiver_id:peerId,content:text}).select().single();
    msgInput.focus();const tempRow=msgArea.querySelector(`[data-id="${tempId}"]`);
    if(error){if(tempRow){tempRow.classList.add('send-failed');tempRow.classList.remove('sending');}msgInput.value=text;return;}
    if(tempRow)tempRow.remove();appendBubble(data);
  }
  function autoResize(){msgInput.style.height='auto';msgInput.style.height=Math.min(msgInput.scrollHeight,100)+'px';}
  msgInput.addEventListener('input',()=>{autoResize();sendBtn.disabled=msgInput.value.trim().length===0;});
  msgInput.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});sendBtn.addEventListener('click',sendMessage);
  const menuBtn=document.getElementById('menuBtn'),chatMenu=document.getElementById('chatMenu');
  menuBtn.addEventListener('click',(e)=>{e.stopPropagation();chatMenu.classList.toggle('open');});document.addEventListener('click',()=>{chatMenu.classList.remove('open');});
  document.getElementById('menuHapusChat').addEventListener('click',async(e)=>{
    e.stopPropagation();chatMenu.classList.remove('open');if(!confirm('Sembunyikan riwayat chat ini dari perangkat kamu? (Pesan tetap ada di server, dan tetap terlihat oleh lawan bicara.)'))return;
    const n=new Date().toISOString();const {error}=await supabaseClient.from('chat_clears').upsert({user_id:currentUserId,peer_id:peerId,cleared_before:n},{onConflict:'user_id,peer_id'});
    if(!error){clearedBefore=n;msgArea.innerHTML=`<div class="empty-state"><span>Belum ada pesan.</span></div>`;}
  });
  document.getElementById('menuHapusPermanen').addEventListener('click',async(e)=>{
    e.stopPropagation();chatMenu.classList.remove('open');
    if(!confirm('Hapus SEMUA pesan di percakapan ini secara permanen dari server? Ini tidak bisa dibatalkan dan akan menghapusnya juga untuk lawan bicara.'))return;
    const {error}=await supabaseClient.from('messages').delete().or(`and(sender_id.eq.${currentUserId},receiver_id.eq.${peerId}),and(sender_id.eq.${peerId},receiver_id.eq.${currentUserId})`);
    if(error){alert('Gagal menghapus permanen. Coba lagi.');return;}
    clearedBefore=null;
    await supabaseClient.from('chat_clears').delete().eq('user_id',currentUserId).eq('peer_id',peerId);
    msgArea.innerHTML=`<div class="empty-state"><span>Belum ada pesan.</span></div>`;
  });
  document.getElementById('menuHapusKontak').addEventListener('click',async(e)=>{
    e.stopPropagation();chatMenu.classList.remove('open');if(!confirm('Hapus kontak ini?'))return;
    const {error}=await supabaseClient.from('contacts').delete().or(`and(requester_id.eq.${currentUserId},addressee_id.eq.${peerId}),and(requester_id.eq.${peerId},addressee_id.eq.${currentUserId})`);
    if(!error)window.location.href='index.html';
  });
  document.getElementById('menuPing').addEventListener('click',async(e)=>{
    e.stopPropagation();chatMenu.classList.remove('open');if(navigator.vibrate)navigator.vibrate([80,40,80,40,160]);
    const {data,error}=await supabaseClient.from('messages').insert({sender_id:currentUserId,receiver_id:peerId,content:'🔔 PING!!!'}).select().single();
    if(!error){if(msgArea.querySelector('.empty-state'))msgArea.innerHTML='';appendBubble(data);scrollToBottom();}
  });
  history.pushState({page:'chat'},'',location.href);window.addEventListener('popstate',()=>{window.location.href='index.html';});
  if(typeof supabaseClient==='undefined'){
    msgArea.innerHTML=`<div class="empty-state"><div class="es-title">Gagal terhubung</div><span>supabaseClient.js gagal dimuat (cek path file / koneksi internet / console browser).</span></div>`;
    console.error('supabaseClient belum terdefinisi — supabase-js CDN atau supabaseClient.js gagal load.');
  }else{
    init();
  }
</script>
</body>
</html>
