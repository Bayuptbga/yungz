<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baku Chat - Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0f17">
<style>
  :root{
    --bbm-blue:#5b93ff;
    --bbm-blue-light:#84aeff;
    --bg:#0b0f17;
    --card-bg:#141a24;
    --card-bg-2:#1a2130;
    --ink:#e9edf5;
    --muted:#7c899c;
    --border:#232b3a;
    --ok:#34c17a;
    --error:#f2495c;
    --warn:#e0a634;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}

  /* ---------- Gate (memeriksa akses) ---------- */
  #gateScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:13px;}
  #gateScreen .spin{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--bbm-blue);animation:gateSpin .75s linear infinite;}
  @keyframes gateSpin{to{transform:rotate(360deg);}}

  /* ---------- Shell ---------- */
  #adminShell{display:none;min-height:100vh;flex-direction:column;}
  .topbar{background:var(--card-bg);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  .topbar h1{font-size:16.5px;margin:0;font-weight:800;background:linear-gradient(90deg,var(--bbm-blue),var(--bbm-blue-light));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.1px;}
  .topbar .sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}
  .logout-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:8px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
  .logout-btn:active{background:var(--card-bg-2);}

  .content{flex:1;padding:18px;max-width:820px;width:100%;margin:0 auto;}

  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;}
  .stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:12px 10px;}
  .stat-card .n{font-size:18px;font-weight:800;color:var(--ink);line-height:1.1;}
  .stat-card .l{font-size:9.5px;color:var(--muted);font-weight:600;margin-top:4px;}
  .stat-card.warn-stat .n{color:var(--warn);}
  .stat-card.verify-stat .n{color:var(--bbm-blue-light);}

  .toolbar{display:flex;gap:8px;margin-bottom:14px;}
  .search-wrap{flex:1;position:relative;}
  .search-wrap input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--border);border-radius:11px;font-size:13.5px;font-family:inherit;outline:none;background:var(--card-bg);color:var(--ink);}
  .search-wrap input::placeholder{color:var(--muted);}
  .search-wrap input:focus{border-color:var(--bbm-blue);}
  .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
  .filter-pills{display:flex;gap:6px;background:var(--card-bg);border:1px solid var(--border);border-radius:11px;padding:3px;flex-shrink:0;}
  .filter-pills button{border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;font-family:inherit;padding:7px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .filter-pills button.active{background:var(--bbm-blue);color:#fff;}

  .user-list{display:flex;flex-direction:column;gap:8px;}
  .u-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:13px 14px;}
  .u-top{display:flex;align-items:center;gap:11px;}
  .avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;background-size:cover;background-position:center;}
  .u-main{flex:1;min-width:0;}
  .u-name{font-size:14.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .u-meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
  .badge.active{background:rgba(52,193,122,0.14);color:var(--ok);}
  .badge.banned{background:rgba(242,73,92,0.14);color:var(--error);}
  .u-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;}
  .u-actions button{flex:1 1 calc(50% - 4px);border:1px solid var(--border);background:var(--card-bg-2);color:var(--ink);border-radius:9px;padding:9px 4px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
  .u-actions button:active{filter:brightness(1.2);}
  .u-actions button.warn{color:var(--warn);border-color:rgba(224,166,52,0.35);}
  .u-actions button.danger{color:var(--error);border-color:rgba(242,73,92,0.35);}
  .u-actions button.verify-on{color:var(--bbm-blue-light);border-color:rgba(91,147,255,0.4);}
  .verify-badge{display:inline-flex;flex-shrink:0;vertical-align:middle;}

  .empty-state,.loading-state{padding:60px 20px;text-align:center;color:var(--muted);font-size:13px;}

  .pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px;}
  .pager button{border:1px solid var(--border);background:var(--card-bg);border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink);}
  .pager button:disabled{opacity:.35;cursor:default;}
  .pager span{font-size:12px;color:var(--muted);}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:100;padding:20px;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .modal{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;width:100%;max-width:340px;padding:22px 20px;transform:translateY(8px);transition:transform .18s ease;}
  .overlay.open .modal{transform:translateY(0);}
  .modal h2{font-size:16px;margin:0 0 4px;font-weight:700;}
  .modal p{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.5;}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
  .modal .actions button{border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-cancel{background:var(--card-bg-2);color:var(--ink);}
  .btn-danger{background:var(--error);color:#fff;}
  .btn-warn{background:var(--warn);color:#fff;}

  .detail-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .k{color:var(--muted);}
  .detail-row .v{font-weight:600;text-align:right;word-break:break-all;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2836;border:1px solid var(--border);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,0.4);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="gateScreen">
  <div class="spin"></div>
  <div>Memeriksa akses...</div>
</div>

<div id="adminShell">
  <div class="topbar">
    <div>
      <h1>Baku Chat Admin</h1>
      <div class="sub">Manajemen Pengguna</div>
    </div>
    <button class="logout-btn" id="logoutBtn">Keluar</button>
  </div>

  <div class="content">
    <div class="stats-row">
      <div class="stat-card"><div class="n" id="statTotal">-</div><div class="l">Total</div></div>
      <div class="stat-card"><div class="n" id="statActive">-</div><div class="l">Aktif</div></div>
      <div class="stat-card warn-stat"><div class="n" id="statBanned">-</div><div class="l">Disuspend</div></div>
      <div class="stat-card verify-stat"><div class="n" id="statVerified">-</div><div class="l">Terverifikasi</div></div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Cari username...">
      </div>
    </div>
    <div class="filter-pills" id="filterPills" style="margin-bottom:14px;">
      <button class="active" data-val="all">Semua</button>
      <button data-val="active">Aktif</button>
      <button data-val="banned">Disuspend</button>
    </div>

    <div class="user-list" id="userList"><div class="loading-state">Memuat data pengguna...</div></div>

    <div class="pager">
      <button id="prevBtn">← Sebelumnya</button>
      <span id="pageInfo">Halaman 1</span>
      <button id="nextBtn">Berikutnya →</button>
    </div>
  </div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="modal">
    <h2 id="detailName">Detail Pengguna</h2>
    <p>Informasi akun.</p>
    <div id="detailBody"></div>
    <div class="actions">
      <button class="btn-cancel" id="detailCloseBtn">Tutup</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="modal">
    <h2 id="confirmTitle">Konfirmasi</h2>
    <p id="confirmMsg"></p>
    <div class="actions">
      <button class="btn-cancel" id="confirmCancelBtn">Batal</button>
      <button id="confirmOkBtn">Ya</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ===== Koneksi Supabase (sama seperti app.js, disalin supaya admin.html berdiri sendiri) =====
  const SUPABASE_URL = 'https://pxwrbwfpkuuwioythqpt.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_LcTHxYsZJsvZWkdsdQWfoQ_JsV7ahbT';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const colorPalette=['#c77b8c','#3a3f47','#2f6b3a','#5b6b74','#2c2c2c','#7c3f9e','#8a7a4a','#1a7fc2'];
  function colorFor(id){let hash=0;for(let i=0;i<id.length;i++)hash=id.charCodeAt(i)+((hash<<5)-hash);return colorPalette[Math.abs(hash)%colorPalette.length];}
  function initials(u){return(u||'?').slice(0,2).toUpperCase();}
  function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function fmtDate(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
  function verifyBadgeSvg(){ return `<svg class="verify-badge" width="15" height="15" viewBox="0 0 24 24" fill="#5b93ff" stroke="#0b0f17" stroke-width="1"><path d="M12 2l2.4 2.1 3.1-.6.9 3 2.8 1.4-.6 3.1L22.7 14l-2.1 2.4.6 3.1-3 .9-1.4 2.8-3.1-.6L12 24l-2.4-2.1-3.1.6-.9-3-2.8-1.4.6-3.1L1.3 12l2.1-2.4-.6-3.1 3-.9 1.4-2.8 3.1.6L12 2z"/><path d="M8.5 12.2l2.3 2.3 4.7-4.9" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

  function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

  function showConfirm(title,msg,okLabel,okClass){
    return new Promise(resolve=>{
      const ov=document.getElementById('confirmOverlay');
      document.getElementById('confirmTitle').textContent=title;
      document.getElementById('confirmMsg').textContent=msg;
      const okBtn=document.getElementById('confirmOkBtn');
      okBtn.textContent=okLabel; okBtn.className=okClass;
      ov.classList.add('open');
      function cleanup(v){ ov.classList.remove('open'); okBtn.removeEventListener('click',onOk); cancelBtn.removeEventListener('click',onCancel); resolve(v); }
      const cancelBtn=document.getElementById('confirmCancelBtn');
      function onOk(){cleanup(true);} function onCancel(){cleanup(false);}
      okBtn.addEventListener('click',onOk); cancelBtn.addEventListener('click',onCancel);
    });
  }

  // ===== Gate akses: tanpa form login. Admin panel hanya bisa dimasuki lewat
  // sesi yang sudah aktif (login dari index.html, lalu buka lewat tombol
  // "Panel Admin" di profil.html). Kalau belum login / bukan admin -> dialihkan
  // diam-diam ke index.html.
  async function checkAdminAndEnter(){
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){ window.location.replace('index.html'); return; }
    const {data:prof,error}=await supabaseClient.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();
    if(error || !prof || prof.is_admin!==true){ window.location.replace('index.html'); return; }
    document.getElementById('gateScreen').style.display='none';
    document.getElementById('adminShell').style.display='flex';
    loadUsers();
  }
  document.getElementById('logoutBtn').addEventListener('click', async ()=>{
    await supabaseClient.auth.signOut();
    window.location.replace('index.html');
  });
  checkAdminAndEnter();

  // ===== Data pengguna =====
  const PAGE_SIZE=20;
  let currentPage=0, currentSearch='', currentFilter='all', totalCount=0;

  async function loadStats(){
    const {count:total}=await supabaseClient.from('profiles').select('id',{count:'exact',head:true});
    const {count:banned}=await supabaseClient.from('profiles').select('id',{count:'exact',head:true}).eq('is_banned',true);
    const {count:verified}=await supabaseClient.from('profiles').select('id',{count:'exact',head:true}).eq('is_verified',true);
    document.getElementById('statTotal').textContent = total ?? 0;
    document.getElementById('statBanned').textContent = banned ?? 0;
    document.getElementById('statVerified').textContent = verified ?? 0;
    document.getElementById('statActive').textContent = (total??0) - (banned??0);
  }

  async function loadUsers(){
    const listEl=document.getElementById('userList');
    listEl.innerHTML='<div class="loading-state">Memuat data pengguna...</div>';
    let q=supabaseClient.from('profiles').select('id, username, avatar_url, created_at, is_banned, is_verified',{count:'exact'});
    if(currentSearch) q=q.ilike('username', `%${currentSearch}%`);
    if(currentFilter==='active') q=q.eq('is_banned', false);
    if(currentFilter==='banned') q=q.eq('is_banned', true);
    q=q.order('created_at',{ascending:false}).range(currentPage*PAGE_SIZE, currentPage*PAGE_SIZE+PAGE_SIZE-1);
    const {data,error,count}=await q;
    if(error){ listEl.innerHTML='<div class="empty-state">Gagal memuat data. Cek koneksi / hak akses admin.</div>'; return; }
    totalCount=count||0;
    document.getElementById('pageInfo').textContent=`Halaman ${currentPage+1} dari ${Math.max(1,Math.ceil(totalCount/PAGE_SIZE))}`;
    document.getElementById('prevBtn').disabled = currentPage===0;
    document.getElementById('nextBtn').disabled = (currentPage+1)*PAGE_SIZE >= totalCount;
    if(!data || data.length===0){ listEl.innerHTML='<div class="empty-state">Tidak ada pengguna ditemukan.</div>'; return; }
    listEl.innerHTML = data.map(u=>{
      const bg = u.avatar_url ? `background-image:url(${u.avatar_url});` : `background-color:${colorFor(u.id)};`;
      const inner = u.avatar_url ? '' : escapeHtml(initials(u.username));
      const statusBadge = u.is_banned ? '<span class="badge banned">Disuspend</span>' : '<span class="badge active">Aktif</span>';
      const verifyBadge = u.is_verified ? verifyBadgeSvg() : '';
      return `
      <div class="u-card" data-id="${u.id}">
        <div class="u-top">
          <div class="avatar" style="${bg}">${inner}</div>
          <div class="u-main">
            <div class="u-name">${escapeHtml(u.username||'Pengguna')} ${verifyBadge}</div>
            <div class="u-meta">Bergabung ${fmtDate(u.created_at)}</div>
          </div>
          ${statusBadge}
        </div>
        <div class="u-actions">
          <button class="detail-btn">Detail</button>
          <button class="${u.is_verified?'verify-on':''} verify-btn">${u.is_verified?'Batal Verif':'Verifikasi'}</button>
          <button class="${u.is_banned?'':'warn'} ban-btn">${u.is_banned?'Aktifkan':'Suspend'}</button>
          <button class="danger delete-btn">Hapus</button>
        </div>
      </div>`;
    }).join('');

    listEl.querySelectorAll('.detail-btn').forEach(btn=>btn.addEventListener('click',(e)=>{
      const id=e.target.closest('.u-card').dataset.id;
      const u=data.find(x=>x.id===id);
      openDetail(u);
    }));
    listEl.querySelectorAll('.verify-btn').forEach(btn=>btn.addEventListener('click',async (e)=>{
      const id=e.target.closest('.u-card').dataset.id;
      const u=data.find(x=>x.id===id);
      await toggleVerify(u);
    }));
    listEl.querySelectorAll('.ban-btn').forEach(btn=>btn.addEventListener('click',async (e)=>{
      const id=e.target.closest('.u-card').dataset.id;
      const u=data.find(x=>x.id===id);
      await toggleBan(u);
    }));
    listEl.querySelectorAll('.delete-btn').forEach(btn=>btn.addEventListener('click',async (e)=>{
      const id=e.target.closest('.u-card').dataset.id;
      const u=data.find(x=>x.id===id);
      await deleteUser(u);
    }));

    loadStats();
  }

  function openDetail(u){
    document.getElementById('detailName').textContent = u.username || 'Pengguna';
    document.getElementById('detailBody').innerHTML = `
      <div class="detail-row"><div class="k">User ID</div><div class="v">${escapeHtml(u.id)}</div></div>
      <div class="detail-row"><div class="k">Username</div><div class="v">${escapeHtml(u.username||'-')}</div></div>
      <div class="detail-row"><div class="k">Bergabung</div><div class="v">${fmtDate(u.created_at)}</div></div>
      <div class="detail-row"><div class="k">Status</div><div class="v">${u.is_banned?'Disuspend':'Aktif'}</div></div>
      <div class="detail-row"><div class="k">Verifikasi</div><div class="v">${u.is_verified?'Terverifikasi ✓':'Belum'}</div></div>
    `;
    document.getElementById('detailOverlay').classList.add('open');
  }
  document.getElementById('detailCloseBtn').addEventListener('click',()=>document.getElementById('detailOverlay').classList.remove('open'));

  async function toggleVerify(u){
    const willVerify = !u.is_verified;
    const ok = await showConfirm(
      willVerify ? 'Verifikasi pengguna ini?' : 'Batalkan verifikasi?',
      willVerify ? `${u.username} akan mendapat centang biru di profil, daftar chat, dan halaman chat.` : `Centang biru ${u.username} akan dihapus.`,
      willVerify ? 'Verifikasi' : 'Batalkan',
      willVerify ? 'btn-danger' : 'btn-cancel'
    );
    if(!ok) return;
    const {error}=await supabaseClient.from('profiles').update({is_verified: willVerify}).eq('id', u.id);
    if(error){ showToast('Gagal mengubah verifikasi: '+error.message); return; }
    showToast(willVerify ? 'Pengguna diverifikasi.' : 'Verifikasi dibatalkan.');
    loadUsers();
  }

  async function toggleBan(u){
    const willBan = !u.is_banned;
    const ok = await showConfirm(
      willBan ? 'Suspend pengguna ini?' : 'Aktifkan kembali pengguna ini?',
      willBan ? `${u.username} tidak akan bisa memakai akunnya sampai diaktifkan kembali.` : `${u.username} akan bisa memakai akunnya lagi seperti biasa.`,
      willBan ? 'Suspend' : 'Aktifkan',
      willBan ? 'btn-warn' : 'btn-danger'
    );
    if(!ok) return;
    const {error}=await supabaseClient.from('profiles').update({is_banned: willBan}).eq('id', u.id);
    if(error){ showToast('Gagal mengubah status: '+error.message); return; }
    showToast(willBan ? 'Pengguna disuspend.' : 'Pengguna diaktifkan kembali.');
    loadUsers();
  }

  async function deleteUser(u){
    const ok = await showConfirm(
      'Hapus akun ini?',
      `Profil ${u.username} akan dihapus permanen dari database. Tindakan ini tidak bisa dibatalkan.`,
      'Hapus', 'btn-danger'
    );
    if(!ok) return;
    const {error}=await supabaseClient.rpc('admin_delete_user_full', {target_id: u.id});
    if(error){ showToast('Gagal menghapus: '+error.message); return; }
    try{ await supabaseClient.storage.from('avatars').remove([u.id+'.jpg']); }catch(e){}
    showToast('Pengguna & seluruh datanya dihapus.');
    loadUsers();
  }

  let searchTimer=null;
  document.getElementById('searchInput').addEventListener('input',(e)=>{
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{ currentSearch=e.target.value.trim(); currentPage=0; loadUsers(); }, 350);
  });
  document.querySelectorAll('#filterPills button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('#filterPills button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter=btn.dataset.val; currentPage=0; loadUsers();
    });
  });
  document.getElementById('prevBtn').addEventListener('click',()=>{ if(currentPage>0){ currentPage--; loadUsers(); } });
  document.getElementById('nextBtn').addEventListener('click',()=>{ if((currentPage+1)*PAGE_SIZE<totalCount){ currentPage++; loadUsers(); } });
</script>
</body>
</html>
