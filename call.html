<!DOCTYPE html>
<html lang="id">
<head>
<script src="device-gate.js?v=__VERSION__"></script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Baku Chat - Panggilan</title>
<script>
(function(){
  function setAppHeight(){
    var h=(window.visualViewport?window.visualViewport.height:window.innerHeight);
    document.documentElement.style.setProperty('--app-height', h+'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', function(){ setTimeout(setAppHeight,50); });
  window.addEventListener('pageshow', setAppHeight);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') setAppHeight(); });
  if(window.visualViewport){ window.visualViewport.addEventListener('resize', setAppHeight); }
})();
</script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1730">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baku Chat">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bbm-blue:#0564f5; --bbm-blue-dark:#0039f0; }
  *{box-sizing:border-box;}
  html{ overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  body{
    overscroll-behavior:none; touch-action:none; user-select:none; -webkit-touch-callout:none;
    margin:0; font-family:'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#0a1730; color:#fff;
    position:fixed; inset:0; width:100%; height:100%; height:100dvh; height:var(--app-height, 100dvh); overflow:hidden;
    display:flex; align-items:stretch; justify-content:center; -webkit-font-smoothing:antialiased;
  }
  .phone{ width:100%; max-width:420px; background:linear-gradient(180deg,#0039f0 0%,#0a1730 55%); display:flex; flex-direction:column; position:relative; overflow:hidden; }
  @media (min-width:700px){ .phone{ max-width:640px; box-shadow:0 0 40px rgba(0,0,0,0.5); } }
  #authGate{ position:absolute; inset:0; z-index:200; background:#0a1730; display:flex; align-items:center; justify-content:center; }
  #authGate .spinner{ width:32px; height:32px; border-radius:50%; border:3px solid rgba(255,255,255,0.2); border-top-color:#fff; animation:authSpin .75s linear infinite; }
  @keyframes authSpin{ to{ transform:rotate(360deg); } }

  .call-screen{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:calc(56px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom)); text-align:center; }
  .call-top{ margin-top:24px; display:flex; flex-direction:column; align-items:center; }
  .call-avatar-wrap{ position:relative; width:112px; height:112px; margin-bottom:20px; }
  .call-avatar{ width:112px; height:112px; border-radius:50%; background:rgba(255,255,255,0.16); display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:700; position:relative; z-index:2; }
  .call-avatar-wrap.ringing::before, .call-avatar-wrap.ringing::after{
    content:''; position:absolute; inset:0; border-radius:50%; border:2px solid rgba(255,255,255,0.55);
    animation:ringPulse 1.8s ease-out infinite;
  }
  .call-avatar-wrap.ringing::after{ animation-delay:.6s; }
  @keyframes ringPulse{ 0%{ transform:scale(1); opacity:.9; } 100%{ transform:scale(1.55); opacity:0; } }
  .call-username{ font-size:21px; font-weight:700; }
  .call-status{ font-size:14px; opacity:.85; margin-top:8px; min-height:18px; letter-spacing:.2px; }

  .call-controls{ display:flex; gap:56px; align-items:center; }
  .ctrl-col{ display:flex; flex-direction:column; align-items:center; gap:9px; }
  .ctrl-label{ font-size:11.5px; opacity:.85; }
  .ctrl-btn{ width:58px; height:58px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; background:rgba(255,255,255,0.16); transition:background .15s ease, transform .1s ease; }
  .ctrl-btn:active{ transform:scale(0.94); }
  .ctrl-btn.active{ background:#ffffff; }
  .ctrl-btn.active svg{ stroke:#0a1730 !important; fill:#0a1730 !important; }
  .ctrl-btn.end{ background:#e04c4c; box-shadow:0 4px 16px rgba(224,76,76,0.5); }

  .call-hint{ font-size:11.5px; opacity:.6; margin-top:14px; max-width:280px; line-height:1.5; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=__VERSION__"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js');});}</script>
</head>
<body>
<div class="phone">
  <div id="authGate"><div class="spinner"></div></div>
  <div class="call-screen">
    <div class="call-top">
      <div class="call-avatar-wrap ringing" id="callAvatarWrap"><div class="call-avatar" id="callAvatar">?</div></div>
      <div class="call-username" id="callUsername">@—</div>
      <div class="call-status" id="callStatus">Menghubungkan...</div>
    </div>
    <div>
      <div class="call-controls">
        <div class="ctrl-col">
          <button class="ctrl-btn" id="muteBtn"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg></button>
          <div class="ctrl-label">Mikrofon</div>
        </div>
        <div class="ctrl-col">
          <button class="ctrl-btn end" id="endBtn"><svg viewBox="0 0 24 24" width="24" height="24" fill="#fff" style="transform:rotate(135deg);"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.25 1.02l-2.2 2.19z"/></svg></button>
          <div class="ctrl-label">Akhiri</div>
        </div>
      </div>
      <div class="call-hint">Audio dienkripsi otomatis oleh WebRTC (DTLS-SRTP), selaras dengan enkripsi end-to-end chat ini.</div>
    </div>
  </div>
  <audio id="remoteAudio" autoplay playsinline></audio>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const role = params.get('role');           // 'caller' | 'callee'
  const peerId = params.get('peer');
  const callId = params.get('callId');
  let peerUsername = params.get('uname') || params.get('myuname') || '';
  // Catatan: dari chat.html, caller kirim '&uname=<punya peer>&myuname=<punya saya>'.
  // Dari overlay panggilan masuk (app.js), callee cuma dikasih '&uname=<punya
  // penelepon>'. Ambil yang paling relevan tergantung role di bawah.
  peerUsername = role==='caller' ? (params.get('uname')||'') : (params.get('uname')||'');

  let currentUserId=null, myPublicKeyB64=null, myPrivateKey=null, peerPublicKeyB64=null;
  let pc=null, localStream=null, callChannel=null;
  let callStartedAt=null, timerInterval=null, ringTimeout=null, ended=false, muted=false;

  // STUN publik (Google) + TURN publik openrelay.metered.ca UNTUK TESTING SAJA.
  // Kredensial openrelay ini dipakai bersama oleh banyak developer di internet
  // -- gampang penuh/di-rate-limit dan TIDAK cocok untuk produksi. Sebelum
  // rilis ke pengguna beneran, ganti dengan akun TURN sendiri (metered.ca,
  // Twilio Network Traversal, Cloudflare Calls, atau self-host coturn).
  const ICE_SERVERS = [
    { urls: ['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302'] },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
  ];

  function setStatus(t){ document.getElementById('callStatus').textContent=t; }
  function setRinging(on){ document.getElementById('callAvatarWrap').classList.toggle('ringing',on); }
  function fmtDuration(s){ const m=Math.floor(s/60), sec=s%60; return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }
  function initials(u){ return (u||'?').slice(0,2).toUpperCase(); }

  async function boot(){
    if(!peerId||!callId){ setStatus('Panggilan tidak valid.'); setTimeout(()=>window.location.href='dashboard.html',1500); return; }
    const {data:{session}} = await supabaseClient.auth.getSession();
    if(!session){ window.location.replace('index.html'); return; }
    currentUserId=session.user.id;

    document.getElementById('callUsername').textContent='@'+(peerUsername||'kontak');
    document.getElementById('callAvatar').textContent=initials(peerUsername);
    document.getElementById('authGate').style.display='none';

    // Ambil kunci E2E saya + public key peer terbaru (dipakai buat catat log
    // panggilan terenkripsi ke chat, BUKAN buat enkripsi audio -- audio WebRTC
    // sudah dienkripsi sendiri lewat DTLS-SRTP).
    try{
      const kp=await E2E.ensureKeypair(currentUserId);
      myPrivateKey=kp.privateKey; myPublicKeyB64=kp.publicKeyB64;
      const {data:prof}=await supabaseClient.from('profiles').select('username, public_key').eq('id',peerId).maybeSingle();
      if(prof){
        if(prof.username){ peerUsername=prof.username; document.getElementById('callUsername').textContent='@'+peerUsername; document.getElementById('callAvatar').textContent=initials(peerUsername); }
        peerPublicKeyB64=prof.public_key||null;
      }
    }catch(e){ console.error('Gagal ambil profil peer:',e); }

    setStatus('Meminta izin mikrofon...');
    try{
      localStream=await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){
      setStatus('Butuh izin mikrofon untuk menelepon.');
      setTimeout(()=>leaveToChat(),2000);
      return;
    }

    pc=new RTCPeerConnection({iceServers:ICE_SERVERS});
    localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
    pc.ontrack=(e)=>{ document.getElementById('remoteAudio').srcObject=e.streams[0]; };
    pc.oniceconnectionstatechange=()=>{
      if((pc.iceConnectionState==='connected'||pc.iceConnectionState==='completed') && !callStartedAt){
        onConnected();
      }
    };
    pc.onicecandidate=(e)=>{
      if(e.candidate && callChannel) callChannel.send({type:'broadcast',event:'call-ice',payload:{candidate:e.candidate}});
    };

    callChannel=supabaseClient.channel('call-'+callId);
    callChannel
      .on('broadcast',{event:'call-ice'},(msg)=>{
        const c=msg.payload&&msg.payload.candidate;
        if(c) pc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});
      })
      .on('broadcast',{event:'call-end'},()=>{ endCall(false); })
      .on('broadcast',{event:'call-answer'},async (msg)=>{
        if(role!=='caller'||!msg.payload) return;
        try{ await pc.setRemoteDescription(new RTCSessionDescription(msg.payload.sdp)); setRinging(false); setStatus('Menghubungkan...'); }catch(e){}
      })
      .on('broadcast',{event:'call-reject'},()=>{
        clearTimeout(ringTimeout); setRinging(false);
        setStatus('Panggilan ditolak');
        logCallOutcome('rejected');
        setTimeout(()=>leaveToChat(),1200);
      })
      .subscribe(async (status)=>{
        if(status!=='SUBSCRIBED') return;
        if(role==='caller') await startAsCaller();
        else await startAsCallee();
      });
  }

  async function startAsCaller(){
    setStatus('Memanggil...');
    setRinging(true);
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    let myUsername=params.get('myuname')||'';
    await broadcastToChannel('call-signal-'+peerId,'call-offer',{callId, from:currentUserId, fromUsername:myUsername, sdp:offer});
    // Kalau 30 detik tidak dijawab, anggap tidak terjawab & berhenti nunggu.
    ringTimeout=setTimeout(async ()=>{
      if(!callStartedAt){
        await broadcastToChannel('call-signal-'+peerId,'call-cancel',{callId});
        setStatus('Tidak dijawab');
        logCallOutcome('missed');
        setTimeout(()=>leaveToChat(),1200);
      }
    },30000);
  }

  async function startAsCallee(){
    setRinging(false);
    setStatus('Menghubungkan...');
    const raw=sessionStorage.getItem('incomingCall_'+callId);
    const payload=raw?JSON.parse(raw):null;
    if(!payload||!payload.sdp){ setStatus('Data panggilan tidak ditemukan.'); setTimeout(()=>leaveToChat(),1500); return; }
    try{
      await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
      const answer=await pc.createAnswer();
      await pc.setLocalDescription(answer);
      callChannel.send({type:'broadcast',event:'call-answer',payload:{sdp:answer}});
      sessionStorage.removeItem('incomingCall_'+callId);
    }catch(e){
      console.error('Gagal menjawab panggilan:',e);
      setStatus('Gagal menyambungkan panggilan.');
      setTimeout(()=>leaveToChat(),1500);
    }
  }

  function onConnected(){
    callStartedAt=Date.now();
    clearTimeout(ringTimeout);
    setRinging(false);
    setStatus('00:00');
    timerInterval=setInterval(()=>{
      setStatus(fmtDuration(Math.floor((Date.now()-callStartedAt)/1000)));
    },1000);
  }

  // Cuma sisi PENELEPON yang mencatat log panggilan ke chat -- supaya tidak
  // dobel-catat (kedua sisi share tabel messages yang sama, satu baris cukup
  // buat merepresentasikan hasil satu panggilan dari kedua sudut pandang).
  async function logCallOutcome(status){
    if(role!=='caller') return;
    if(!myPublicKeyB64||!peerPublicKeyB64) return;
    const duration=callStartedAt?Math.floor((Date.now()-callStartedAt)/1000):0;
    const marker='[CALL_LOG]'+JSON.stringify({status,duration});
    try{
      const encrypted=await E2E.encryptMessage(myPublicKeyB64,peerPublicKeyB64,marker);
      await supabaseClient.from('messages').insert({sender_id:currentUserId,receiver_id:peerId,content:encrypted});
    }catch(e){ console.error('Gagal mencatat log panggilan:',e); }
  }

  function cleanupMedia(){
    if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
    if(pc){ try{pc.close();}catch(e){} pc=null; }
    if(callChannel){ supabaseClient.removeChannel(callChannel); callChannel=null; }
  }

  function leaveToChat(){
    window.location.href='chat.html?uid='+encodeURIComponent(peerId)+'&uname='+encodeURIComponent(peerUsername||'');
  }

  function endCall(iInitiated){
    if(ended) return; ended=true;
    clearTimeout(ringTimeout); clearInterval(timerInterval);
    const wasConnected=!!callStartedAt;
    if(iInitiated && callChannel){ callChannel.send({type:'broadcast',event:'call-end',payload:{}}); }
    if(wasConnected){
      setStatus('Panggilan berakhir');
      logCallOutcome('ended');
    } else if(role==='caller' && iInitiated){
      broadcastToChannel('call-signal-'+peerId,'call-cancel',{callId});
      logCallOutcome('cancelled');
    }
    cleanupMedia();
    setTimeout(()=>leaveToChat(), wasConnected?800:500);
  }

  document.getElementById('endBtn').addEventListener('click',()=>endCall(true));
  document.getElementById('muteBtn').addEventListener('click',()=>{
    muted=!muted;
    if(localStream) localStream.getAudioTracks().forEach(t=>t.enabled=!muted);
    document.getElementById('muteBtn').classList.toggle('active',muted);
  });

  // Best-effort: kalau tab/app ditutup langsung (bukan lewat tombol Akhiri),
  // tetap coba kasih tau lawan bicara & lepas mic -- tidak selalu berhasil
  // 100% karena browser tidak selalu kasih waktu buat request async selesai
  // pas halaman beneran ditutup.
  window.addEventListener('pagehide',()=>{
    if(!ended && callChannel){ callChannel.send({type:'broadcast',event:'call-end',payload:{}}); }
    cleanupMedia();
  });

  boot();
</script>
</body>
</html>
