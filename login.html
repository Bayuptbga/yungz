<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Private Chat - Masuk</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2a32">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bbm-blue-dark:#0b141a;
    --bbm-blue:#1b2a32;
    --bbm-blue-light:#233138;
    --bg:#121b22;
    --card-bg:#1b2a32;
    --ink:#e9edf0;
    --muted:#8696a0;
    --border:#2a3942;
    --ok:#2ecc71;
    --error:#f15c6d;
    --accent:#53bdeb;
    --accent-soft:rgba(83,189,235,0.16);
  }
  *{box-sizing:border-box;}
  html{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;font-family:'Inter','Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;-webkit-font-smoothing:antialiased;
  }
  input{user-select:text;}
  .phone{
    width:100%;max-width:420px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;
    position:relative;overflow:hidden;
  }
  .phone::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
    background-size:22px 22px;
  }
  .topbar{
    position:relative;padding:calc(40px + env(safe-area-inset-top)) 24px 30px;text-align:center;overflow:hidden;
    background:linear-gradient(180deg,var(--bbm-blue-dark) 0%,var(--bg) 100%);
  }
  .topbar::before{
    content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);
    width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle, rgba(83,189,235,0.22) 0%, rgba(83,189,235,0) 70%);
    pointer-events:none;
  }
  .logo-mark{
    position:relative;width:74px;height:74px;border-radius:22px;margin:0 auto 18px;
    background:linear-gradient(145deg,#1c3138,#0d3a42);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1px rgba(83,189,235,0.22), 0 14px 32px -10px rgba(83,189,235,0.5);
    animation:glowPulse 3.4s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{box-shadow:0 0 0 1px rgba(83,189,235,0.22), 0 14px 32px -10px rgba(83,189,235,0.5);}
    50%{box-shadow:0 0 0 1px rgba(83,189,235,0.4), 0 16px 42px -6px rgba(83,189,235,0.7);}
  }
  @media (prefers-reduced-motion:reduce){ .logo-mark{animation:none;} }
  .logo-mark svg.bubble{width:34px;height:34px;}
  .logo-mark img.bubble-img{width:56px;height:56px;border-radius:16px;object-fit:cover;}
  .logo-lock{
    position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;
    background:var(--accent);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 3px var(--bg);
  }
  .logo-lock svg{width:14px;height:14px;}
  .topbar h1{margin:0 0 6px;font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:700;letter-spacing:-0.2px;}
  .topbar p{margin:0 0 12px;font-size:12.5px;color:var(--muted);}
  .badge-row{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--accent);font-weight:600;letter-spacing:0.2px;}
  .badge-row svg{width:12px;height:12px;flex-shrink:0;}
  .body{position:relative;flex:1;padding:26px 24px 40px;display:flex;flex-direction:column;}
  .tabs{position:relative;display:flex;background:var(--card-bg);border-radius:12px;padding:4px;margin-bottom:26px;border:1px solid var(--border);}
  .tab{flex:1;position:relative;z-index:1;text-align:center;padding:10px 0;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:9px;cursor:pointer;transition:color .2s ease;}
  .tab.active{background:var(--border);color:var(--ink);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:0.4px;}
  .input-wrap{display:flex;align-items:center;gap:2px;border:1.5px solid var(--border);border-radius:11px;background:var(--bbm-blue-dark);padding:0 12px;transition:border-color .15s ease, box-shadow .15s ease;}
  .input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .input-wrap svg{width:16px;height:16px;color:var(--muted);flex-shrink:0;stroke:var(--muted);}
  .input-wrap input{border:none;outline:none;background:transparent;padding:12px 8px;font-size:15px;width:100%;color:var(--ink);font-family:'Inter',sans-serif;}
  .input-wrap .prefix{color:var(--muted);font-weight:700;}
  .toggle-pw{font-size:11px;color:var(--accent);font-weight:700;cursor:pointer;letter-spacing:0.3px;flex-shrink:0;}
  .btn{margin-top:6px;width:100%;padding:14px 0;background:linear-gradient(135deg,var(--accent) 0%,#2e9bd1 100%);color:#062733;border:none;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px -8px rgba(83,189,235,0.6);transition:transform .12s ease;font-family:'Inter',sans-serif;}
  .btn:active{transform:scale(0.98);}
  .btn-alt{width:100%;padding:13px 0;background:transparent;color:var(--ink);border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;}
  .btn-alt svg{width:16px;height:16px;stroke:var(--muted);}
  .divider{display:flex;align-items:center;margin:22px 0;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.6px;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .divider span{padding:0 10px;}
  .foot-note{text-align:center;font-size:12.5px;color:var(--muted);margin-top:22px;}
  .foot-note a{color:var(--accent);text-decoration:none;font-weight:600;}
  .banner-err{display:none;background:#3f1d24;border:1px solid var(--error);color:var(--error);font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:16px;}
  .banner-err.show{display:block;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js?v=2"></script>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="logo-mark">
      <img class="bubble-img" src="icons/icon-128.png" alt="Private Chat">
      <div class="logo-lock"><svg viewBox="0 0 24 24" fill="none" stroke="#06222c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></div>
    </div>
    <h1>Private Chat</h1>
    <p>Masuk untuk lanjut ngobrol</p>
    <div class="badge-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg><span>Akses dibatasi kontak &amp; PIN pribadi</span></div>
  </div>
  <div class="body">
    <div class="tabs"><div class="tab" onclick="location.replace('daftar.html')">Daftar</div><div class="tab active">Masuk</div></div>
    <div class="banner-err" id="loginError"></div>
    <form id="loginForm">
      <div class="field"><label>Username</label><div class="input-wrap"><span class="prefix">@</span><input type="text" id="username" required autocomplete="username"></div></div>
      <div class="field"><label>Kata Sandi</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg><input type="password" id="password" required autocomplete="current-password"><span class="toggle-pw" onclick="const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';">LIHAT</span></div></div>
      <button type="submit" class="btn" id="submitBtn">Masuk</button>
    </form>
    <div class="divider"><span>atau</span></div>
    <button class="btn-alt" onclick="alert('Belum tersedia')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Masuk dengan PIN</button>
    <div class="foot-note">Belum punya akun? <a href="daftar.html">Daftar sekarang</a></div>
  </div>
</div>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const u=document.getElementById('username').value.trim(), p=document.getElementById('password').value, b=document.getElementById('submitBtn'), err=document.getElementById('loginError');
    err.classList.remove('show'); b.disabled=true; b.textContent='Memeriksa...';
    const {error} = await supabaseClient.auth.signInWithPassword({email: usernameToEmail(u), password: p});
    if(error){err.textContent='Username atau kata sandi salah.'; err.classList.add('show'); b.disabled=false; b.textContent='Masuk'; return;}
    window.location.replace('index.html');
  });
</script>
</body>
</html>
