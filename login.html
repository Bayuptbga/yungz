<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BBM Private Chat - Masuk</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2a32">
<style>
  :root{
    --bbm-blue-dark:#0b141a;
    --bbm-blue:#1b2a32;
    --bbm-blue-light:#233138;
    --bg:#121b22;
    --card-bg:#1b2a32;
    --ink:#e9edf0;
    --muted:#8696a0;
    --border:#2a3942;
    --ok:#2ecc71;
    --error:#f15c6d;
  }
  *{box-sizing:border-box;}
  html{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;}
  input{user-select:text;}
  .phone{width:100%;max-width:420px;min-height:100vh;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,0.5);display:flex;flex-direction:column;}
  .topbar{background:var(--bbm-blue);color:#fff;padding:18px 20px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .logo-mark{width:56px;height:56px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .topbar h1{margin:2px 0;font-size:21px;font-weight:600;}
  .topbar p{margin:0;font-size:12.5px;opacity:0.9;}
  .body{flex:1;padding:26px 24px 40px;display:flex;flex-direction:column;}
  .tabs{display:flex;background:var(--card-bg);border-radius:10px;padding:4px;margin-bottom:24px;}
  .tab{flex:1;text-align:center;padding:9px 0;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:8px;cursor:pointer;transition:all .2s;}
  .tab.active{background:var(--border);color:var(--ink);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
  .input-wrap{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);padding:0 12px;}
  .input-wrap:focus-within{border-color:var(--muted);}
  .input-wrap input{border:none;outline:none;background:transparent;padding:12px 8px;font-size:15px;width:100%;color:var(--ink);}
  .input-wrap .prefix{color:var(--muted);font-weight:700;}
  .toggle-pw{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;}
  .btn{margin-top:4px;width:100%;padding:13px 0;background:var(--bbm-blue-light);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
  .btn-alt{width:100%;padding:12px 0;background:transparent;color:var(--ink);border:1.5px solid var(--border);border-radius:10px;font-size:14.5px;font-weight:700;cursor:pointer;}
  .divider{display:flex;align-items:center;margin:22px 0;color:var(--muted);font-size:11.5px;text-transform:uppercase;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .divider span{padding:0 10px;}
  .foot-note{text-align:center;font-size:12.5px;color:var(--muted);margin-top:20px;}
  .foot-note a{color:#53bdeb;text-decoration:none;}
  .banner-err{display:none;background:#3f1d24;border:1px solid var(--error);color:var(--error);font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:16px;}
  .banner-err.show{display:block;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js?v=2"></script>
</head>
<body>
<div class="phone">
  <div class="topbar"><div class="logo-mark"><svg viewBox="0 0 24 24" width="32" height="32" fill="#1b2a32"><path d="M4 4h16a2 2 0 012 2v9a2 2 0 01-2 2H9l-5 4v-4H4a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg></div><h1>Private Chat</h1><p>Masuk untuk lanjut ngobrol</p></div>
  <div class="body">
    <div class="tabs"><div class="tab" onclick="location.replace('daftar.html')">Daftar</div><div class="tab active">Masuk</div></div>
    <div class="banner-err" id="loginError"></div>
    <form id="loginForm">
      <div class="field"><label>Username</label><div class="input-wrap"><span class="prefix">@</span><input type="text" id="username" required></div></div>
      <div class="field"><label>Kata Sandi</label><div class="input-wrap"><input type="password" id="password" required><span class="toggle-pw" onclick="const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';">LIHAT</span></div></div>
      <button type="submit" class="btn" id="submitBtn">Masuk</button>
    </form>
    <div class="divider"><span>atau</span></div>
    <button class="btn-alt" onclick="alert('Belum tersedia')">Masuk dengan PIN</button>
    <div class="foot-note">Belum punya akun? <a href="daftar.html">Daftar sekarang</a></div>
  </div>
</div>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const u=document.getElementById('username').value.trim(), p=document.getElementById('password').value, b=document.getElementById('submitBtn'), err=document.getElementById('loginError');
    err.classList.remove('show'); b.disabled=true; b.textContent='Memeriksa...';
    const {error} = await supabaseClient.auth.signInWithPassword({email: usernameToEmail(u), password: p});
    if(error){err.textContent='Username atau kata sandi salah.'; err.classList.add('show'); b.disabled=false; b.textContent='Masuk'; return;}
    window.location.replace('index.html');
  });
</script>
</body>
</html>
