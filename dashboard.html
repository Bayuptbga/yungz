<!DOCTYPE html>
<html lang="id">
<head>
<script src="device-gate.js"></script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Baku Chat - Chats</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123350">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baku Chat">
<style>
  @view-transition { navigation: auto; }
  :root{
    --bbm-blue-dark:#0a1e2f;
    --bbm-blue:#123350;
    --bbm-blue-light:#184068;
    --bg:#0a1c2c;
    --card-bg:#123350;
    --ink:#eef6fb;
    --muted:#7ea0b7;
    --border:#1d425e;
    --tab-active:#eef6fb;
    --ok:#2ecc71;
    --error:#f15c6d;
  }
  *{box-sizing:border-box;}
  html{ overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  body{
    overscroll-behavior:none; touch-action:pan-y; user-select:none; -webkit-touch-callout:none;
    margin:0; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink);
    position:fixed; inset:0; width:100%; height:100%; overflow:hidden; display:flex; align-items:flex-start; justify-content:center;
  }
  input, textarea{ user-select:text; }
  .phone{ width:100%; max-width:420px; height:100%; background:var(--bg); box-shadow:0 0 40px rgba(0,0,0,0.5); display:flex; flex-direction:column; position:relative; overflow:hidden; }
  /* ---- Breakpoint bertingkat: HP kecil -> phablet -> tablet Android kecil -> tablet Android besar ---- */
  /* Phablet / HP layar besar (mis. Galaxy S Ultra, Note) */
  @media (min-width:480px){ .phone{ max-width:480px; } }
  /* Tablet Android portrait/landscape kecil (mis. Tab A, Tab S kecil) */
  @media (min-width:700px){ .phone{ max-width:640px; } }
  /* Tablet Android besar (mis. Tab S8+/S9 Ultra) */
  @media (min-width:1000px){ .phone{ max-width:720px; } }
  /* HP diputar ke landscape (viewport pendek) -> jangan biarkan phone melebar penuh,
     supaya proporsi tetap wajar dan konten tidak terlalu meregang ke samping */
  @media (orientation:landscape) and (max-height:480px){ .phone{ max-width:480px; } }
  #authGate{ position:absolute; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center; justify-content:center; }
  #authGate .spinner{ width:32px; height:32px; border-radius:50%; border:3px solid var(--border); border-top-color:#22d8e6; animation:authSpin .75s linear infinite; }
  @keyframes authSpin{ to{ transform:rotate(360deg); } }
  .ptr-indicator{ display:flex; align-items:center; justify-content:center; height:0; overflow:hidden; flex-shrink:0; }
  .ptr-spinner{ width:22px; height:22px; border-radius:50%; border:2.5px solid var(--border); border-top-color:var(--border); }
  .ptr-indicator.loading .ptr-spinner{ border-top-color:#22d8e6; animation:authSpin .7s linear infinite; }
  .appbar,.tabbar{flex-shrink:0;}
  .appbar{ position:relative; background:var(--bbm-blue); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; }
  .appbar .left{ display:flex; align-items:center; gap:18px; }
  .appbar .hamburger{ display:flex; flex-direction:column; gap:4px; cursor:pointer; }
  .appbar .hamburger span{ width:22px; height:2.5px; background:#fff; border-radius:2px; }
  .appbar h1{ margin:0; font-size:22px; font-weight:500; }
  .appbar .right{ display:flex; align-items:center; gap:20px; }
  .appbar .icon-btn{ cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .search-bar{ display:none; align-items:center; gap:10px; background:var(--bbm-blue); padding:14px 16px; flex-shrink:0; position:absolute; inset:0; z-index:5; }
  .search-bar.show{ display:flex; }
  .search-bar .search-close{ cursor:pointer; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; width:32px; height:32px; }
  .search-bar .search-wrap{ flex:1; position:relative; display:flex; align-items:center; background:var(--bbm-blue-light); border-radius:999px; padding:0 16px; height:40px; }
  .search-bar input{ flex:1; background:transparent; border:none; color:#fff; font-size:16.5px; outline:none; font-family:inherit; caret-color:#22d8e6; }
  .search-bar input::placeholder{ color:var(--muted); }
  .no-results{ padding:40px 24px; text-align:center; color:var(--muted); font-size:13.5px; }
  .drawer-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:40; }
  .drawer-overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{ position:fixed; top:0; bottom:0; left:0; width:78%; max-width:300px; background:var(--bg); display:flex; flex-direction:column; transform:translateX(-100%); transition:transform .25s ease; z-index:41; box-shadow:2px 0 20px rgba(0,0,0,0.5); }
  .drawer.open{ transform:translateX(0); }
  .drawer-header{ background:var(--bbm-blue); color:#fff; padding:28px 18px 20px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .drawer-header .d-avatar{ width:46px;height:46px;border-radius:50%; background:rgba(255,255,255,0.2); display:flex;align-items:center;justify-content:center; font-weight:700;font-size:16px; flex-shrink:0; }
  .drawer-header .d-uname{ font-size:15px; font-weight:600; word-break:break-word; }
  .drawer-header .d-pin{ font-size:11.5px; opacity:0.85; margin-top:3px; font-family:'Courier New',monospace; }
  .drawer-body{ flex:1; overflow-y:auto; padding:6px 0; }
  .drawer-item{ display:flex; align-items:center; gap:16px; padding:13px 18px; cursor:pointer; color:var(--ink); font-size:14.5px; }
  .drawer-item:active{ background:var(--border); }
  .drawer-item svg{ width:20px;height:20px; flex-shrink:0; }
  .drawer-footer{ flex-shrink:0; border-top:1px solid var(--border); padding:6px 0; }
  .drawer-footer .drawer-item{ color:var(--error); }
  .tabbar{
    position:absolute; left:50%; bottom:calc(14px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    display:flex; align-items:center; gap:3px;
    background:rgba(18,51,80,0.82); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-radius:999px; padding:6px; z-index:25;
    border:1px solid rgba(255,255,255,0.07);
    box-shadow:0 10px 28px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.04) inset;
  }
  .tabbar .tabitem{
    flex:none; width:66px; padding:8px 4px 7px; border-radius:999px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    position:relative; cursor:pointer;
    transition:background .25s ease, transform .15s ease;
  }
  .tabbar .tabitem:active{ transform:scale(0.93); }
  .tabbar .tabitem.active{
    background:linear-gradient(180deg, rgba(34,216,230,0.20), rgba(34,216,230,0.07));
    box-shadow:0 0 0 1px rgba(34,216,230,0.28) inset;
  }
  .tabbar .tabitem svg{ width:18px; height:18px; transition:stroke .25s ease, fill .25s ease, filter .25s ease; }
  .tabbar .tabitem.active svg{ filter:drop-shadow(0 0 5px rgba(34,216,230,0.55)); }
  .tabbar .tabitem.active svg[stroke]:not([stroke="none"]){ stroke:#22d8e6; }
  .tabbar .tabitem.active svg[fill]:not([fill="none"]){ fill:#22d8e6; }
  .tabbar .tabitem .tlabel{ font-size:9px; font-weight:600; color:var(--muted); line-height:1; transition:color .25s ease; }
  .tabbar .tabitem.active .tlabel{ color:#22d8e6; font-weight:700; }
  .tabbar .tabitem .badge{
    position:absolute; top:4px; right:11px; width:8px; height:8px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #ff6b7a, #f0293f);
    border:2px solid var(--card-bg);
    animation:badgePulse 1.8s ease-in-out infinite;
  }
  @keyframes badgePulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(240,41,63,0.55); }
    50%{ box-shadow:0 0 0 4px rgba(240,41,63,0); }
  }
  .chatlist{ flex:1; overflow-y:auto; }
  .skel-item{ display:flex; align-items:center; gap:14px; padding:12px 16px; }
  .skel-avatar{ width:52px; height:52px; border-radius:50%; flex-shrink:0; background:var(--border); }
  .skel-lines{ flex:1; display:flex; flex-direction:column; gap:8px; }
  .skel-line{ height:11px; border-radius:6px; background:var(--border); }
  .skel-line.w60{ width:60%; }
  .skel-line.w40{ width:40%; }
  .skel-avatar,.skel-line{ position:relative; overflow:hidden; }
  .skel-avatar::after,.skel-line::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    animation:skelShimmer 1.3s ease-in-out infinite;
  }
  @keyframes skelShimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
  @media (prefers-reduced-motion:reduce){ .skel-avatar::after,.skel-line::after{animation:none;} }
  .chat-item{ display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
  .chat-item:active{ background:var(--border); }
  .avatar{ width:52px; height:52px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; color:#fff; }
  .chat-main{ flex:1; min-width:0; }
  .chat-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .chat-name{ font-size:16.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-bottom{ display:flex; align-items:center; gap:6px; margin-top:3px; }
  .status-icon{ width:16px; height:16px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; }
  .status-icon.broadcast{background:none;}
  .chat-msg{ font-size:13.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fab{ position:absolute; right:18px; bottom:calc(78px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%; background:var(--bbm-blue); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,0.5); cursor:pointer; }
  .fab svg{width:24px;height:24px;}
  .icon-btn{position:relative;}
  .dropdown-menu{ position:absolute; top:38px; right:0; background:var(--card-bg); color:var(--ink); border-radius:8px; box-shadow:0 4px 18px rgba(0,0,0,0.5); min-width:170px; padding:6px 0; opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .15s ease, transform .15s ease; z-index:50; border:1px solid var(--border); }
  .dropdown-menu.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .dropdown-menu .dd-item{ padding:11px 16px; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:10px; }
  .dropdown-menu .dd-item:active{ background:var(--border); }
  .dropdown-menu .dd-item svg{ width:18px;height:18px; flex-shrink:0; stroke:var(--ink); }
  .pin-modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:60; padding:24px; }
  .pin-modal-overlay.open{ opacity:1; pointer-events:auto; }
  .pin-modal{ background:var(--card-bg); border-radius:14px; padding:26px 22px; width:100%; max-width:300px; text-align:center; border:1px solid var(--border); }
  .pin-modal .pm-title{ font-size:15.5px; font-weight:700; margin-bottom:4px; color:var(--ink); }
  .pin-modal .pm-sub{ font-size:12px; color:var(--muted); margin-bottom:18px; }
  .pin-modal .pm-box{ background:var(--bg); border:1.5px dashed var(--muted); border-radius:12px; padding:16px; margin-bottom:16px; }
  .pin-modal .pm-pin{ font-size:26px; font-weight:800; letter-spacing:4px; color:var(--ink); font-family:'Courier New',monospace; }
  .pin-modal .pm-copy{ font-size:12.5px; color:#22d8e6; font-weight:600; background:none; border:none; cursor:pointer; margin-bottom:14px; padding:6px 10px; }
  .pin-modal .pm-close{ width:100%; padding:11px 0; background:var(--bbm-blue); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; }
  .cprev-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:70; padding:24px; }
  .cprev-overlay.open{ opacity:1; pointer-events:auto; }
  .cprev-card{ background:var(--card-bg); border-radius:16px; width:100%; max-width:290px; text-align:center; border:1px solid var(--border); overflow:hidden; }
  .cprev-top{ width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; }
  .cprev-avatar{ width:100%; height:100%; border-radius:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:52px; flex-shrink:0; }
  .cprev-body{ padding:18px 22px 20px; }
  .cprev-uname{ font-size:17px; font-weight:700; color:var(--ink); word-break:break-word; }
  .cprev-sub{ font-size:12.5px; color:var(--muted); margin-top:3px; margin-bottom:20px; }
  .cprev-actions{ display:flex; flex-direction:row; gap:10px; }
  .cprev-btn{ flex:1; padding:14px 6px 12px; border-radius:14px; font-size:11.5px; font-weight:700; cursor:pointer; border:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; }
  .cprev-btn svg{ width:18px; height:18px; flex-shrink:0; }
  .cprev-btn.primary{ background:var(--bbm-blue); color:#fff; }
  .cprev-btn.secondary{ background:var(--bg); color:var(--ink); border:1px solid var(--border); }
  /* ---- Bottom sheet "Chat Baru" (fab di tab Chat) ---- */
  .ncw-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:75; }
  .ncw-overlay.open{ opacity:1; pointer-events:auto; }
  .ncw-sheet{ width:100%; max-width:420px; height:78vh; background:var(--card-bg); border:1px solid var(--border); border-top-left-radius:20px; border-top-right-radius:20px; display:flex; flex-direction:column; transform:translateY(16px); transition:transform .22s ease; box-shadow:0 -10px 40px rgba(0,0,0,0.5); }
  .ncw-overlay.open .ncw-sheet{ transform:translateY(0); }
  .ncw-grip{ width:36px; height:4px; border-radius:3px; background:var(--border); margin:10px auto 6px; flex-shrink:0; }
  .ncw-head{ display:flex; align-items:center; justify-content:space-between; padding:2px 18px 12px; flex-shrink:0; }
  .ncw-head h3{ margin:0; font-size:16.5px; font-weight:700; color:var(--ink); }
  .ncw-close{ cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center; width:30px; height:30px; }
  .ncw-search-wrap{ padding:0 18px 12px; flex-shrink:0; }
  .ncw-search{ display:flex; align-items:center; gap:8px; background:var(--bbm-blue-dark); border:1.5px solid var(--border); border-radius:999px; padding:0 14px; height:42px; }
  .ncw-search svg{ width:18px; height:18px; stroke:var(--muted); flex-shrink:0; }
  .ncw-search input{ flex:1; background:transparent; border:none; outline:none; color:var(--ink); font-size:14.5px; font-family:inherit; }
  .ncw-search input::placeholder{ color:var(--muted); }
  .ncw-list{ flex:1; overflow-y:auto; padding:2px 8px calc(20px + env(safe-area-inset-bottom)); }
  .ncw-list .contact-item{ padding-left:10px; padding-right:10px; border-radius:10px; }
  .ncw-empty{ padding:44px 24px; text-align:center; color:var(--muted); font-size:13.5px; line-height:1.6; }
  .tab-panel{ display:none; flex:1; min-height:0; flex-direction:column; overflow-y:auto; padding-bottom:calc(70px + env(safe-area-inset-bottom)); }
  .tab-panel.active{display:flex; animation:panelFadeIn .18s ease both;}
  #panelChats.active{display:flex;flex-direction:column;flex:1;min-height:0;position:relative;}
  @keyframes panelFadeIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
  .status-empty, .panel-empty{ padding:48px 24px; text-align:center; color:var(--muted); font-size:13.5px; line-height:1.6; }
  .status-empty .icon, .panel-empty .icon{ margin-bottom:12px; display:flex; justify-content:center; }
  .add-row{display:flex;gap:8px;}
  .add-row input{ flex:1; background:var(--bg); border:1.5px solid var(--border); color:var(--ink); border-radius:10px; padding:11px 12px; font-size:15px; font-family:'Courier New',monospace; outline:none; }
  .add-row input:focus{border-color:var(--muted);}
  .add-row button{ padding:0 18px; background:var(--bbm-blue); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; }
  .add-row button:disabled{background:var(--border); color:var(--muted);}
  .search-msg{margin-top:10px;font-size:13px;} .search-msg.err{color:var(--error);} .search-msg.ok{color:var(--ok);}
  .found-card{ display:none; margin-top:16px; background:var(--bbm-blue-light); border:1px solid var(--border); border-radius:12px; padding:12px 14px; align-items:center; gap:12px; }
  .found-card.show{display:flex;}
  .found-card .avatar{ width:44px;height:44px;border-radius:50%; background:var(--bbm-blue); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:700;font-size:15px; flex-shrink:0; }
  .found-card .info{flex:1;min-width:0;}
  .found-card .info .uname{font-weight:600;font-size:15px; color:var(--ink);}
  .found-card .info .pin-label{font-size:11.5px;color:var(--muted);}
  .section-title{ padding:16px 16px 8px; font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; flex-shrink:0; display:flex; align-items:center; gap:8px; }
  .section-title::after{ content:''; flex:1; height:1px; background:var(--border); }
  .count-badge{ background:var(--border); color:var(--muted); font-weight:700; font-size:11px; padding:2px 8px; border-radius:999px; text-transform:none; letter-spacing:normal; }
  .contact-item{ display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer; transition:background-color .15s ease; }
  .contact-item:active{background:var(--border);}
  .contact-item .avatar{ width:48px;height:48px;border-radius:50%; display:flex;align-items:center;justify-content:center; color:#fff;font-weight:700;font-size:16px; }
  .contact-item .uname{font-size:15.5px;font-weight:600; color:var(--ink);}
  .addpage{ position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:150; opacity:0; pointer-events:none; transition:opacity .22s ease; display:flex; align-items:flex-end; justify-content:center; }
  .addpage.show{ opacity:1; pointer-events:auto; }
  .addpage-box{ width:100%; max-width:420px; height:56%; max-height:520px; background:var(--bg); border-radius:20px 20px 0 0; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 -10px 30px rgba(0,0,0,0.45); transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1); will-change:transform; }
  .addpage.show .addpage-box{ transform:translateY(0); }
  .addpage-header{ background:var(--bbm-blue); color:#fff; padding:16px 16px 14px; display:flex; align-items:center; gap:18px; flex-shrink:0; border-radius:20px 20px 0 0; }
  .addpage-header .back-btn{ display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .addpage-header h2{ margin:0; font-size:18px; font-weight:600; }
  .addpage-body{ flex:1; overflow-y:auto; padding:20px 18px; }
  .field-label{ font-size:12px; color:#22d8e6; font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-bottom:8px; }
  .field-row{ display:flex; align-items:center; gap:8px; border:1.5px solid var(--border); border-radius:12px; padding:4px 4px 4px 14px; transition:border-color .15s ease; }
  .field-row:focus-within{ border-color:#22d8e6; }
  .field-row input{ flex:1; background:transparent; border:none; color:var(--ink); font-size:16px; padding:11px 0; font-family:'Courier New',monospace; letter-spacing:1px; outline:none; }
  .field-row input::placeholder{ color:var(--muted); font-family:inherit; letter-spacing:normal; }
  .field-search-btn{ width:38px; height:38px; border-radius:10px; background:var(--bbm-blue); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .field-search-btn:disabled{ background:var(--border); }
  .field-hint{ font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.55; }
  .addpage-footer{ flex-shrink:0; padding:14px 18px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); }
  .btn-primary-full{ width:100%; background:#22d8e6; color:#04202c; border:none; border-radius:12px; padding:15px; font-size:15px; font-weight:700; cursor:pointer; transition:opacity .15s ease; }
  .btn-primary-full:disabled{ background:var(--border); color:var(--muted); }

<script>
  let currentUserPin=null,myPrivateKey=null;const colorPalette=['#c77b8c','#3a3f47','#2f6b3a','#5b6b74','#2c2c2c','#7c3f9e','#8a7a4a','#1a7fc2'];
  function colorFor(id){let hash=0;for(let i=0;i<id.length;i++)hash=id.charCodeAt(i)+((hash<<5)-hash);return colorPalette[Math.abs(hash)%colorPalette.length];}
  function initials(u){return(u||'?').slice(0,2).toUpperCase();}
  // Helper foto profil: dipakai di template string (avatarStyle/avatarInner) dan di DOM langsung (applyAvatarEl).
  function avatarStyle(id,avatarUrl){return avatarUrl?`background:url(${avatarUrl}) center/cover no-repeat;`:`background:${colorFor(id)};`;}
  function avatarInner(username,avatarUrl){return avatarUrl?'':escapeHtml(initials(username));}
  function applyAvatarEl(el,id,username,avatarUrl){
    if(avatarUrl){el.style.background=`url(${avatarUrl}) center/cover no-repeat`;el.textContent='';}
    else{el.style.background=colorFor(id);el.textContent=initials(username);}
  }
  const contactAvatarMap={};
  function escapeHtml(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  function timeLabel(iso){const d=new Date(iso),t=new Date();if(d.toDateString()===t.toDateString())return d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString('id-ID',{day:'numeric',month:'short'});}
  function tickSvg(del,read){if(read)return `<svg viewBox="0 0 20 15" width="15" height="11" fill="none" stroke="#22d8e6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L11.2 3"/><path d="M6.2 7.6l3.3 3.3L18.5 3"/></svg>`;if(del)return `<svg viewBox="0 0 20 15" width="15" height="11" fill="none" stroke="#7ea0b7" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L11.2 3"/><path d="M6.2 7.6l3.3 3.3L18.5 3"/></svg>`;return `<svg viewBox="0 0 16 15" width="12" height="11" fill="none" stroke="#7ea0b7" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L14 3"/></svg>`;}
  function statusIconHTML(chat){if(!chat.mine)return'';return `<span class="status-icon" style="background:none;">${tickSvg(chat.deliveredAt,chat.readAt)}</span>`;}
  function render(chats){
    const list=document.getElementById('chatlist');if(!chats||chats.length===0){list.innerHTML=`<div class="panel-empty">Belum ada percakapan.</div>`;return;}
    list.innerHTML=chats.map(chat=>`<div class="chat-item" data-uid="${escapeHtml(chat.uid)}" data-uname="${escapeHtml(chat.uname)}"><div class="avatar" style="${avatarStyle(chat.uid,chat.avatarUrl)}">${avatarInner(chat.uname,chat.avatarUrl)}</div><div class="chat-main"><div class="chat-top"><div class="chat-name" style="${chat.unread?'font-weight:700;':''}">${escapeHtml(chat.uname)}</div><div style="font-size:11.5px;color:var(--muted);">${escapeHtml(timeLabel(chat.time))}</div></div><div class="chat-bottom">${statusIconHTML(chat)}<div class="chat-msg" style="${chat.unread?'color:var(--ink);font-weight:600;':''}">${escapeHtml(chat.preview)}</div></div></div></div>`).join('');
    document.querySelectorAll('.chat-item').forEach(i=>i.addEventListener('click',()=>window.location.href=`chat.html?uid=${i.dataset.uid}&uname=${encodeURIComponent(i.dataset.uname)}`));
  }
  function skeletonRow(){return `<div class="skel-item"><div class="skel-avatar"></div><div class="skel-lines"><div class="skel-line w60"></div><div class="skel-line w40"></div></div></div>`;}
  function looksEncrypted(content){try{const o=JSON.parse(content);return !!(o&&(o.e2e===1||o.e2e===2));}catch(e){return false;}}
  async function loadChats(userId){
    const list=document.getElementById('chatlist');list.innerHTML=skeletonRow().repeat(6);
    const {data:contactRows}=await supabaseClient.from('contacts').select('requester_id, addressee_id').eq('status','accepted').or(`requester_id.eq.${userId},addressee_id.eq.${userId}`);
    const acceptedIds=new Set((contactRows||[]).map(r=>r.requester_id===userId?r.addressee_id:r.requester_id));
    if(acceptedIds.size===0){render([]);return;}
    const {data:msgRows}=await supabaseClient.from('messages').select('sender_id, receiver_id, content, created_at, delivered_at, read_at').or(`sender_id.eq.${userId},receiver_id.eq.${userId}`).order('created_at',{ascending:false}).limit(300);

  (function(){
    const panel=document.getElementById('panelStatus');
    const ind=document.getElementById('statusPtr');
    const THRESHOLD=64,MAX=90;
    let startY=0,pulling=false,dragging=false,refreshing=false;
    panel.addEventListener('touchstart',e=>{
      if(refreshing||e.touches.length!==1){pulling=false;return;}
      if(panel.scrollTop>0){pulling=false;return;}
      startY=e.touches[0].clientY;pulling=true;dragging=false;
    },{passive:true});
    panel.addEventListener('touchmove',e=>{
      if(!pulling||refreshing)return;
      const dy=e.touches[0].clientY-startY;
      if(dy<=0||panel.scrollTop>0){pulling=false;dragging=false;ind.style.height='0px';return;}
      dragging=true;e.preventDefault();
      ind.style.height=Math.min(dy*0.5,MAX)+'px';
    },{passive:false});
    panel.addEventListener('touchend',async()=>{
      if(!pulling)return;pulling=false;
      const dist=parseInt(ind.style.height||'0',10);
      if(dragging&&dist>=THRESHOLD){
        refreshing=true;ind.style.height='50px';ind.classList.add('loading');
        await loadStatusTab(false);
        ind.classList.remove('loading');ind.style.height='0px';refreshing=false;
      }else{ind.style.height='0px';}
      dragging=false;
    },{passive:true});
  })();

  window.addEventListener('popstate',(e)=>{
    // Cek isi state history-nya: kalau memang ada tab non-chat yang tersimpan
    // (misalnya balik dari profil.html ke dashboard saat tab Kontak aktif),
    // kembalikan ke tab itu -- bukan selalu paksa ke tab Chat.
    const stateTab=e.state&&e.state.tab;
    if(stateTab){ onNonChatTab=true; switchTab(stateTab,true); }
    else if(onNonChatTab){ onNonChatTab=false; switchTab('chats',true); }
  });

  // ---- Pencarian di appbar: cari kontak/chat/status sesuai tab yang lagi aktif ----
  const searchPlaceholders={chats:'Cari chat...',kontak:'Cari kontak...',status:'Cari status...'};
  function openSearch(){
    if(!searchPlaceholders[activeTab])return;
    document.getElementById('searchInput').placeholder=searchPlaceholders[activeTab];
    document.getElementById('searchBar').classList.add('show');
    document.getElementById('searchInput').value='';
    document.getElementById('searchInput').focus();
    applySearchFilter('');
  }
  function closeSearch(){
    document.getElementById('searchBar').classList.remove('show');
    document.getElementById('searchInput').value='';
    applySearchFilter('');
  }
  function applySearchFilter(qRaw){
    const q=qRaw.trim().toLowerCase();
    let listSel,matchFn;
    if(activeTab==='chats'){
      listSel='#chatlist .chat-item';
      matchFn=(el)=>(el.dataset.uname||'').toLowerCase().includes(q);
    }else if(activeTab==='kontak'){
      listSel='#contactList .contact-item';
      matchFn=(el)=>(el.dataset.uname||'').toLowerCase().includes(q);
    }else if(activeTab==='status'){
      listSel='#statusList .status-card';
      matchFn=(el)=>{
        const uname=(el.querySelector('.sc-uname')?.textContent||'').toLowerCase();
        const content=(el.querySelector('.sc-content')?.textContent||'').toLowerCase();
        return uname.includes(q)||content.includes(q);
      };
    }else return;
    const items=document.querySelectorAll(listSel);
    let visibleCount=0;
    items.forEach(el=>{ const match=!q||matchFn(el); el.style.display=match?'':'none'; if(match)visibleCount++; });
    const listContainer=document.querySelector(activeTab==='chats'?'#chatlist':activeTab==='kontak'?'#contactList':'#statusList');
    let noRes=listContainer?.parentElement.querySelector('.no-results-search');
    if(q && visibleCount===0 && items.length>0){
      if(!noRes){ noRes=document.createElement('div'); noRes.className='no-results no-results-search'; noRes.textContent='Tidak ada hasil untuk "'+qRaw.trim()+'"'; listContainer.after(noRes); }
    }else if(noRes){ noRes.remove(); }
  }
  document.getElementById('searchOpenBtn').addEventListener('click',openSearch);
  document.getElementById('searchCloseBtn').addEventListener('click',closeSearch);
  document.getElementById('searchInput').addEventListener('input',(e)=>applySearchFilter(e.target.value));
  // Klik di mana saja di luar kotak input (termasuk area kosong search bar / luar header)
  // otomatis menutup search bar, tidak wajib klik panah kembali.
  document.addEventListener('click',(e)=>{
    if(!document.getElementById('searchBar').classList.contains('show'))return;
    if(e.target.closest('#searchInput')||e.target.closest('#searchOpenBtn'))return;
    closeSearch();
  },true);

  // ---- Geser (swipe) kiri/kanan untuk pindah tab ----
  (function(){
    const order=['chats','status','kontak','notif'];
    const zone=document.querySelector('.phone');
    let sx=0, sy=0, tracking=false;
    function blocked(){
      return document.getElementById('drawer').classList.contains('open');
    }
    zone.addEventListener('touchstart', e=>{
      if(blocked() || e.touches.length!==1){ tracking=false; return; }
      sx=e.touches[0].clientX; sy=e.touches[0].clientY; tracking=true;
    }, {passive:true});
    zone.addEventListener('touchend', e=>{
      if(!tracking) return; tracking=false;
      const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)<60 || Math.abs(dx) < Math.abs(dy)*1.5) return; // terlalu pendek atau lebih vertikal
      const idx=order.indexOf(activeTab);
      const nextIdx = dx<0 ? idx+1 : idx-1;
      if(nextIdx<0 || nextIdx>=order.length) return;
      switchTab(order[nextIdx]);
    }, {passive:true});
  })();
  document.getElementById('logoutBtn').addEventListener('click',async()=>{await supabaseClient.auth.signOut();window.location.replace('index.html');});
  const drawer=document.getElementById('drawer'),drwOverlay=document.getElementById('drawerOverlay');
  document.getElementById('hamburgerBtn').addEventListener('click',()=>{drawer.classList.add('open');drwOverlay.classList.add('open');});
  drwOverlay.addEventListener('click',()=>{drawer.classList.remove('open');drwOverlay.classList.remove('open');});
  document.getElementById('drawerHeader').addEventListener('click',()=>window.location.href='profil.html');
  document.getElementById('drawerProfil').addEventListener('click',()=>window.location.href='profil.html');
  document.getElementById('drawerSetelan').addEventListener('click',()=>window.location.href='setelan.html');
  document.getElementById('fabNewChat').addEventListener('click',openNewChatSheet);
  let ncwAllContacts=[];
  async function openNewChatSheet(){
    document.getElementById('ncwOverlay').classList.add('open');
    document.getElementById('ncwSearchInput').value='';
    await loadNewChatContacts();
  }
  function closeNewChatSheet(){
    document.getElementById('ncwOverlay').classList.remove('open');
  }
  function renderNewChatList(list){
    const box=document.getElementById('ncwList');
    if(!list||list.length===0){
      box.innerHTML='<div class="ncw-empty">Tidak ada kontak ditemukan.</div>';
      return;
    }
    box.innerHTML=list.map(c=>`<div class="contact-item" data-uid="${escapeHtml(c.id)}" data-uname="${escapeHtml(c.username)}"><div class="avatar" style="${avatarStyle(c.id,c.avatar_url)}">${avatarInner(c.username,c.avatar_url)}</div><div class="uname">${escapeHtml(c.username)}</div></div>`).join('');
    document.querySelectorAll('#ncwList .contact-item').forEach(i=>i.addEventListener('click',()=>{
      window.location.href=`chat.html?uid=${i.dataset.uid}&uname=${encodeURIComponent(i.dataset.uname)}`;
    }));
  }
  async function loadNewChatContacts(){
    const box=document.getElementById('ncwList');box.innerHTML=skeletonRow().repeat(4);
    const {data:{session}}=await supabaseClient.auth.getSession();if(!session)return;
    const {data:rows}=await supabaseClient.from('contacts').select('requester_id, addressee_id').eq('status','accepted').or(`requester_id.eq.${session.user.id},addressee_id.eq.${session.user.id}`);
    if(!rows||rows.length===0){ncwAllContacts=[];box.innerHTML='<div class="ncw-empty">Belum ada kontak. Tambah kontak dulu lewat tab Kontak.</div>';return;}
    const oIds=rows.map(r=>r.requester_id===session.user.id?r.addressee_id:r.requester_id);
    const {data:pData}=await supabaseClient.from('profiles').select('id, username, avatar_url').in('id',oIds);
    ncwAllContacts=(pData||[]).slice().sort((a,b)=>a.username.localeCompare(b.username));
    renderNewChatList(ncwAllContacts);
  }
  document.getElementById('ncwCloseBtn').addEventListener('click',closeNewChatSheet);
  document.getElementById('ncwOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeNewChatSheet();});
  document.getElementById('ncwSearchInput').addEventListener('input',e=>{
    const q=e.target.value.trim().toLowerCase();
    renderNewChatList(!q?ncwAllContacts:ncwAllContacts.filter(c=>c.username.toLowerCase().includes(q)));
  });
  let cprevUid=null,cprevUname=null;
  function openContactPreview(uid,uname){
    cprevUid=uid;cprevUname=uname;
    applyAvatarEl(document.getElementById('cprevBanner'),uid,uname,contactAvatarMap[uid]||null);
    document.getElementById('cprevUname').textContent=uname;
    document.getElementById('cprevOverlay').classList.add('open');
  }
  function closeContactPreview(){document.getElementById('cprevOverlay').classList.remove('open');cprevUid=null;cprevUname=null;}
  document.getElementById('cprevSendBtn').addEventListener('click',()=>{if(cprevUid)window.location.href=`chat.html?uid=${cprevUid}&uname=${encodeURIComponent(cprevUname)}`;});
  document.getElementById('cprevProfilBtn').addEventListener('click',()=>{if(cprevUid)window.location.href=`profil.html?uid=${cprevUid}`;});
  document.getElementById('cprevOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeContactPreview();});
  function openAddModal(){
    document.getElementById('searchMsg').textContent='';
    document.getElementById('foundCard').classList.remove('show');
    document.getElementById('pinInput').value='';
    const sendBtnEl=document.getElementById('sendRequestBtn');sendBtnEl.disabled=true;sendBtnEl.textContent='Kirim Permintaan';
    document.getElementById('addPanelWrap').classList.add('show');
    document.getElementById('pinInput').focus();
  }
  function closeAddModal(){
    document.getElementById('addPanelWrap').classList.remove('show');
  }
  document.getElementById('fabAddContact').addEventListener('click',()=>{
    document.getElementById('addPanelWrap').classList.contains('show') ? closeAddModal() : openAddModal();
  });
  document.getElementById('addBackBtn').addEventListener('click',closeAddModal);
  document.getElementById('addPanelWrap').addEventListener('click',(e)=>{
    if(e.target===e.currentTarget) closeAddModal();
  });
</script>
</body>
</html>
