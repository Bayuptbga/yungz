<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bang Bayu Message - Notifikasi</title>
<style>
  :root{
    --bbm-blue-dark:#0077b6;
    --bbm-blue:#0092d1;
    --bbm-blue-light:#1aa8e6;
    --bg:#ffffff;
    --ink:#1c2b33;
    --muted:#7a8a92;
    --border:#e9edf0;
    --error:#d64545;
    --ok:#1f9d55;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:#fff;
    box-shadow:0 0 40px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .appbar{
    background:var(--bbm-blue);
    color:#fff;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .appbar .back{
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .appbar h1{
    margin:0;
    font-size:19px;
    font-weight:600;
  }

  .section-title{
    padding:14px 16px 6px;
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.4px;
  }

  .empty-state{
    padding:40px 24px;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
  }

  .req-item, .notif-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
  }
  .req-item .avatar, .notif-item .avatar{
    width:48px;height:48px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:16px;flex-shrink:0;
  }
  .req-item .info, .notif-item .info{flex:1;min-width:0;}
  .req-item .uname, .notif-item .uname{font-size:15px;font-weight:600;}
  .req-item .sub, .notif-item .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .req-actions{display:flex;gap:8px;flex-shrink:0;}
  .btn-accept, .btn-decline{
    border:none;
    border-radius:8px;
    padding:8px 12px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-accept{background:var(--ok);color:#fff;}
  .btn-decline{background:#f1f5f7;color:var(--muted);}
  .btn-accept:disabled, .btn-decline:disabled{opacity:0.5;}

  .notif-item.unseen{background:#f2faff;}
  .status-dot{
    width:8px;height:8px;border-radius:50%;
    flex-shrink:0;margin-left:4px;
  }
  .status-dot.new{background:var(--bbm-blue);}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
</head>
<body>
<div class="phone">

  <div class="appbar">
    <div class="back" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <h1>Notifikasi</h1>
  </div>

  <div class="section-title">Permintaan Pertemanan</div>
  <div id="reqList"></div>

  <div class="section-title">Pembaruan</div>
  <div id="updateList"></div>

</div>

<script>
  let currentUserId = null;

  const reqList = document.getElementById('reqList');
  const updateList = document.getElementById('updateList');

  const colorPalette = ['#c77b8c','#3a3f47','#2f6b3a','#5b6b74','#2c2c2c','#7c3f9e','#8a7a4a','#1a7fc2'];
  function colorFor(id){
    let hash = 0;
    for(let i=0;i<id.length;i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
    return colorPalette[Math.abs(hash) % colorPalette.length];
  }
  function initials(username){
    return username.slice(0,2).toUpperCase();
  }

  async function init(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(!session){
      window.location.href = 'login.html';
      return;
    }
    currentUserId = session.user.id;
    loadRequests();
    loadUpdates();
  }

  // ---------- Permintaan pertemanan masuk (butuh jawaban dari kita) ----------
  async function loadRequests(){
    reqList.innerHTML = '<div class="empty-state">Memuat...</div>';

    const { data: rows, error } = await supabaseClient
      .from('contacts')
      .select('id, requester_id')
      .eq('addressee_id', currentUserId)
      .eq('status', 'pending');

    if(error || !rows || rows.length === 0){
      reqList.innerHTML = '<div class="empty-state">Tidak ada permintaan pertemanan baru.</div>';
      return;
    }

    const requesterIds = rows.map(r => r.requester_id);
    const { data: profilesData } = await supabaseClient
      .from('profiles')
      .select('id, username')
      .in('id', requesterIds);

    const profileMap = {};
    (profilesData || []).forEach(p => profileMap[p.id] = p.username);

    reqList.innerHTML = rows.map(r => {
      const uname = profileMap[r.requester_id] || 'Pengguna';
      return `
        <div class="req-item" data-contact-id="${r.id}">
          <div class="avatar" style="background:${colorFor(r.requester_id)}">${initials(uname)}</div>
          <div class="info">
            <div class="uname">@${uname}</div>
            <div class="sub">Ingin menambahkanmu sebagai kontak</div>
          </div>
          <div class="req-actions">
            <button class="btn-accept" data-id="${r.id}">Terima</button>
            <button class="btn-decline" data-id="${r.id}">Tolak</button>
          </div>
        </div>
      `;
    }).join('');

    document.querySelectorAll('.btn-accept').forEach(btn => {
      btn.addEventListener('click', () => respondToRequest(btn.dataset.id, 'accepted', btn));
    });
    document.querySelectorAll('.btn-decline').forEach(btn => {
      btn.addEventListener('click', () => respondToRequest(btn.dataset.id, 'declined', btn));
    });
  }

  async function respondToRequest(contactId, status, btn){
    const item = btn.closest('.req-item');
    item.querySelectorAll('button').forEach(b => b.disabled = true);

    const { error } = await supabaseClient
      .from('contacts')
      .update({ status, seen_by_requester: false })
      .eq('id', contactId);

    if(error){
      alert('Gagal memproses: ' + error.message);
      item.querySelectorAll('button').forEach(b => b.disabled = false);
      return;
    }

    item.style.opacity = '0.4';
    setTimeout(() => {
      item.remove();
      if(!reqList.querySelector('.req-item')){
        reqList.innerHTML = '<div class="empty-state">Tidak ada permintaan pertemanan baru.</div>';
      }
    }, 300);
  }

  // ---------- Notifikasi: permintaan yang kita kirim sudah dijawab ----------
  async function loadUpdates(){
    updateList.innerHTML = '<div class="empty-state">Memuat...</div>';

    const { data: rows, error } = await supabaseClient
      .from('contacts')
      .select('id, addressee_id, status, seen_by_requester')
      .eq('requester_id', currentUserId)
      .in('status', ['accepted', 'declined'])
      .order('id', { ascending: false });

    if(error || !rows || rows.length === 0){
      updateList.innerHTML = '<div class="empty-state">Belum ada pembaruan.</div>';
      return;
    }

    const otherIds = rows.map(r => r.addressee_id);
    const { data: profilesData } = await supabaseClient
      .from('profiles')
      .select('id, username')
      .in('id', otherIds);

    const profileMap = {};
    (profilesData || []).forEach(p => profileMap[p.id] = p.username);

    updateList.innerHTML = rows.map(r => {
      const uname = profileMap[r.addressee_id] || 'Pengguna';
      const isAccepted = r.status === 'accepted';
      const text = isAccepted
        ? `menerima permintaan pertemananmu`
        : `menolak permintaan pertemananmu`;
      return `
        <div class="notif-item ${r.seen_by_requester ? '' : 'unseen'}">
          <div class="avatar" style="background:${colorFor(r.addressee_id)}">${initials(uname)}</div>
          <div class="info">
            <div class="uname">@${uname}</div>
            <div class="sub">${isAccepted ? '✅' : '❌'} ${text}</div>
          </div>
          ${r.seen_by_requester ? '' : '<span class="status-dot new"></span>'}
        </div>
      `;
    }).join('');

    // Tandai semua sudah dilihat
    const unseenIds = rows.filter(r => !r.seen_by_requester).map(r => r.id);
    if(unseenIds.length > 0){
      await supabaseClient
        .from('contacts')
        .update({ seen_by_requester: true })
        .in('id', unseenIds);
    }
  }

  init();
</script>
</body>
</html>
