<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Private Chat - Setelan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2a32">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Private Chat">
<style>
  @view-transition { navigation: auto; }
  :root{
    --bbm-blue-dark:#0b141a;
    --bbm-blue:#1b2a32;
    --bg:#121b22;
    --card-bg:#1b2a32;
    --ink:#e9edf0;
    --muted:#8696a0;
    --border:#2a3942;
    --ok:#2ecc71;
    --error:#f15c6d;
    --accent:#53bdeb;
  }
  *{box-sizing:border-box;}
  html{ overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; justify-content:center; -webkit-font-smoothing:antialiased; position:relative;
  }
  input{user-select:text;}
  .phone{ width:100%; max-width:420px; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative; }
  #authGate{ position:absolute; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center; justify-content:center; }
  #authGate .spinner{ width:32px; height:32px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:authSpin .75s linear infinite; }
  @keyframes authSpin{ to{ transform:rotate(360deg); } }

  .appbar{ background:var(--bbm-blue); color:#fff; padding:calc(14px + env(safe-area-inset-top)) 16px 14px; display:flex; gap:16px; align-items:center; flex-shrink:0; }
  .appbar .back{ cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .appbar .back svg{ width:22px; height:22px; }
  .appbar h1{ margin:0; font-size:19px; font-weight:600; }

  .content{ flex:1; overflow-y:auto; padding:18px 16px 40px; }
  .section-title{ font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; margin:22px 4px 8px; }
  .section-title:first-child{ margin-top:0; }

  .card{ background:var(--card-bg); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .field{ margin-bottom:14px; }
  .field:last-of-type{ margin-bottom:0; }
  .field label{ display:block; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:7px; text-transform:uppercase; letter-spacing:0.5px; }
  .input-wrap{ display:flex; align-items:center; gap:2px; border:1.5px solid var(--border); border-radius:10px; background:var(--bbm-blue-dark); padding:0 12px; }
  .input-wrap:focus-within{ border-color:var(--accent); }
  .input-wrap input{ border:none; outline:none; background:transparent; padding:12px 8px; font-size:14.5px; width:100%; color:var(--ink); }
  .toggle-pw{ font-size:10.5px; color:var(--accent); font-weight:700; cursor:pointer; letter-spacing:0.4px; flex-shrink:0; }
  .hint{ font-size:12px; color:var(--muted); margin-top:9px; min-height:14px; }
  .hint.err{ color:var(--error); }
  .hint.ok{ color:var(--ok); }

  .btn{ margin-top:14px; width:100%; padding:12.5px 0; background:linear-gradient(135deg,var(--accent) 0%,#1f8fc7 100%); color:#062733; border:none; border-radius:10px; font-size:14.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn:active{ transform:scale(0.98); }
  .btn:disabled{ opacity:0.7; cursor:default; }
  .btn .spinner{ width:14px; height:14px; border-radius:50%; border:2px solid rgba(6,39,51,0.3); border-top-color:#062733; animation:spin .7s linear infinite; display:none; }
  .btn.loading .spinner{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .setting-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 0; }
  .setting-row + .setting-row{ margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
  .setting-row .s-label{ font-size:14.5px; font-weight:600; }
  .setting-row .s-sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .setting-row .s-value{ font-size:13px; color:var(--muted); font-family:'Courier New',monospace; }
  .btn-small{ background:rgba(83,189,235,0.14); color:var(--accent); border:1px solid rgba(83,189,235,0.3); border-radius:8px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; }
  .btn-small:active{ transform:scale(0.97); }
  .installed-badge{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ok); font-weight:600; }
  .installed-badge svg{ width:16px; height:16px; }

  .danger-title{ color:var(--error) !important; }
  .danger-note{ font-size:12.5px; color:var(--muted); line-height:1.6; margin-bottom:16px; }
  .danger-note b{ color:var(--error); }
  .btn-danger{ background:linear-gradient(135deg,#f15c6d,#c0392b); color:#fff; }
</style>
<script>
// device-gate (inline, sebelumnya file terpisah)
// Blokir akses dari desktop dan dari Chrome/browser biasa yang belum "install" app.
// CATATAN: ini gating UX, BUKAN kontrol keamanan sejati. User-Agent dan display-mode
// bisa dipalsukan oleh siapa pun yang cukup paham (DevTools device toolbar, dsb).
// Jangan andalkan ini sebagai satu-satunya lapisan proteksi.
//
// ==== SAKLAR ON/OFF ====
// 1) Saklar utama (permanen, berlaku di semua halaman yang load file ini):
//    ganti DEVICE_GATE_ENABLED di bawah ke false untuk mematikan gate sepenuhnya.
// 2) Saklar sementara (buat testing di browser sendiri, tanpa ubah kode/deploy ulang):
//    buka console lalu jalankan salah satu dari:
//      localStorage.setItem('device_gate_disabled', '1')   // matikan gate di browser ini
//      localStorage.removeItem('device_gate_disabled')     // nyalakan lagi
(function () {
  var DEVICE_GATE_ENABLED = false;

  if (!DEVICE_GATE_ENABLED) return;
  try {
    if (localStorage.getItem('device_gate_disabled') === '1') return;
  } catch (e) { /* localStorage diblokir (mis. private mode) -> lanjut gate seperti biasa */ }

  function isMobileUA() {
    return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  }

  function isInstalledApp() {
    // TWA (Android app wrapper dari PWABuilder) selalu kirim referrer ini
    if (document.referrer && document.referrer.startsWith('android-app://')) return true;
    // PWA yang di-"Add to Home Screen" lalu dibuka standalone (Android/desktop Chrome)
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    // iOS: PWA yang di-"Add to Home Screen"
    if (window.navigator.standalone === true) return true;
    return false;
  }

  if (!isMobileUA() || !isInstalledApp()) {
    location.replace('akses-ditolak');
  }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=1"></script>
</head>
<body>
<div class="phone">
  <div id="authGate"><div class="spinner"></div></div>
  <div class="appbar">
    <div class="back" onclick="location.href='dashboard.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <h1>Setelan</h1>
  </div>
  <div class="content">
    <div class="section-title">About</div>
    <div class="card">
      <div class="setting-row" id="installRow" style="display:none;">
        <div><div class="s-label">Instal Aplikasi</div><div class="s-sub">Buka lebih cepat langsung dari layar utama</div></div>
        <button class="btn-small" id="installBtn" type="button">Instal</button>
      </div>
      <div class="setting-row" id="installedRow" style="display:none;">
        <div class="installed-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span>Aplikasi sudah terpasang</span></div>
      </div>
      <div class="setting-row" id="versionRow">
        <div class="s-label">Versi</div>
        <div class="s-value" id="versionValue">1.0.0</div>
      </div>
    </div>

    <div class="section-title danger-title">Zona Berbahaya</div>
    <div class="card">
      <div class="danger-note">Menghapus akun akan menghapus <b>semua chat, kontak, status, dan data lainnya secara permanen</b>. Tindakan ini tidak bisa dibatalkan.</div>
      <form id="deleteForm">
        <div class="field">
          <label>Konfirmasi Kata Sandi</label>
          <div class="input-wrap"><input type="password" id="deletePassword" required autocomplete="current-password"><span class="toggle-pw" onclick="const p=document.getElementById('deletePassword');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'LIHAT':'SEMBUNYIKAN';">LIHAT</span></div>
        </div>
        <div class="hint" id="deleteHint">Masukkan kata sandi untuk melanjutkan</div>
        <button type="submit" class="btn btn-danger" id="deleteSubmitBtn"><span class="spinner"></span><span class="btn-label">Hapus Akun Saya</span></button>
      </form>
    </div>
  </div>
</div>
<script>
  const colorPalette=['#c77b8c','#3a3f47','#2f6b3a','#5b6b74','#2c2c2c','#7c3f9e','#8a7a4a','#1a7fc2'];
  function colorFor(id){let hash=0;for(let i=0;i<id.length;i++)hash=id.charCodeAt(i)+((hash<<5)-hash);return colorPalette[Math.abs(hash)%colorPalette.length];}
  function initials(u){return(u||'?').slice(0,2).toUpperCase();}

  let currentUsername=null;
  let currentUserId=null;

  async function boot(){
    const {data:{session}} = await supabaseClient.auth.getSession();
    if(!session){ window.location.replace('index.html'); return; }
    currentUserId = session.user.id;
    const {data:prof} = await supabaseClient.from('profiles').select('username').eq('id', session.user.id).maybeSingle();
    if(prof){ currentUsername = prof.username; }
    document.getElementById('authGate').style.display = 'none';
  }
  boot();

  // ---- Instal Aplikasi (PWA) ----
  let deferredPrompt = null;
  const installRow = document.getElementById('installRow'), installedRow = document.getElementById('installedRow');
  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  if(isStandalone()){ installedRow.style.display='flex'; }
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if(!isStandalone()){ installRow.style.display='flex'; }
  });
  document.getElementById('installBtn').addEventListener('click', async () => {
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    const {outcome} = await deferredPrompt.userChoice;
    if(outcome === 'accepted'){ installRow.style.display='none'; installedRow.style.display='flex'; }
    deferredPrompt = null;
  });
  window.addEventListener('appinstalled', () => {
    installRow.style.display='none'; installedRow.style.display='flex';
  });

  // ---- Hapus Akun ----
  // Alur: re-auth pakai kata sandi (memastikan yang minta hapus benar pemilik akun,
  // bukan sesi yang ke-tinggal login di device orang lain) -> konfirmasi eksplisit
  // (irreversible) -> panggil RPC delete_own_account() yang jalan di server dengan
  // hak akses lebih tinggi (SECURITY DEFINER) untuk hapus semua data + akun auth-nya.
  // Anon key di browser TIDAK PERNAH bisa hapus baris auth.users langsung -- itu
  // sengaja dibatasi Supabase, makanya harus lewat fungsi database ini.
  document.getElementById('deleteForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw=document.getElementById('deletePassword').value,
          b=document.getElementById('deleteSubmitBtn'), hint=document.getElementById('deleteHint');
    if(!pw){ hint.textContent='Masukkan kata sandi.'; hint.className='hint err'; return; }
    if(!currentUsername){ hint.textContent='Gagal memuat data akun, coba muat ulang halaman.'; hint.className='hint err'; return; }
    b.disabled=true; b.classList.add('loading'); b.querySelector('.btn-label').textContent='Memeriksa...';
    const {error:reauthErr} = await supabaseClient.auth.signInWithPassword({email: usernameToEmail(currentUsername), password: pw});
    if(reauthErr){
      hint.textContent='Kata sandi salah.'; hint.className='hint err';
      b.disabled=false; b.classList.remove('loading'); b.querySelector('.btn-label').textContent='Hapus Akun Saya';
      return;
    }
    const confirmed=confirm('Yakin ingin menghapus akun secara permanen?\n\nSemua chat, kontak, dan status akan hilang dan TIDAK BISA dikembalikan.');
    if(!confirmed){
      b.disabled=false; b.classList.remove('loading'); b.querySelector('.btn-label').textContent='Hapus Akun Saya';
      return;
    }
    b.querySelector('.btn-label').textContent='Menghapus...';
    const {error:delErr} = await supabaseClient.rpc('delete_own_account');
    if(delErr){
      hint.textContent='Gagal menghapus akun: '+delErr.message; hint.className='hint err';
      b.disabled=false; b.classList.remove('loading'); b.querySelector('.btn-label').textContent='Hapus Akun Saya';
      return;
    }
    await supabaseClient.auth.signOut();
    window.location.replace('index.html');
  });
</script>
</body>
</html>
