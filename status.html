<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bang Bayu Message - Status</title>
<style>
  :root{
    --bbm-blue:#0092d1;
    --ink:#1c2b33;
    --muted:#7a8a92;
    --border:#e9edf0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#fff;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:#fff;
    box-shadow:0 0 40px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .appbar{
    background:var(--bbm-blue);
    color:#fff;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .appbar .back{cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .appbar h1{margin:0;font-size:19px;font-weight:600;}

  .empty-state{
    padding:60px 24px;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
    line-height:1.6;
  }
  .empty-state .icon{
    margin-bottom:14px;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
</head>
<body>
<div class="phone">

  <div class="appbar">
    <div class="back" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <h1>Status</h1>
  </div>

  <div class="empty-state">
    <div class="icon">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#c7d1d6" stroke-width="1.6" style="margin:0 auto;display:block;"><circle cx="12" cy="12" r="9"/><path d="M12 8v5l3 2"/></svg>
    </div>
    Belum ada status untuk ditampilkan.<br>Fitur ini akan segera hadir.
  </div>

</div>

<script>
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(!session){
      window.location.href = 'login.html';
    }
  })();
</script>
</body>
</html>
