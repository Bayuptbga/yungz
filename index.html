<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bang Bayu Message - Chats</title>
<style>
  :root{
    --bbm-blue-dark:#0077b6;
    --bbm-blue:#0092d1;
    --bbm-blue-light:#1aa8e6;
    --bg:#ffffff;
    --ink:#1c2b33;
    --muted:#7a8a92;
    --border:#e9edf0;
    --tab-active:#0092d1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:#fff;
    box-shadow:0 0 40px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  /* top app bar */
  .appbar{
    background:var(--bbm-blue);
    color:#fff;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .appbar .left{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .appbar .hamburger{
    display:flex;
    flex-direction:column;
    gap:4px;
    cursor:pointer;
  }
  .appbar .hamburger span{
    width:22px;
    height:2.5px;
    background:#fff;
    border-radius:2px;
  }
  .appbar h1{
    margin:0;
    font-size:22px;
    font-weight:500;
  }
  .appbar .right{
    display:flex;
    align-items:center;
    gap:20px;
  }
  .appbar .icon-btn{
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* tabs */
  .tabbar{
    display:flex;
    background:#f7f9fa;
    border-bottom:1px solid var(--border);
  }
  .tabbar .tabitem{
    flex:1;
    padding:14px 0 11px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor:pointer;
  }
  .tabbar .tabitem.active{
    border-bottom:3px solid var(--tab-active);
  }
  .tabbar .tabitem svg{
    width:22px;
    height:22px;
  }
  .tabbar .tabitem .badge{
    position:absolute;
    top:8px;
    right:calc(50% - 16px);
    width:9px;
    height:9px;
    border-radius:50%;
    background:#e0433d;
    border:1.5px solid #f7f9fa;
  }

  /* chat list */
  .chatlist{
    flex:1;
    overflow-y:auto;
  }
  .chat-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .chat-item:active{
    background:#f5f8fa;
  }
  .avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:17px;
    color:#fff;
    background-size:cover;
    background-position:center;
  }
  .chat-main{
    flex:1;
    min-width:0;
  }
  .chat-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
  }
  .chat-name{
    font-size:16.5px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .chat-name .prefix-mark{
    font-weight:700;
    color:var(--ink);
  }
  .chat-bottom{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:3px;
  }
  .status-icon{
    width:16px;
    height:16px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:700;
    color:#fff;
  }
  .status-icon.delivered{background:#1a7fc2;}
  .status-icon.read{background:#3aa15a;}
  .status-icon.sent{background:#b8c2c7;}
  .status-icon.broadcast{background:none;}
  .status-icon.broadcast svg{width:16px;height:16px;}
  .chat-msg{
    font-size:13.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* fab */
  .fab{
    position:absolute;
    right:18px;
    bottom:24px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--bbm-blue);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    cursor:pointer;
  }
  .fab svg{width:24px;height:24px;}

  .appbar .username{
    font-size:12px;
    opacity:0.9;
    font-weight:400;
    margin-top:1px;
  }
  .logout-btn{
    cursor:pointer;
  }
  .tabbar .tabitem .badge{
    position:absolute;
    top:8px;
    right:calc(50% - 16px);
    min-width:16px;
    height:16px;
    border-radius:8px;
    background:#e0433d;
    border:1.5px solid #f7f9fa;
    color:#fff;
    font-size:10px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 3px;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
</head>
<body>
<div class="phone">

  <div class="appbar">
    <div class="left">
      <div class="hamburger">
        <span></span><span></span><span></span>
      </div>
      <div>
        <h1>BBM Chats</h1>
        <div class="username" id="currentUsername"></div>
      </div>
    </div>
    <div class="right">
      <div class="icon-btn logout-btn" id="logoutBtn" title="Keluar">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/></svg>
      </div>
      <div class="icon-btn" title="Menu lainnya">
        <svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tabitem active">
      <svg viewBox="0 0 24 24" fill="#0092d1"><path d="M4 4h16a2 2 0 012 2v9a2 2 0 01-2 2H9l-5 4v-4H4a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>
    </div>
    <div class="tabitem" id="tabStatus">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7a8a92" stroke-width="2"><path d="M4 4v5h5M20 20v-5h-5"/><path d="M4.5 9a8 8 0 0114-4.5M19.5 15a8 8 0 01-14 4.5"/></svg>
    </div>
    <div class="tabitem" id="tabKontak">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7a8a92" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>
    </div>
    <div class="tabitem" id="tabNotif">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7a8a92" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      <span class="badge" id="notifBadge" style="display:none;"></span>
    </div>
  </div>

  <div class="chatlist" id="chatlist"></div>

  <div class="fab" title="Chat baru">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H8l-4 4V6a2 2 0 012-2h13a2 2 0 012 2z"/><path d="M12 8v5M9.5 10.5h5"/></svg>
  </div>

</div>

<script>
  const colorPalette = ['#c77b8c','#3a3f47','#2f6b3a','#5b6b74','#2c2c2c','#7c3f9e','#8a7a4a','#1a7fc2'];
  function colorFor(id){
    let hash = 0;
    for(let i=0;i<id.length;i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
    return colorPalette[Math.abs(hash) % colorPalette.length];
  }
  function initials(username){
    return (username || '?').slice(0,2).toUpperCase();
  }
  function timeLabel(iso){
    const d = new Date(iso);
    const today = new Date();
    if(d.toDateString() === today.toDateString()){
      return d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
    }
    return d.toLocaleDateString('id-ID', { day:'numeric', month:'short' });
  }

  // Ikon centang gaya BBM/WhatsApp:
  // 1 centang abu = terkirim, 2 centang abu = diterima, 2 centang biru = dibaca
  function tickSvg(deliveredAt, readAt){
    if(readAt){
      return `<svg viewBox="0 0 20 15" width="15" height="11" fill="none" stroke="#2b8fe0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L11.2 3"/><path d="M6.2 7.6l3.3 3.3L18.5 3"/></svg>`;
    }
    if(deliveredAt){
      return `<svg viewBox="0 0 20 15" width="15" height="11" fill="none" stroke="#93a1a8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L11.2 3"/><path d="M6.2 7.6l3.3 3.3L18.5 3"/></svg>`;
    }
    return `<svg viewBox="0 0 16 15" width="12" height="11" fill="none" stroke="#93a1a8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L14 3"/></svg>`;
  }

  function statusIconHTML(chat){
    if(!chat.mine) return '';
    return `<span class="status-icon" style="background:none;">${tickSvg(chat.deliveredAt, chat.readAt)}</span>`;
  }

  function render(chats){
    const list = document.getElementById('chatlist');
    if(!chats || chats.length === 0){
      list.innerHTML = `
        <div style="padding:40px 24px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;">
          Belum ada percakapan.<br>Buka tab Kontak lalu ketuk salah satu kontak untuk mulai chat.
        </div>`;
      return;
    }
    list.innerHTML = chats.map(chat => `
      <div class="chat-item" data-uid="${chat.uid}" data-uname="${chat.uname}">
        <div class="avatar" style="background:${colorFor(chat.uid)}">${initials(chat.uname)}</div>
        <div class="chat-main">
          <div class="chat-top">
            <div class="chat-name" style="${chat.unread ? 'font-weight:700;' : ''}">@${chat.uname}</div>
            <div style="font-size:11.5px;color:var(--muted);flex-shrink:0;">${timeLabel(chat.time)}</div>
          </div>
          <div class="chat-bottom">
            ${statusIconHTML(chat)}
            <div class="chat-msg" style="${chat.unread ? 'color:var(--ink);font-weight:600;' : ''}">${chat.preview}</div>
          </div>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.chat-item').forEach(item => {
      item.addEventListener('click', () => {
        window.location.href = `chat.html?uid=${item.dataset.uid}&uname=${encodeURIComponent(item.dataset.uname)}`;
      });
    });
  }

  async function loadChats(userId){
    const list = document.getElementById('chatlist');
    list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);font-size:13.5px;">Memuat...</div>';

    // Kontak yang sudah berteman (accepted)
    const { data: contactRows } = await supabaseClient
      .from('contacts')
      .select('requester_id, addressee_id')
      .eq('status', 'accepted')
      .or(`requester_id.eq.${userId},addressee_id.eq.${userId}`);

    const acceptedIds = new Set(
      (contactRows || []).map(r => r.requester_id === userId ? r.addressee_id : r.requester_id)
    );

    if(acceptedIds.size === 0){
      render([]);
      return;
    }

    // Ambil pesan terbaru yang melibatkan kita, lalu ambil satu pesan
    // terakhir per lawan bicara (pesan sudah terurut dari yang terbaru).
    const { data: msgRows } = await supabaseClient
      .from('messages')
      .select('sender_id, receiver_id, content, created_at, delivered_at, read_at')
      .or(`sender_id.eq.${userId},receiver_id.eq.${userId}`)
      .order('created_at', { ascending: false })
      .limit(300);

    const lastByPartner = new Map();
    (msgRows || []).forEach(m => {
      const partner = m.sender_id === userId ? m.receiver_id : m.sender_id;
      if(!acceptedIds.has(partner)) return;
      if(!lastByPartner.has(partner)) lastByPartner.set(partner, m);
    });

    if(lastByPartner.size === 0){
      render([]);
      return;
    }

    const partnerIds = [...lastByPartner.keys()];
    const { data: profilesData } = await supabaseClient
      .from('profiles')
      .select('id, username')
      .in('id', partnerIds);

    const profileMap = {};
    (profilesData || []).forEach(p => profileMap[p.id] = p.username);

    const chats = partnerIds.map(pid => {
      const m = lastByPartner.get(pid);
      const mine = m.sender_id === userId;
      return {
        uid: pid,
        uname: profileMap[pid] || 'Pengguna',
        preview: (mine ? 'Kamu: ' : '') + m.content,
        time: m.created_at,
        mine,
        deliveredAt: m.delivered_at,
        readAt: m.read_at,
        unread: !mine && !m.read_at
      };
    });

    render(chats);
  }

  // Tandai semua pesan masuk sebagai "diterima" begitu aplikasi dibuka
  // (menandakan pesan sudah sampai di perangkat penerima).
  async function markInboxDelivered(userId){
    await supabaseClient
      .from('messages')
      .update({ delivered_at: new Date().toISOString() })
      .eq('receiver_id', userId)
      .is('delivered_at', null);
  }

  // Proteksi halaman: kalau belum login, lempar ke login.html
  async function refreshNotifBadge(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(!session){
      window.location.href = 'login.html';
      return;
    }

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('username')
      .eq('id', session.user.id)
      .maybeSingle();

    if(profile){
      document.getElementById('currentUsername').textContent = '@' + profile.username;
    }

    // Hitung notifikasi: permintaan pertemanan masuk yang belum dijawab
    // + notifikasi diterima/ditolak yang belum dilihat, tampilkan di badge
    const { count: pendingCount } = await supabaseClient
      .from('contacts')
      .select('id', { count: 'exact', head: true })
      .eq('addressee_id', session.user.id)
      .eq('status', 'pending');

    const { count: unseenCount } = await supabaseClient
      .from('contacts')
      .select('id', { count: 'exact', head: true })
      .eq('requester_id', session.user.id)
      .in('status', ['accepted', 'declined'])
      .eq('seen_by_requester', false);

    const totalNotif = (pendingCount || 0) + (unseenCount || 0);
    const badge = document.getElementById('notifBadge');
    if(totalNotif > 0){
      badge.textContent = totalNotif;
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }

    loadChats(session.user.id);
    markInboxDelivered(session.user.id);
  }

  refreshNotifBadge();

  // Halaman yang dipulihkan dari cache browser (mis. tombol back dari
  // notifikasi.html) tidak menjalankan ulang script di atas secara otomatis,
  // jadi kita paksa cek ulang badge tiap kali halaman ini kembali ditampilkan.
  window.addEventListener('pageshow', (e) => {
    if(e.persisted){
      refreshNotifBadge();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible'){
      refreshNotifBadge();
    }
  });

  document.getElementById('tabStatus').addEventListener('click', () => {
    window.location.href = 'status.html';
  });
  document.getElementById('tabKontak').addEventListener('click', () => {
    window.location.href = 'kontak.html';
  });
  document.getElementById('tabNotif').addEventListener('click', () => {
    window.location.href = 'notifikasi.html';
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
