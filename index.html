<!DOCTYPE html>
<html lang="id">
<head>
<script src="device-gate.js"></script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Baku Chat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123350">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baku Chat">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  @view-transition { navigation: auto; }
  :root{
    --bg-void:#060f18;
    --bbm-blue-dark:#0a1e2f;
    --bbm-blue:#123350;
    --bbm-blue-light:#184068;
    --bg:#0a1c2c;
    --card-bg:#123350;
    --ink:#eef6fb;
    --muted:#7ea0b7;
    --border:#1d425e;
    --ok:#33d17a;
    --error:#ff7080;
    --accent:#22d8e6;
    --accent-deep:#0e93a8;
    --accent-soft:rgba(34,216,230,0.14);
    --accent-glow:rgba(34,216,230,0.4);
  }
  *{box-sizing:border-box;}
  html{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;height:100%;overflow:hidden;}
  body{
    margin:0;font-family:'Inter','Segoe UI',Roboto,sans-serif;background:var(--bg-void);color:var(--ink);
    height:100%;display:flex;align-items:flex-start;justify-content:center;-webkit-font-smoothing:antialiased;
    position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:none;
  }
  input{user-select:text;}

  /* ---- signature: slow-drifting aurora field behind the phone ---- */
  .aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .aurora .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:0.55;will-change:transform;}
  .aurora .b1{width:480px;height:480px;left:-160px;top:-140px;background:radial-gradient(circle,rgba(34,216,230,0.55),rgba(34,216,230,0) 70%);animation:driftA 22s ease-in-out infinite;}
  .aurora .b2{width:420px;height:420px;right:-140px;bottom:-120px;background:radial-gradient(circle,rgba(31,54,64,0.9),rgba(31,54,64,0) 70%);animation:driftB 26s ease-in-out infinite;}
  .aurora .b3{width:320px;height:320px;right:10%;top:8%;background:radial-gradient(circle,rgba(46,155,209,0.35),rgba(46,155,209,0) 70%);animation:driftC 19s ease-in-out infinite;}
  @keyframes driftA{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,60px) scale(1.08);}}
  @keyframes driftB{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,-50px) scale(1.1);}}
  @keyframes driftC{0%,100%{transform:translate(0,0);}50%{transform:translate(-25px,30px);}}
  @media (prefers-reduced-motion:reduce){ .aurora .blob{animation:none;} }

  .phone{
    width:100%;max-width:420px;height:100%;background:var(--bg);display:flex;flex-direction:column;
    position:relative;overflow:hidden;z-index:1;box-shadow:0 0 80px rgba(0,0,0,0.55);
  }
  /* Layar tablet (>=700px) -> kontainer lebih lega, tetap satu kolom */
  @media (min-width:700px){ .phone{ max-width:640px; } }
  #authGate{ position:absolute; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center; justify-content:center; }
  #authGate .spinner{ width:32px; height:32px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:authSpin .75s linear infinite; }
  @keyframes authSpin{ to{ transform:rotate(360deg); } }
  .phone::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
    background-size:22px 22px;
  }
  .topbar{
    position:relative;padding:calc(52px + env(safe-area-inset-top)) 24px 34px;text-align:center;overflow:hidden;background:var(--bg);
  }
  .topbar::before{
    content:'';position:absolute;top:-90px;left:50%;transform:translateX(-50%);
    width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle, rgba(34,216,230,0.22) 0%, rgba(34,216,230,0) 68%);
    pointer-events:none;
  }
  .logo-mark{
    position:relative;width:128px;height:128px;margin:0 auto 20px;
    display:flex;align-items:center;justify-content:center;
    animation:heroSettle .6s cubic-bezier(.16,1,.3,1) both;
  }
  .logo-mark img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 30px rgba(0,0,0,0.55));position:relative;z-index:2;}
  .logo-mark::before,.logo-mark::after{
    content:'';position:absolute;border-radius:50%;pointer-events:none;
  }
  .logo-mark::before{inset:-13px;border:1px solid rgba(34,216,230,0.3);animation:ringPulse 3.2s ease-in-out infinite;}
  .logo-mark::after{inset:-30px;border:1px solid rgba(34,216,230,0.14);}
  @keyframes heroSettle{
    from{transform:translateY(12px) scale(.9);opacity:0;}
    to{transform:translateY(0) scale(1);opacity:1;}
  }
  @keyframes ringPulse{
    0%,100%{transform:scale(1);opacity:.55;}
    50%{transform:scale(1.055);opacity:1;}
  }
  @media (prefers-reduced-motion:reduce){ .logo-mark,.logo-mark::before{animation:none;} }
  .topbar h1{margin:0 0 5px;font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;letter-spacing:-0.4px;}
  .topbar p{margin:0 0 16px;font-size:12.5px;color:var(--muted);}
  .badge-row{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:10.5px;color:var(--accent);font-weight:700;letter-spacing:0.5px;font-family:'Space Mono',monospace;text-transform:uppercase;background:var(--accent-soft);padding:6px 12px;border-radius:999px;border:1px solid rgba(34,216,230,0.25);}
  .badge-row svg{width:12px;height:12px;flex-shrink:0;}

  .body{position:relative;flex:1;padding:26px 24px 40px;display:flex;flex-direction:column;}
  .tabs{position:relative;display:flex;background:var(--card-bg);border-radius:12px;padding:4px;margin-bottom:26px;border:1px solid var(--border);}
  .tab{flex:1;position:relative;z-index:1;text-align:center;padding:10px 0;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:9px;cursor:pointer;transition:color .2s ease;}
  .tab.active{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#062733;box-shadow:0 4px 14px -4px rgba(34,216,230,0.5);}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:0.6px;font-family:'Space Mono',monospace;}
  .input-wrap{display:flex;align-items:center;gap:2px;border:1.5px solid var(--border);border-radius:11px;background:var(--bbm-blue-dark);padding:0 12px;transition:border-color .15s ease, box-shadow .15s ease;}
  .input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .input-wrap svg{width:16px;height:16px;color:var(--muted);flex-shrink:0;stroke:var(--muted);}
  .input-wrap input{border:none;outline:none;background:transparent;padding:13px 8px;font-size:15px;width:100%;color:var(--ink);font-family:'Inter',sans-serif;}
  .input-wrap .prefix{color:var(--accent);font-weight:700;font-family:'Space Mono',monospace;}
  .toggle-pw{display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;flex-shrink:0;padding:6px;margin:0 -6px;}
  .toggle-pw svg{width:18px;height:18px;stroke:currentColor;}
  .toggle-pw .eye-off{display:none;}
  .toggle-pw.is-visible{color:var(--accent);}
  .toggle-pw.is-visible .eye-on{display:none;}
  .toggle-pw.is-visible .eye-off{display:block;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:6px;min-height:14px;transition:color .15s ease;} .hint.err{color:var(--error);} .hint.ok{color:var(--ok);}

  .btn{
    margin-top:6px;width:100%;padding:14px 0;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-deep) 100%);
    color:#062733;border:none;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 8px 20px -8px rgba(34,216,230,0.6);transition:transform .12s ease, box-shadow .12s ease;
    font-family:'Inter',sans-serif;position:relative;display:flex;align-items:center;justify-content:center;gap:9px;
  }
  .btn:active{transform:scale(0.98);}
  .btn:disabled{cursor:default;opacity:0.85;}
  .btn .spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(6,39,51,0.3);border-top-color:#062733;animation:spin .7s linear infinite;display:none;}
  .btn.loading .spinner{display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .btn-alt{width:100%;padding:13px 0;background:transparent;color:var(--ink);border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;transition:border-color .15s ease, background .15s ease;}
  .btn-alt:active{background:var(--card-bg);}
  .btn-alt svg{width:16px;height:16px;stroke:var(--muted);}
  .divider{display:flex;align-items:center;margin:22px 0;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:0.8px;font-family:'Space Mono',monospace;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .divider span{padding:0 10px;}
  .foot-note{text-align:center;font-size:12.5px;color:var(--muted);margin-top:22px;}
  .foot-note a{color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer;}

  .banner-err{
    display:flex;align-items:flex-start;gap:9px;background:#331419;border:1px solid var(--error);color:var(--error);
    font-size:13px;padding:11px 12px;border-radius:10px;margin-bottom:16px;
    max-height:0;opacity:0;overflow:hidden;padding-top:0;padding-bottom:0;margin-bottom:0;
    transition:max-height .22s ease, opacity .18s ease, padding .22s ease, margin .22s ease;
  }
  .banner-err svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;}
  .banner-err.show{max-height:80px;opacity:1;padding:11px 12px;margin-bottom:16px;}

  /* ---- vault-style PIN reveal (dari daftar.html) ---- */
  .pin-screen{display:none;flex-direction:column;align-items:center;text-align:center;padding-top:14px;}
  .pin-screen.show{display:flex;animation:riseIn .35s ease both;}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .pin-screen .check-mark{
    width:58px;height:58px;border-radius:50%;background:radial-gradient(circle,rgba(51,209,122,0.22),rgba(51,209,122,0.02));
    display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 0 0 1px rgba(51,209,122,0.3);
    animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes popIn{from{transform:scale(0.5);opacity:0;}to{transform:scale(1);opacity:1;}}
  .pin-screen .check-mark svg{width:26px;height:26px;stroke:var(--ok);}
  .pin-screen h2{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 4px;}
  .pin-screen p{color:var(--muted);font-size:13px;margin:0 0 22px;max-width:280px;line-height:1.5;}
  .vault{
    position:relative;width:100%;background:linear-gradient(160deg,var(--card-bg),var(--bbm-blue-dark));
    border:1px solid rgba(34,216,230,0.28);border-radius:16px;padding:22px 20px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,0.2), 0 18px 40px -18px rgba(34,216,230,0.35);
  }
  .vault::before{
    content:'';position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(34,216,230,0.14) 50%,transparent 60%);
    animation:shimmer 3.2s ease-in-out infinite;
  }
  @keyframes shimmer{0%{transform:translateX(-20%);}100%{transform:translateX(20%);}}
  @media (prefers-reduced-motion:reduce){ .vault::before{animation:none;} }
  .vault-label{position:relative;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-family:'Space Mono',monospace;margin-bottom:10px;}
  .pin{position:relative;font-family:'Space Mono',monospace;font-size:30px;color:var(--ink);font-weight:700;letter-spacing:6px;}
  .pin-copy{
    position:relative;margin-top:16px;width:100%;padding:11px 0;background:rgba(34,216,230,0.12);color:var(--accent);
    border:1px solid rgba(34,216,230,0.35);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;
    font-family:'Inter',sans-serif;transition:background .15s ease, transform .12s ease;display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .pin-copy:active{transform:scale(0.98);}
  .pin-copy svg{width:14px;height:14px;}
  .pin-note{display:flex;align-items:center;gap:6px;justify-content:center;font-size:11px;color:var(--muted);margin-top:16px;}
  .pin-note svg{width:12px;height:12px;flex-shrink:0;}
  .pin-screen .btn{margin-top:22px;}

  /* ---- panel switching ---- */
  .panel{display:none;}
  .panel.active{display:flex;flex-direction:column;}

  /* ---- setel PIN Enkripsi (dalam pin-screen) ---- */
  .pw-setup{width:100%;margin-top:24px;padding-top:20px;border-top:1px solid var(--border);text-align:left;}
  .pw-setup .pws-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:3px;}
  .pw-setup .pws-sub{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:14px;}
  .pw-setup .field{margin-bottom:12px;}
  .pw-setup .skip-link{display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:10px;cursor:pointer;text-decoration:underline;}

  /* ---- modal overlay (restore key / setup key untuk akun lama) ---- */
  .kmodal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; z-index:300; opacity:0; pointer-events:none; transition:opacity .2s ease; padding:24px; }
  .kmodal-overlay.open{ opacity:1; pointer-events:auto; }
  .kmodal{ background:var(--card-bg); border:1px solid var(--border); border-radius:16px; width:100%; max-width:340px; padding:24px 20px 20px; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
  .kmodal .km-icon{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .kmodal .km-icon svg{width:22px;height:22px;stroke:var(--accent);}
  .kmodal h3{font-size:16px;margin:0 0 6px;font-family:'Space Grotesk',sans-serif;}
  .kmodal p{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 16px;}
  .kmodal .skip-link{display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:14px;cursor:pointer;text-decoration:underline;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=1"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js');});}</script>
</head>
<body>
<div class="aurora" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
<div class="phone">
  <div id="authGate"><div class="spinner"></div></div>
  <div class="topbar">
    <div class="logo-mark"><img src="icons/icon-512.png" alt="Baku Chat"></div>
    <h1>Baku Chat</h1>
    <p id="topSub">Masuk untuk lanjut ngobrol</p>
    <div class="badge-row" id="topBadge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg><span>Encrypted end-to-end</span></div>
  </div>

  <!-- Panel Masuk -->
  <div class="body panel active" id="panelLogin">
    <div class="tabs"><div class="tab" id="tabDaftar" onclick="switchPanel('daftar')">Daftar</div><div class="tab active" id="tabLogin" onclick="switchPanel('login')">Masuk</div></div>
    <div class="banner-err" id="loginError"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span id="loginErrorText"></span></div>
    <form id="loginForm">
      <div class="field"><label>Username</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg><input type="text" id="loginUsername" required autocomplete="username"></div></div>
      <div class="field"><label>Kata Sandi</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg><input type="password" id="loginPassword" required autocomplete="current-password"><span class="toggle-pw" onclick="const p=document.getElementById('loginPassword');p.type=p.type==='password'?'text':'password';this.classList.toggle('is-visible', p.type==='text');"><svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a19.9 19.9 0 015.06-5.94M9.9 4.24A10.9 10.9 0 0112 4c7 0 11 7 11 7a19.9 19.9 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></span></div></div>
      <button type="submit" class="btn" id="loginSubmitBtn"><span class="spinner"></span><span class="btn-label">Masuk</span></button>
    </form>
    <div class="foot-note">Belum punya akun? <a onclick="switchPanel('daftar')">Daftar sekarang</a></div>
  </div>

  <!-- Panel Daftar -->
  <div class="body panel" id="panelDaftar">
    <div class="tabs"><div class="tab active" id="tabDaftar2" onclick="switchPanel('daftar')">Daftar</div><div class="tab" id="tabLogin2" onclick="switchPanel('login')">Masuk</div></div>
    <form id="daftarForm">
      <div class="field"><label>Username</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg><input type="text" id="daftarUsername" required autocomplete="username"></div><div class="hint" id="uHint"></div></div>
      <div class="field"><label>Kata Sandi</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg><input type="password" id="daftarPassword" required minlength="6" autocomplete="new-password"><span class="toggle-pw" onclick="const p=document.getElementById('daftarPassword');p.type=p.type==='password'?'text':'password';this.classList.toggle('is-visible', p.type==='text');"><svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a19.9 19.9 0 015.06-5.94M9.9 4.24A10.9 10.9 0 0112 4c7 0 11 7 11 7a19.9 19.9 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></span></div><div class="hint" id="pHint">Minimal 6 karakter</div></div>
      <button type="submit" class="btn" id="daftarSubmitBtn"><span class="spinner"></span><span class="btn-label">Daftar</span></button>
    </form>
  </div>

  <!-- Panel hasil PIN setelah daftar -->
  <div class="body pin-screen" id="pinScreen">
    <div class="check-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h2>Akun berhasil dibuat</h2>
    <p>Simpan PIN ini baik-baik dan bagikan hanya ke teman yang kamu percaya.</p>
    <div class="vault">
      <div class="vault-label">PIN Pribadimu</div>
      <div class="pin" id="pinValue"></div>
      <button class="pin-copy" id="pinCopyBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg><span id="pinCopyLabel">Salin PIN</span></button>
    </div>
    <div class="pin-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg><span>PIN ini kunci orang lain menemukanmu</span></div>

    <button class="btn" id="pinContinueBtn" type="button" style="margin-top:22px;">Lanjut ke Chat</button>
  </div>
</div>

<script>
  function translateAuthError(msg){
    const m = (msg||'').toLowerCase();
    if(m.includes('at least 6')) return 'Kata sandi minimal 6 karakter.';
    if(m.includes('already registered') || m.includes('already exists') || m.includes('already been registered')) return 'Username sudah dipakai, coba yang lain.';
    if(m.includes('invalid') && m.includes('email')) return 'Username mengandung karakter yang tidak valid.';
    if(m.includes('rate limit')) return 'Terlalu banyak percobaan, coba lagi sebentar lagi.';
    return 'Terjadi kesalahan, coba lagi.';
  }

  function applyPanel(which){
    const isLogin = which==='login';
    document.getElementById('panelLogin').classList.toggle('active', isLogin);
    document.getElementById('panelDaftar').classList.toggle('active', !isLogin);
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabDaftar').classList.toggle('active', !isLogin);
    document.getElementById('tabLogin2').classList.toggle('active', isLogin);
    document.getElementById('tabDaftar2').classList.toggle('active', !isLogin);
    document.getElementById('topSub').textContent = isLogin ? 'Masuk untuk lanjut ngobrol' : 'Buat akun untuk mulai ngobrol';
    history.replaceState(null, '', isLogin ? '#masuk' : '#daftar');
  }
  function switchPanel(which){
    if(document.startViewTransition){ document.startViewTransition(()=>applyPanel(which)); }
    else{ applyPanel(which); }
  }

  // Catatan: index.html TIDAK LAGI mengurus status kunci enkripsi (PIN Enkripsi).
  // Login/daftar langsung lempar ke dashboard. Kunci ECDH dibuat otomatis secara diam-diam
  // di background (lihat dashboard.html -> boot()), dan modal restore/setel Password
  // Enkripsi baru muncul saat user benar-benar membuka sebuah chat (lihat chat.html -> init()).

  // Login
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u=document.getElementById('loginUsername').value.trim(), p=document.getElementById('loginPassword').value,
          b=document.getElementById('loginSubmitBtn'), err=document.getElementById('loginError'), errText=document.getElementById('loginErrorText');
    err.classList.remove('show'); b.disabled=true; b.classList.add('loading'); b.querySelector('.btn-label').textContent='Memeriksa...';
    const {data:liData, error} = await supabaseClient.auth.signInWithPassword({email: usernameToEmail(u), password: p});
    if(error){
      errText.textContent='Username atau kata sandi salah.'; err.classList.add('show');
      b.disabled=false; b.classList.remove('loading'); b.querySelector('.btn-label').textContent='Masuk';
      return;
    }
    window.location.replace('dashboard');
  });

  // Daftar
  document.getElementById('daftarForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u=document.getElementById('daftarUsername').value.trim(), p=document.getElementById('daftarPassword').value,
          b=document.getElementById('daftarSubmitBtn'), hint=document.getElementById('uHint'), pHint=document.getElementById('pHint');
    pHint.textContent='Minimal 6 karakter'; pHint.className='hint';
    if(p.length < 6){
      pHint.textContent='Kata sandi minimal 6 karakter'; pHint.className='hint err';
      return;
    }
    if(!validUsername(u)){
      hint.textContent='Username 3-20 karakter, hanya huruf/angka/underscore.'; hint.className='hint err';
      return;
    }
    b.disabled=true; b.classList.add('loading'); b.querySelector('.btn-label').textContent='Membuat...';
    const {data:sData, error:sErr} = await supabaseClient.auth.signUp({email: usernameToEmail(u), password: p});
    if(sErr){
      hint.textContent=translateAuthError(sErr.message); hint.className='hint err';
      b.disabled=false; b.classList.remove('loading'); b.querySelector('.btn-label').textContent='Daftar';
      return;
    }
    const pin = generatePin();
    await supabaseClient.from('profiles').insert({id: sData.user.id, username: u, pin: pin});
    // Buat & publish keypair ECDH secara diam-diam di background (biar orang lain
    // langsung bisa kirim pesan terenkripsi ke akun ini).
    try{ await E2E.ensureKeypair(sData.user.id); }
    catch(e){ console.error('Gagal setup kunci enkripsi:', e); }
    document.getElementById('panelDaftar').style.display='none';
    document.getElementById('topBadge').style.display='none';
    document.getElementById('pinValue').textContent=pin;
    document.getElementById('pinScreen').classList.add('show');
  });
  document.getElementById('pinCopyBtn').addEventListener('click', async () => {
    const pin=document.getElementById('pinValue').textContent, label=document.getElementById('pinCopyLabel');
    try{ await navigator.clipboard.writeText(pin); label.textContent='Tersalin ✓'; }
    catch(e){ label.textContent='Gagal menyalin'; }
    setTimeout(()=>{ label.textContent='Salin PIN'; }, 1800);
  });

  // Setelah lihat PIN, lanjut langsung ke dashboard. PIN Enkripsi TIDAK
  // ditanya di sini -- baru ditawarkan nanti saat user pertama kali buka sebuah chat
  // (lihat chat.html).
  document.getElementById('pinContinueBtn').addEventListener('click', () => { window.location.replace('dashboard'); });

  // Buka panel sesuai hash URL (index.html#daftar), default: login
  if(location.hash === '#daftar'){ switchPanel('daftar'); }

  // Kalau sesi masih aktif, langsung lempar ke dashboard tanpa perlu login ulang.
  (async()=>{
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(session){ window.location.replace('dashboard'); return; }
    document.getElementById('authGate').style.display='none';
  })();
</script>
</body>
</html>
