<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bang Bayu Message - Chats</title>
<style>
  :root{
    --bbm-blue-dark:#0077b6;
    --bbm-blue:#0092d1;
    --bbm-blue-light:#1aa8e6;
    --bg:#ffffff;
    --ink:#1c2b33;
    --muted:#7a8a92;
    --border:#e9edf0;
    --tab-active:#0092d1;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:420px;
    height:100%;
    background:#fff;
    box-shadow:0 0 40px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .appbar,.tabbar{flex-shrink:0;}

  /* top app bar */
  .appbar{
    background:var(--bbm-blue);
    color:#fff;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .appbar .left{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .appbar .hamburger{
    display:flex;
    flex-direction:column;
    gap:4px;
    cursor:pointer;
  }
  .appbar .hamburger span{
    width:22px;
    height:2.5px;
    background:#fff;
    border-radius:2px;
  }
  .appbar h1{
    margin:0;
    font-size:22px;
    font-weight:500;
  }
  .appbar .right{
    display:flex;
    align-items:center;
    gap:20px;
  }
  .appbar .icon-btn{
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* side drawer */
  .drawer-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:40;
  }
  .drawer-overlay.open{
    opacity:1;
    pointer-events:auto;
  }
  .drawer{
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    width:78%;
    max-width:300px;
    background:#fff;
    display:flex;
    flex-direction:column;
    transform:translateX(-100%);
    transition:transform .25s ease;
    z-index:41;
    box-shadow:2px 0 20px rgba(0,0,0,0.15);
  }
  .drawer.open{
    transform:translateX(0);
  }
  .drawer-header{
    background:var(--bbm-blue);
    color:#fff;
    padding:28px 18px 20px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .drawer-header .d-avatar{
    width:46px;height:46px;border-radius:50%;
    background:rgba(255,255,255,0.2);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:16px;
    flex-shrink:0;
  }
  .drawer-header .d-uname{
    font-size:15px;
    font-weight:600;
    word-break:break-word;
  }
  .drawer-header .d-pin{
    font-size:11.5px;
    opacity:0.85;
    margin-top:3px;
    letter-spacing:0.5px;
    font-family:'Courier New',monospace;
  }
  .drawer-body{
    flex:1;
    overflow-y:auto;
    padding:6px 0;
  }
  .drawer-item{
    display:flex;
    align-items:center;
    gap:16px;
    padding:13px 18px;
    cursor:pointer;
    color:var(--ink);
    font-size:14.5px;
  }
  .drawer-item:active{
    background:#f2f5f7;
  }
  .drawer-item svg{
    width:20px;height:20px;
    flex-shrink:0;
  }
  .drawer-footer{
    flex-shrink:0;
    border-top:1px solid var(--border);
    padding:6px 0;
  }
  .drawer-footer .drawer-item{
    color:#e0433d;
  }

  /* tabs */
  .tabbar{
    display:flex;
    background:#f7f9fa;
    border-bottom:1px solid var(--border);
  }
  .tabbar .tabitem{
    flex:1;
    padding:14px 0 11px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor:pointer;
  }
  .tabbar .tabitem.active{
    border-bottom:3px solid var(--tab-active);
  }
  .tabbar .tabitem svg{
    width:22px;
    height:22px;
  }
  .tabbar .tabitem .badge{
    position:absolute;
    top:8px;
    right:calc(50% - 16px);
    width:9px;
    height:9px;
    border-radius:50%;
    background:#e0433d;
    border:1.5px solid #f7f9fa;
  }

  /* chat list */
  .chatlist{
    flex:1;
    overflow-y:auto;
  }
  .chat-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .chat-item:active{
    background:#f5f8fa;
  }
  .avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:17px;
    color:#fff;
    background-size:cover;
    background-position:center;
  }
  .chat-main{
    flex:1;
    min-width:0;
  }
  .chat-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
  }
  .chat-name{
    font-size:16.5px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .chat-name .prefix-mark{
    font-weight:700;
    color:var(--ink);
  }
  .chat-bottom{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:3px;
  }
  .status-icon{
    width:16px;
    height:16px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:700;
    color:#fff;
  }
  .status-icon.delivered{background:#1a7fc2;}
  .status-icon.read{background:#3aa15a;}
  .status-icon.sent{background:#b8c2c7;}
  .status-icon.broadcast{background:none;}
  .status-icon.broadcast svg{width:16px;height:16px;}
  .chat-msg{
    font-size:13.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* fab */
  .fab{
    position:absolute;
    right:18px;
    bottom:24px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--bbm-blue);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    cursor:pointer;
  }
  .fab svg{width:24px;height:24px;}

  .appbar .username{
    font-size:12px;
    opacity:0.9;
    font-weight:400;
    margin-top:1px;
  }
  .logout-btn{
    cursor:pointer;
  }
  .tabbar .tabitem .badge{
    position:absolute;
    top:8px;
    right:calc(50% - 16px);
    min-width:16px;
    height:16px;
    border-radius:8px;
    background:#e0433d;
    border:1.5px solid #f7f9fa;
    color:#fff;
    font-size:10px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 3px;
  }

  /* dropdown menu titik tiga */
  .icon-btn{position:relative;}
  .dropdown-menu{
    position:absolute;
    top:38px;
    right:0;
    background:#fff;
    color:var(--ink);
    border-radius:8px;
    box-shadow:0 4px 18px rgba(0,0,0,0.22);
    min-width:170px;
    padding:6px 0;
    opacity:0;
    transform:translateY(-6px);
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
    z-index:50;
  }
  .dropdown-menu.open{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .dropdown-menu .dd-item{
    padding:11px 16px;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .dropdown-menu .dd-item:active{
    background:#f2f5f7;
  }
  .dropdown-menu .dd-item svg{
    width:18px;height:18px;
    flex-shrink:0;
    stroke:var(--ink);
  }

  /* modal PIN */
  .pin-modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:60;
    padding:24px;
  }
  .pin-modal-overlay.open{
    opacity:1;
    pointer-events:auto;
  }
  .pin-modal{
    background:#fff;
    border-radius:14px;
    padding:26px 22px;
    width:100%;
    max-width:300px;
    text-align:center;
  }
  .pin-modal .pm-title{
    font-size:15.5px;
    font-weight:700;
    margin-bottom:4px;
  }
  .pin-modal .pm-sub{
    font-size:12px;
    color:var(--muted);
    margin-bottom:18px;
    line-height:1.5;
  }
  .pin-modal .pm-box{
    background:#f1f5f7;
    border:1.5px dashed var(--bbm-blue);
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
  }
  .pin-modal .pm-pin{
    font-size:26px;
    font-weight:800;
    letter-spacing:4px;
    color:var(--bbm-blue-dark);
    font-family:'Courier New',monospace;
  }
  .pin-modal .pm-copy{
    font-size:12.5px;
    color:var(--bbm-blue);
    font-weight:600;
    background:none;
    border:none;
    cursor:pointer;
    margin-bottom:14px;
    padding:6px 10px;
  }
  .pin-modal .pm-close{
    width:100%;
    padding:11px 0;
    background:var(--bbm-blue);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js?v=2"></script>

<script>
  let currentUserPin = null;
  const colorPalette = ['#c77b8c','#3a3f47','#2f6b3a','#5b6b74','#2c2c2c','#7c3f9e','#8a7a4a','#1a7fc2'];
  function colorFor(id){
    let hash = 0;
    for(let i=0;i<id.length;i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
    return colorPalette[Math.abs(hash) % colorPalette.length];
  }
  function initials(username){
    return (username || '?').slice(0,2).toUpperCase();
  }
  function timeLabel(iso){
    const d = new Date(iso);
    const today = new Date();
    if(d.toDateString() === today.toDateString()){
      return d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
    }
    return d.toLocaleDateString('id-ID', { day:'numeric', month:'short' });
  }

  // Ikon centang gaya BBM/WhatsApp:
  // 1 centang abu = terkirim, 2 centang abu = diterima, 2 centang biru = dibaca
  function tickSvg(deliveredAt, readAt){
    if(readAt){
      return `<svg viewBox="0 0 20 15" width="15" height="11" fill="none" stroke="#2b8fe0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L11.2 3"/><path d="M6.2 7.6l3.3 3.3L18.5 3"/></svg>`;
    }
    if(deliveredAt){
      return `<svg viewBox="0 0 20 15" width="15" height="11" fill="none" stroke="#93a1a8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L11.2 3"/><path d="M6.2 7.6l3.3 3.3L18.5 3"/></svg>`;
    }
    return `<svg viewBox="0 0 16 15" width="12" height="11" fill="none" stroke="#93a1a8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7.6l3.3 3.3L14 3"/></svg>`;
  }

  function statusIconHTML(chat){
    if(!chat.mine) return '';
    return `<span class="status-icon" style="background:none;">${tickSvg(chat.deliveredAt, chat.readAt)}</span>`;
  }

  function render(chats){
    const list = document.getElementById('chatlist');
    if(!chats || chats.length === 0){
      list.innerHTML = `
        <div style="padding:40px 24px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;">
          Belum ada percakapan.<br>Buka tab Kontak lalu ketuk salah satu kontak untuk mulai chat.
        </div>`;
      return;
    }
    list.innerHTML = chats.map(chat => `
      <div class="chat-item" data-uid="${chat.uid}" data-uname="${chat.uname}">
        <div class="avatar" style="background:${colorFor(chat.uid)}">${initials(chat.uname)}</div>
        <div class="chat-main">
          <div class="chat-top">
            <div class="chat-name" style="${chat.unread ? 'font-weight:700;' : ''}">@${chat.uname}</div>
            <div style="font-size:11.5px;color:var(--muted);flex-shrink:0;">${timeLabel(chat.time)}</div>
          </div>
          <div class="chat-bottom">
            ${statusIconHTML(chat)}
            <div class="chat-msg" style="${chat.unread ? 'color:var(--ink);font-weight:600;' : ''}">${chat.preview}</div>
          </div>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.chat-item').forEach(item => {
      item.addEventListener('click', () => {
        window.location.href = `chat.html?uid=${item.dataset.uid}&uname=${encodeURIComponent(item.dataset.uname)}`;
      });
    });
  }

  async function loadChats(userId){
    const list = document.getElementById('chatlist');
    list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);font-size:13.5px;">Memuat...</div>';

    // Kontak yang sudah berteman (accepted)
    const { data: contactRows } = await supabaseClient
      .from('contacts')
      .select('requester_id, addressee_id')
      .eq('status', 'accepted')
      .or(`requester_id.eq.${userId},addressee_id.eq.${userId}`);

    const acceptedIds = new Set(
      (contactRows || []).map(r => r.requester_id === userId ? r.addressee_id : r.requester_id)
    );

    if(acceptedIds.size === 0){
      render([]);
      return;
    }

    // Ambil pesan terbaru yang melibatkan kita, lalu ambil satu pesan
    // terakhir per lawan bicara (pesan sudah terurut dari yang terbaru).
    const { data: msgRows } = await supabaseClient
      .from('messages')
      .select('sender_id, receiver_id, content, created_at, delivered_at, read_at')
      .or(`sender_id.eq.${userId},receiver_id.eq.${userId}`)
      .order('created_at', { ascending: false })
      .limit(300);

    const lastByPartner = new Map();
    (msgRows || []).forEach(m => {
      const partner = m.sender_id === userId ? m.receiver_id : m.sender_id;
      if(!acceptedIds.has(partner)) return;
      if(!lastByPartner.has(partner)) lastByPartner.set(partner, m);
    });

    if(lastByPartner.size === 0){
      render([]);
      return;
    }

    const partnerIds = [...lastByPartner.keys()];
    const { data: profilesData } = await supabaseClient
      .from('profiles')
      .select('id, username')
      .in('id', partnerIds);

    const profileMap = {};
    (profilesData || []).forEach(p => profileMap[p.id] = p.username);

    const chats = partnerIds.map(pid => {
      const m = lastByPartner.get(pid);
      const mine = m.sender_id === userId;
      return {
        uid: pid,
        uname: profileMap[pid] || 'Pengguna',
        preview: (mine ? 'Kamu: ' : '') + m.content,
        time: m.created_at,
        mine,
        deliveredAt: m.delivered_at,
        readAt: m.read_at,
        unread: !mine && !m.read_at
      };
    });

    render(chats);
  }

  // Tandai semua pesan masuk sebagai "diterima" begitu aplikasi dibuka
  // (menandakan pesan sudah sampai di perangkat penerima).
  async function markInboxDelivered(userId){
    await supabaseClient
      .from('messages')
      .update({ delivered_at: new Date().toISOString() })
      .eq('receiver_id', userId)
      .is('delivered_at', null);
  }

  // Proteksi halaman: kalau belum login, lempar ke login.html
  async function refreshNotifBadge(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(!session){
      window.location.href = 'login.html';
      return;
    }

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('username, pin')
      .eq('id', session.user.id)
      .maybeSingle();

    if(profile){
      currentUserPin = profile.pin;
      document.getElementById('currentUsername').textContent = '@' + profile.username;
      document.getElementById('drawerUname').textContent = '@' + profile.username;
      document.getElementById('drawerPin').textContent = 'PIN: ' + profile.pin;
      document.getElementById('drawerAvatar').textContent = initials(profile.username);
      document.getElementById('drawerAvatar').style.background = colorFor(session.user.id);
    }

    // Hitung notifikasi: permintaan pertemanan masuk yang belum dijawab
    // + notifikasi diterima/ditolak yang belum dilihat, tampilkan di badge
    const { count: pendingCount } = await supabaseClient
      .from('contacts')
      .select('id', { count: 'exact', head: true })
      .eq('addressee_id', session.user.id)
      .eq('status', 'pending');

    const { count: unseenCount } = await supabaseClient
      .from('contacts')
      .select('id', { count: 'exact', head: true })
      .eq('requester_id', session.user.id)
      .in('status', ['accepted', 'declined'])
      .eq('seen_by_requester', false);

    const totalNotif = (pendingCount || 0) + (unseenCount || 0);
    const badge = document.getElementById('notifBadge');
    if(totalNotif > 0){
      badge.textContent = totalNotif;
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }

    loadChats(session.user.id);
    markInboxDelivered(session.user.id);
  }

  refreshNotifBadge();

  // Halaman yang dipulihkan dari cache browser (mis. tombol back dari
  // notifikasi.html) tidak menjalankan ulang script di atas secara otomatis,
  // jadi kita paksa cek ulang badge tiap kali halaman ini kembali ditampilkan.
  window.addEventListener('pageshow', (e) => {
    if(e.persisted){
      refreshNotifBadge();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible'){
      refreshNotifBadge();
    }
  });

  document.getElementById('tabStatus').addEventListener('click', () => {
    window.location.href = 'status.html';
  });
  document.getElementById('tabKontak').addEventListener('click', () => {
    window.location.href = 'kontak.html';
  });
  document.getElementById('tabNotif').addEventListener('click', () => {
    window.location.href = 'notifikasi.html';
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });

  // Side drawer (menu garis tiga)
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const drawer = document.getElementById('drawer');
  const drawerOverlay = document.getElementById('drawerOverlay');

  function openDrawer(){
    drawer.classList.add('open');
    drawerOverlay.classList.add('open');
  }
  function closeDrawer(){
    drawer.classList.remove('open');
    drawerOverlay.classList.remove('open');
  }

  hamburgerBtn.addEventListener('click', openDrawer);
  drawerOverlay.addEventListener('click', closeDrawer);

  document.getElementById('drawerChats').addEventListener('click', closeDrawer);
  document.getElementById('drawerStatus').addEventListener('click', () => {
    window.location.href = 'status.html';
  });
  document.getElementById('drawerKontak').addEventListener('click', () => {
    window.location.href = 'kontak.html';
  });
  document.getElementById('drawerNotif').addEventListener('click', () => {
    window.location.href = 'notifikasi.html';
  });

  // Dropdown menu titik tiga
  const menuBtn = document.getElementById('menuBtn');
  const dropdownMenu = document.getElementById('dropdownMenu');
  const dropdownOverlayCatch = document.getElementById('dropdownOverlayCatch');

  function openDropdown(){
    dropdownMenu.classList.add('open');
    dropdownOverlayCatch.style.display = 'block';
  }
  function closeDropdown(){
    dropdownMenu.classList.remove('open');
    dropdownOverlayCatch.style.display = 'none';
  }

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if(dropdownMenu.classList.contains('open')){
      closeDropdown();
    } else {
      openDropdown();
    }
  });
  dropdownOverlayCatch.addEventListener('click', closeDropdown);

  document.getElementById('ddChatBaru').addEventListener('click', () => {
    closeDropdown();
    window.location.href = 'kontak.html';
  });

  // Modal PIN Saya
  const pinModalOverlay = document.getElementById('pinModalOverlay');
  const pmPinValue = document.getElementById('pmPinValue');
  const pmCopyBtn = document.getElementById('pmCopyBtn');
  const pmCloseBtn = document.getElementById('pmCloseBtn');

  document.getElementById('ddPinSaya').addEventListener('click', () => {
    closeDropdown();
    pmPinValue.textContent = currentUserPin || '—';
    pmCopyBtn.textContent = 'Salin PIN';
    pinModalOverlay.classList.add('open');
  });
  pmCloseBtn.addEventListener('click', () => {
    pinModalOverlay.classList.remove('open');
  });
  pinModalOverlay.addEventListener('click', (e) => {
    if(e.target === pinModalOverlay) pinModalOverlay.classList.remove('open');
  });
  pmCopyBtn.addEventListener('click', () => {
    if(!currentUserPin) return;
    navigator.clipboard?.writeText(currentUserPin).then(() => {
      pmCopyBtn.textContent = 'PIN Disalin ✓';
      setTimeout(() => pmCopyBtn.textContent = 'Salin PIN', 1500);
    }).catch(() => {
      pmCopyBtn.textContent = 'Gagal menyalin';
    });
  });
</script>
</body>
</html>
