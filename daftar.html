<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BBM Private Chat - Daftar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2a32">
<style>
  :root{ --bbm-blue-dark:#0b141a; --bbm-blue:#1b2a32; --bbm-blue-light:#233138; --bg:#121b22; --card-bg:#1b2a32; --ink:#e9edf0; --muted:#8696a0; --border:#2a3942; --ok:#2ecc71; --error:#f15c6d; }
  *{box-sizing:border-box;} html{overscroll-behavior:none;} body{margin:0;font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;}
  .phone{width:100%;max-width:420px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;}
  .topbar{background:var(--bbm-blue);color:#fff;padding:18px 20px 22px;text-align:center;}
  .logo-mark{width:56px;height:56px;border-radius:14px;background:#fff;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;}
  .body{flex:1;padding:26px 24px 40px;}
  .tabs{display:flex;background:var(--card-bg);border-radius:10px;padding:4px;margin-bottom:24px;}
  .tab{flex:1;text-align:center;padding:9px;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:8px;cursor:pointer;}
  .tab.active{background:var(--border);color:var(--ink);}
  .field{margin-bottom:16px;} .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .input-wrap{display:flex;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0 12px;}
  .input-wrap input{border:none;background:transparent;padding:12px 8px;color:var(--ink);width:100%;outline:none;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px;min-height:14px;} .hint.err{color:var(--error);} .hint.ok{color:var(--ok);}
  .btn{width:100%;padding:13px;background:var(--bbm-blue-light);color:#fff;border:none;border-radius:10px;font-weight:700;}
  .pin-screen{display:none;flex-direction:column;align-items:center;text-align:center;} .pin-screen.show{display:flex;}
  .pin-box{background:var(--card-bg);border:1.5px dashed var(--muted);border-radius:12px;padding:18px 26px;}
  .pin-box .pin{font-size:30px;color:var(--ink);font-weight:800;letter-spacing:4px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js?v=2"></script>
</head>
<body>
<div class="phone">
  <div class="topbar"><div class="logo-mark"><svg viewBox="0 0 24 24" width="32" height="32" fill="#1b2a32"><path d="M4 4h16a2 2 0 012 2v9a2 2 0 01-2 2H9l-5 4v-4H4a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg></div><h2>Private Chat</h2></div>
  <div class="body" id="formBody">
    <div class="tabs"><div class="tab active">Daftar</div><div class="tab" onclick="location.replace('login.html')">Masuk</div></div>
    <form id="daftarForm">
      <div class="field"><label>Username</label><div class="input-wrap"><input type="text" id="username" required></div><div class="hint" id="uHint"></div></div>
      <div class="field"><label>Kata Sandi</label><div class="input-wrap"><input type="password" id="password" required></div></div>
      <button type="submit" class="btn" id="submitBtn">Daftar</button>
    </form>
  </div>
  <div class="body pin-screen" id="pinScreen">
    <h2>Berhasil!</h2><p>Simpan PIN ini untuk temanmu.</p>
    <div class="pin-box"><div class="pin" id="pinValue"></div></div><br>
    <button class="btn" onclick="location.replace('index.html')">Lanjut ke Chat</button>
  </div>
</div>
<script>
  document.getElementById('daftarForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const u=document.getElementById('username').value.trim(), p=document.getElementById('password').value, b=document.getElementById('submitBtn'), hint=document.getElementById('uHint');
    b.disabled=true; b.textContent='Membuat...';
    const {data:sData, error:sErr} = await supabaseClient.auth.signUp({email: usernameToEmail(u), password: p});
    if(sErr){ hint.textContent=sErr.message; hint.className='hint err'; b.disabled=false; return; }
    const pin = generatePin();
    await supabaseClient.from('profiles').insert({id: sData.user.id, username: u, pin: pin});
    document.getElementById('formBody').style.display='none';
    document.getElementById('pinValue').textContent=pin;
    document.getElementById('pinScreen').classList.add('show');
  });
</script>
</body>
</html>
