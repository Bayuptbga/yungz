name: Deploy to GitHub Pages

# Jalan otomatis tiap kali ada push ke branch main.
# Kalau branch utama repo kamu namanya "master" (bukan "main"), ganti di bawah.
on:
  push:
    branches: [main]
  workflow_dispatch: # biar bisa di-trigger manual dari tab Actions kalau perlu

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version & inject ke semua file
        run: |
          VERSION="$(date -u +'%Y%m%d.%H%M')-$(git rev-parse --short HEAD)"
          echo "Versi build ini: $VERSION"
          # Ganti semua placeholder __VERSION__ di file html & sw.js jadi versi asli.
          # (aman, cuma nyentuh file text .html dan .js, gak nyentuh gambar/font)
          grep -rl "__VERSION__" --include="*.html" --include="*.js" . | \
            xargs -r sed -i "s/__VERSION__/$VERSION/g"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
