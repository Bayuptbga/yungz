<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Private Chat - Profil</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2a32">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Private Chat">
<style>
  @view-transition { navigation: auto; }
  :root{
    --bbm-blue-dark:#0b141a;
    --bbm-blue:#1b2a32;
    --bg:#121b22;
    --card-bg:#1b2a32;
    --ink:#e9edf0;
    --muted:#8696a0;
    --border:#2a3942;
    --ok:#2ecc71;
    --error:#f15c6d;
    --accent:#53bdeb;
  }
  *{box-sizing:border-box;}
  html{ overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; justify-content:center; -webkit-font-smoothing:antialiased; position:relative;
  }
  .phone{ width:100%; max-width:420px; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative; }
  #authGate{ position:absolute; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center; justify-content:center; }
  #authGate .spinner{ width:32px; height:32px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:authSpin .75s linear infinite; }
  @keyframes authSpin{ to{ transform:rotate(360deg); } }

  .appbar{ background:var(--bbm-blue); color:#fff; padding:calc(14px + env(safe-area-inset-top)) 16px 14px; display:flex; gap:16px; align-items:center; flex-shrink:0; }
  .appbar .back{ cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .appbar .back svg{ width:22px; height:22px; }
  .appbar h1{ margin:0; font-size:19px; font-weight:600; }

  .content{ flex:1; overflow-y:auto; padding:26px 16px 40px; }

  .hero{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:26px; }
  .hero .h-avatar{ width:92px; height:92px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:32px; color:#fff; background:var(--border); box-shadow:0 6px 18px rgba(0,0,0,0.35); flex-shrink:0; }
  .hero .h-uname{ font-size:20px; font-weight:700; margin-top:14px; word-break:break-word; }
  .hero .h-joined{ font-size:12.5px; color:var(--muted); margin-top:4px; }

  .stats-row{ display:flex; gap:10px; margin-bottom:22px; }
  .stat-card{ flex:1; background:var(--card-bg); border:1px solid var(--border); border-radius:14px; padding:14px 10px; text-align:center; }
  .stat-card .st-num{ font-size:20px; font-weight:700; color:var(--accent); }
  .stat-card .st-label{ font-size:11px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:0.4px; }

  .section-title{ font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; margin:0 4px 8px; }

  .card{ background:var(--card-bg); border:1px solid var(--border); border-radius:14px; padding:4px 16px; margin-bottom:22px; }
  .info-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; }
  .info-row + .info-row{ border-top:1px solid var(--border); }
  .info-row .i-label{ font-size:13.5px; color:var(--muted); }
  .info-row .i-value{ font-size:14px; font-weight:600; font-family:'Courier New',monospace; letter-spacing:1px; }
  .pin-copy-btn{ background:rgba(83,189,235,0.14); color:var(--accent); border:1px solid rgba(83,189,235,0.3); border-radius:7px; padding:5px 11px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:'Segoe UI',sans-serif; flex-shrink:0; }
  .pin-copy-btn:active{ transform:scale(0.96); }

  .btn{ width:100%; padding:12.5px 0; background:rgba(83,189,235,0.14); color:var(--accent); border:1px solid rgba(83,189,235,0.3); border-radius:10px; font-size:14.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn.danger{ background:rgba(241,92,109,0.12); color:#f15c6d; border:1px solid rgba(241,92,109,0.3); }
  .confirm-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity .18s ease; padding:24px; }
  .confirm-overlay.open{ opacity:1; pointer-events:auto; }
  .confirm-box{ background:var(--card-bg); border:1px solid var(--border); border-radius:16px; width:100%; max-width:320px; padding:22px 20px 16px; box-shadow:0 10px 40px rgba(0,0,0,0.5); transform:translateY(10px) scale(0.97); transition:transform .18s ease; }
  .confirm-overlay.open .confirm-box{ transform:translateY(0) scale(1); }
  .confirm-title{ font-size:16px; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .confirm-msg{ font-size:13.5px; line-height:19px; color:var(--ink-soft); margin-bottom:20px; }
  .confirm-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .confirm-actions button{ border:none; border-radius:10px; padding:10px 16px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .confirm-cancel{ background:var(--border); color:var(--ink); }
  .confirm-cancel:active{ background:var(--border); }
  .confirm-ok{ background:#f15c6d; color:#1b0a0c; }
  .confirm-ok:active{ background:#e14758; }
  .btn:active{ transform:scale(0.98); }
  .btn svg{ width:17px; height:17px; }
</style>
<script>
// device-gate (inline, sebelumnya file terpisah)
// Blokir akses dari desktop dan dari Chrome/browser biasa yang belum "install" app.
// CATATAN: ini gating UX, BUKAN kontrol keamanan sejati. User-Agent dan display-mode
// bisa dipalsukan oleh siapa pun yang cukup paham (DevTools device toolbar, dsb).
// Jangan andalkan ini sebagai satu-satunya lapisan proteksi.
//
// ==== SAKLAR ON/OFF ====
// 1) Saklar utama (permanen, berlaku di semua halaman yang load file ini):
//    ganti DEVICE_GATE_ENABLED di bawah ke false untuk mematikan gate sepenuhnya.
// 2) Saklar sementara (buat testing di browser sendiri, tanpa ubah kode/deploy ulang):
//    buka console lalu jalankan salah satu dari:
//      localStorage.setItem('device_gate_disabled', '1')   // matikan gate di browser ini
//      localStorage.removeItem('device_gate_disabled')     // nyalakan lagi
(function () {
  var DEVICE_GATE_ENABLED = false;

  if (!DEVICE_GATE_ENABLED) return;
  try {
    if (localStorage.getItem('device_gate_disabled') === '1') return;
  } catch (e) { /* localStorage diblokir (mis. private mode) -> lanjut gate seperti biasa */ }

  function isMobileUA() {
    return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  }

  function isInstalledApp() {
    // TWA (Android app wrapper dari PWABuilder) selalu kirim referrer ini
    if (document.referrer && document.referrer.startsWith('android-app://')) return true;
    // PWA yang di-"Add to Home Screen" lalu dibuka standalone (Android/desktop Chrome)
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    // iOS: PWA yang di-"Add to Home Screen"
    if (window.navigator.standalone === true) return true;
    return false;
  }

  if (!isMobileUA() || !isInstalledApp()) {
    location.replace('akses-ditolak');
  }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=1"></script>
</head>
<body>
<div class="phone">
  <div id="authGate"><div class="spinner"></div></div>
  <div class="appbar">
    <div class="back" onclick="location.href='dashboard.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <h1 id="pageTitle">Profil</h1>
  </div>
  <div class="content">
    <div class="hero">
      <div class="h-avatar" id="hAvatar">?</div>
      <div class="h-uname" id="hUname">—</div>
      <div class="h-joined" id="hJoined">Bergabung —</div>
    </div>

    <div class="stats-row" id="statsRow">
      <div class="stat-card"><div class="st-num" id="stKontak">—</div><div class="st-label">Kontak</div></div>
      <div class="stat-card"><div class="st-num" id="stStatus">—</div><div class="st-label">Status Aktif</div></div>
    </div>

    <div id="ownOnlySection">
    <div class="section-title">Info Akun</div>
    <div class="card">
      <div class="info-row">
        <div class="i-label">PIN</div>
        <div style="display:flex;align-items:center;gap:10px;"><div class="i-value" id="iPin">—</div><button class="pin-copy-btn" id="pinCopyBtn" type="button">Salin</button></div>
      </div>
    </div>

    <button class="btn" onclick="location.href='setelan.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>Buka Setelan</span>
    </button>
    </div>

    <button class="btn" id="msgBtn" style="display:none;background:linear-gradient(135deg,var(--accent) 0%,#1f8fc7 100%);color:#062733;border:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H8l-4 4V6a2 2 0 012-2h13a2 2 0 012 2z"/></svg>
      <span>Kirim Pesan</span>
    </button>

    <button class="btn danger" id="clearChatBtn" style="display:none;margin-top:10px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
      <span>Bersihkan Obrolan</span>
    </button>

    <button class="btn danger" id="deleteContactBtn" style="display:none;margin-top:10px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8l-4 4m0-4l4 4"/></svg>
      <span>Hapus Kontak</span>
    </button>
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitle">Konfirmasi</div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-actions">
      <button class="confirm-cancel" id="confirmCancelBtn">Batal</button>
      <button class="confirm-ok" id="confirmOkBtn">Hapus</button>
    </div>
  </div>
</div>
<script>
  const colorPalette=['#c77b8c','#3a3f47','#2f6b3a','#5b6b74','#2c2c2c','#7c3f9e','#8a7a4a','#1a7fc2'];
  function colorFor(id){let hash=0;for(let i=0;i<id.length;i++)hash=id.charCodeAt(i)+((hash<<5)-hash);return colorPalette[Math.abs(hash)%colorPalette.length];}
  function initials(u){return(u||'?').slice(0,2).toUpperCase();}
  function formatJoined(iso){
    if(!iso)return'Bergabung —';
    const d=new Date(iso);
    const bulan=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    return 'Bergabung sejak '+d.getDate()+' '+bulan[d.getMonth()]+' '+d.getFullYear();
  }

  let currentPin=null;

  function getParam(name){return new URLSearchParams(window.location.search).get(name);}
  const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  function showConfirm(title,msg,okLabel){
    return new Promise((resolve)=>{
      const ov=document.getElementById('confirmOverlay'),ok=document.getElementById('confirmOkBtn'),cancel=document.getElementById('confirmCancelBtn');
      document.getElementById('confirmTitle').textContent=title;document.getElementById('confirmMsg').textContent=msg;ok.textContent=okLabel||'Hapus';
      ov.classList.add('open');
      function cleanup(result){ov.classList.remove('open');ok.removeEventListener('click',onOk);cancel.removeEventListener('click',onCancel);ov.removeEventListener('click',onOverlay);resolve(result);}
      function onOk(){cleanup(true);} function onCancel(){cleanup(false);} function onOverlay(e){if(e.target===ov)cleanup(false);}
      ok.addEventListener('click',onOk);cancel.addEventListener('click',onCancel);ov.addEventListener('click',onOverlay);
    });
  }

  async function boot(){
    const {data:{session}} = await supabaseClient.auth.getSession();
    if(!session){ window.location.replace('index.html'); return; }
    const myUid=session.user.id;
    const rawParam=getParam('uid');
    const viewUid=(rawParam && UUID_RE.test(rawParam) && rawParam!==myUid) ? rawParam : myUid;
    const isOwn = viewUid===myUid;

    if(!isOwn){
      document.getElementById('pageTitle').textContent='Profil Kontak';
      document.getElementById('ownOnlySection').style.display='none';
      document.getElementById('statsRow').style.display='none';
      const msgBtn=document.getElementById('msgBtn');
      msgBtn.style.display='flex';
      const clearChatBtn=document.getElementById('clearChatBtn');
      const deleteContactBtn=document.getElementById('deleteContactBtn');
      clearChatBtn.style.display='flex';
      deleteContactBtn.style.display='flex';
      const {data:prof,error:profErr} = await supabaseClient.from('profiles').select('username, created_at').eq('id', viewUid).maybeSingle();
      if(profErr){ console.error('Gagal memuat profil kontak:',profErr); }
      if(!prof){ document.getElementById('hUname').textContent='Pengguna tidak ditemukan'; document.getElementById('authGate').style.display='none'; return; }
      document.getElementById('hUname').textContent = prof.username;
      document.getElementById('hAvatar').textContent = initials(prof.username);
      document.getElementById('hAvatar').style.background = colorFor(viewUid);
      document.getElementById('hJoined').textContent = formatJoined(prof.created_at);
      msgBtn.addEventListener('click',()=>{window.location.href=`chat.html?uid=${viewUid}&uname=${encodeURIComponent(prof.username)}`;});
      clearChatBtn.addEventListener('click',async()=>{
        const ok=await showConfirm('Hapus Untuk Semua Orang','Semua percakapan ini akan di hapus untuk semua orang','Hapus Permanen');
        if(!ok)return;
        const {error}=await supabaseClient.from('messages').delete().or(`and(sender_id.eq.${myUid},receiver_id.eq.${viewUid}),and(sender_id.eq.${viewUid},receiver_id.eq.${myUid})`);
        if(error){alert('Gagal menghapus permanen. Coba lagi.');return;}
        await supabaseClient.from('chat_clears').delete().eq('user_id',myUid).eq('peer_id',viewUid);
        alert('Obrolan berhasil dibersihkan.');
      });
      deleteContactBtn.addEventListener('click',async()=>{
        const ok=await showConfirm('Hapus Kontak Ini?','Menghapus kontak akan menghapus juga kontak anda dari teman ini.','Hapus');
        if(!ok)return;
        const {error}=await supabaseClient.from('contacts').delete().or(`and(requester_id.eq.${myUid},addressee_id.eq.${viewUid}),and(requester_id.eq.${viewUid},addressee_id.eq.${myUid})`);
        if(!error)window.location.href='dashboard.html';
      });
      document.getElementById('authGate').style.display = 'none';
      return;
    }

    const {data:prof} = await supabaseClient.from('profiles').select('username, pin').eq('id', myUid).maybeSingle();
    if(prof){
      currentPin = prof.pin;
      document.getElementById('hUname').textContent = prof.username;
      document.getElementById('iPin').textContent = prof.pin;
      document.getElementById('hAvatar').textContent = initials(prof.username);
      document.getElementById('hAvatar').style.background = colorFor(myUid);
    }
    document.getElementById('hJoined').textContent = formatJoined(session.user.created_at);

    const {data:cRows} = await supabaseClient.from('contacts').select('requester_id, addressee_id').eq('status','accepted').or(`requester_id.eq.${myUid},addressee_id.eq.${myUid}`);
    document.getElementById('stKontak').textContent = (cRows||[]).length;

    const {count:sCount} = await supabaseClient.from('statuses').select('id',{count:'exact',head:true}).eq('user_id',myUid).gt('expires_at', new Date().toISOString());
    document.getElementById('stStatus').textContent = sCount ?? 0;

    document.getElementById('authGate').style.display = 'none';
  }
  boot();

  document.getElementById('pinCopyBtn').addEventListener('click', async () => {
    if(!currentPin) return;
    const btn = document.getElementById('pinCopyBtn');
    try{ await navigator.clipboard.writeText(currentPin); btn.textContent='Tersalin ✓'; }
    catch(e){ btn.textContent='Gagal'; }
    setTimeout(()=>{ btn.textContent='Salin'; }, 1600);
  });
</script>
</body>
</html>
